<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2328">
<title>일품집 근무표</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#1E2328; --ink2:#4A525C; --sub:#8A9098; --line:#E6E1DA; --line2:#D6D0C7;
  --amber:#C8691C; --amber-ink:#FFFFFF; --amber-soft:#FBEBDD; --amber-deep:#9A4E12;
  --ok:#2E8B57; --ok-soft:#E3F2E9; --warn:#B98600; --warn-soft:#FFF4D6; --bad:#D64545; --bad-soft:#FCE9E9;
  --chip:#F3F0EB; --spot:#FFE9C7; --spot-ink:#7A4300; --tm:#1F6F78; --pm:#3C5A86;
  --field:#FFFFFF; --shadow:0 1px 2px rgba(30,35,40,.06),0 4px 16px rgba(30,35,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15181B; --card:#1D2125; --ink:#ECEEF0; --ink2:#C3C8CE; --sub:#8C939B; --line:#2C3238; --line2:#3A4148;
  --amber:#E08A3F; --amber-ink:#1A0F05; --amber-soft:#3A2818; --amber-deep:#F0A868;
  --ok:#6CC592; --ok-soft:#1C3326; --warn:#E8C04E; --warn-soft:#3A3116; --bad:#FF7A7A; --bad-soft:#3E1F1F;
  --chip:#262B30; --spot:#4A3615; --spot-ink:#FFD28A; --tm:#6FC9D2; --pm:#9DB8E6; --field:#23282D; --shadow:none; color-scheme:dark; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- 틀: 왼쪽 메뉴 + 본문 ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-right:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin-top:-2px}
.store{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 11px;text-align:left}
.store b{display:block;font-size:14.5px}
.store small{color:var(--sub);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:9px 11px;font-weight:600;color:var(--ink2);text-align:left}
.nav button:hover{background:var(--chip)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--card)}
.nav .ic{width:18px;text-align:center;opacity:.85}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--sub)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sub)}
.sync[data-k="ok"]::before{background:var(--ok)} .sync[data-k="busy"]::before{background:var(--warn)} .sync[data-k="err"]::before{background:var(--bad)}
.sync[data-k="err"]{color:var(--bad);font-weight:600}
.who{display:flex;align-items:center;justify-content:space-between;gap:6px}
.main{min-width:0;padding:22px 26px 60px}

/* ---------- 공통 요소 ---------- */
.vh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:25px;margin:0;letter-spacing:-.02em;line-height:1.2}
.vh .sub{color:var(--sub);font-size:13.5px;margin-top:3px}
.vh .sp{flex:1}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.pri:hover{background:var(--amber-deep);border-color:var(--amber-deep)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ic{padding:7px 11px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.card .help{color:var(--sub);font-size:13.5px;margin:0 0 14px}
.muted{color:var(--sub)}
.empty{padding:36px 10px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=tel],select,textarea{
  background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14.5px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 22%,transparent)}
textarea{width:100%;min-height:60px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.amber{background:var(--amber-soft);color:var(--amber-deep)}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
table.t th{font-size:12px;color:var(--sub);font-weight:600}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--bg)}
.scroll{overflow-x:auto}

/* ---------- 숫자 카드 ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:12.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:23px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)}
.kpi button.lnk{font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.lnk{border:0;background:none;padding:0;color:var(--amber-deep);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ---------- 주간 보드 ---------- */
.boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.board{display:grid;grid-template-columns:118px repeat(7,minmax(128px,1fr));min-width:1020px}
.board > div{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.board > div:nth-child(8n){border-right:0}
.bh{position:sticky;top:0;z-index:2;background:var(--card);padding:9px 10px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.bh.corner{font-size:12px;color:var(--sub);font-weight:600;align-items:center}
.bh .dt{border:0;background:none;padding:0;display:flex;align-items:baseline;gap:5px;text-align:left}
.bh .dt b{font-size:21px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bh .dt span{font-weight:600;color:var(--ink2);font-size:13px}
.bh.sun .dt span{color:var(--bad)} .bh.sat .dt span{color:var(--pm)}
.bh.today{background:var(--amber-soft)}
.bh.today .dt b{color:var(--amber-deep)}
.bh .cnt{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--ok-soft);color:var(--ok);font-variant-numeric:tabular-nums}
.bl{position:sticky;left:0;z-index:1;background:var(--card);padding:10px 10px 10px 13px;border-left:4px solid var(--pc,var(--line2))}
.bl b{display:block;font-size:14px}
.bl small{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.bc{padding:7px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;min-height:56px;position:relative;transition:background .12s}
.bc.drop{background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--amber)}
.bc.past{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.add{border:1px dashed var(--line2);background:none;color:var(--sub);border-radius:8px;padding:2px 8px;font-size:14px;line-height:1.35;opacity:0;transition:opacity .12s}
.bc:hover .add,.add:focus-visible{opacity:1}
@media (hover:none){.add{opacity:.7}}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid transparent;background:var(--chip);border-radius:8px;padding:3px 8px;font-size:13.5px;font-weight:600;line-height:1.35;user-select:none;-webkit-user-select:none}
.chip:hover{border-color:var(--ink2)}
.chip.g-add{border:1.5px dashed var(--ok);background:var(--ok-soft)}
.chip.g-chg{border:1.5px solid var(--pm)}
.chip.t-spot,.chip.g-spot{background:var(--spot);color:var(--spot-ink)}
.chip.g-payoff{background:var(--spot);color:var(--spot-ink);text-decoration:underline dotted}
.chip.t-weekly{box-shadow:inset 3px 0 0 var(--amber)}
.chip.dragging{opacity:.35}
.chip .tm,.chip .pmb,.chip .won,.chip .mm{font-style:normal;font-size:10.5px;font-weight:800;border-radius:5px;padding:0 5px;line-height:1.6}
.chip .tm{background:var(--tm);color:var(--card)} .chip .pmb{background:var(--pm);color:var(--card)}
.chip .soft{background:transparent!important;box-shadow:inset 0 0 0 1px currentColor} .chip .tm.soft{color:var(--tm)} .chip .pmb.soft{color:var(--pm)}
.chip .won{background:var(--ok-soft);color:var(--ok)}
.chip .mm{color:var(--amber-deep);padding:0}
.offs{padding:7px 9px;font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:2px 6px;align-content:flex-start}
.offs button{border:0;background:none;padding:0;color:var(--ink2);font-size:12.5px}
.offs button:hover{text-decoration:underline}
.offs .rs{color:var(--bad);font-size:11px;font-weight:600}
.bl.off{border-left-color:var(--line2);background:var(--bg)} .offs{background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.bf{padding:7px 10px;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--bg)}
.bf b{font-size:14px}
.bf .r{display:block;font-size:11.5px;color:var(--sub)}
.bf .sales{border:1px dashed var(--line2);background:var(--card);border-radius:7px;padding:1px 7px;font-size:12px;margin-top:3px}
.bl.foot{background:var(--bg);border-left-color:var(--ink)}
.ratio{font-weight:800} .ratio.ok{color:var(--ok)} .ratio.warn{color:var(--warn)} .ratio.bad{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--sub);margin:12px 2px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* ---------- 경고 ---------- */
.warns{display:flex;flex-direction:column;gap:6px}
.w{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:11px;background:var(--bg);font-size:13.5px}
.w .ico{font-weight:800;width:18px;text-align:center}
.w.bad{background:var(--bad-soft)} .w.bad .ico{color:var(--bad)}
.w.warn{background:var(--warn-soft)} .w.warn .ico{color:var(--warn)}
.w.info .ico{color:var(--tm)}
.w small{display:block;color:var(--sub);font-size:12px}

/* ---------- 월간 ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--sub);font-weight:700;text-align:center;padding-bottom:2px}
.cd{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 9px;min-height:94px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.cd:hover{border-color:var(--ink2)}
.cd.out{visibility:hidden}
.cd.today{border:2px solid var(--amber);padding:7px 8px}
.cd .n{font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.cd .n.sun{color:var(--bad)} .cd .n.sat{color:var(--pm)}

/* ---------- 하루 타임라인 ---------- */
.tl{display:grid;grid-template-columns:130px 1fr;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.tl > div{border-bottom:1px solid var(--line);min-height:36px}
.tl .nm{padding:7px 12px;font-size:13.5px;font-weight:600;border-left:4px solid var(--pc,var(--line2));display:flex;align-items:center;justify-content:space-between;gap:4px}
.tl .nm small{color:var(--sub);font-weight:500;font-size:11.5px}
.tl .lane{position:relative;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100%/var(--hrs)))}
.tl .blk{position:absolute;top:6px;bottom:6px;border-radius:7px;background:var(--pc,var(--ink2));color:#fff;font-size:11.5px;font-weight:700;padding:0 7px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.tl .blk.spot{background:var(--spot);color:var(--spot-ink)}
.tl .axis{display:flex;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.tl .axis span{flex:1;padding:6px 0 4px 3px}
.tl .cnt{display:flex;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tl .cnt span{flex:1;padding:6px 0 6px 3px;border-left:1px solid var(--line)}

/* ---------- 오른쪽 서랍 ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,22,25,.34);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--card);z-index:41;box-shadow:-12px 0 40px rgba(0,0,0,.14);transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer.wide{width:min(720px,100vw)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:19px;letter-spacing:-.01em}
.dh .sub{color:var(--sub);font-size:13px;margin-top:2px}
.dh .x{margin-left:auto;border:0;background:var(--chip);border-radius:9px;width:32px;height:32px;font-size:17px}
.db{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.df{padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.bc{transition:none}}
.sect{display:flex;flex-direction:column;gap:7px}
.sect > .lb{font-size:12.5px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.sect > .lb .bt{font-weight:500}
.seg4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg4 button{border:0;background:none;border-radius:8px;padding:8px 2px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg4 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg4.st button[data-v="off"][aria-pressed="true"],.seg4.st button[data-v="annual"][aria-pressed="true"]{color:var(--bad)}
.hint{font-size:12px;color:var(--sub)} .hint.bad{color:var(--bad);font-weight:600} .hint:empty{display:none}
.qt{display:flex;flex-wrap:wrap;gap:4px}
.qt button{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:2px 10px;font-size:12.5px}
.why{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:9px 11px;line-height:1.65}
.why b{color:var(--ink)}
.ck{display:flex;gap:7px;align-items:center;font-size:13.5px;cursor:pointer}
.ck input{width:17px;height:17px;accent-color:var(--amber)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:2px 8px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:6px 10px}
.pick .pg{grid-column:1/-1;font-size:11.5px;font-weight:800;color:var(--pc);margin-top:6px;border-bottom:1px solid var(--line)}
.pick label{display:flex;gap:6px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.pick label input{accent-color:var(--amber)}
.days7{display:inline-flex;gap:4px}
.days7 button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:13px}
.days7 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.patrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center}
.patrow b{font-size:13.5px;text-align:center}
.prev{font-size:13px;background:var(--amber-soft);border-radius:10px;padding:9px 11px;line-height:1.6}

/* ---------- 목록형 ---------- */
.rl{display:flex;flex-direction:column;gap:8px}
.ri{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:11px 14px;background:var(--card)}
.ri.past{opacity:.55}
.ri .wn{font-weight:750;font-variant-numeric:tabular-nums}
.ri .wn small{color:var(--sub);font-weight:600;margin-left:5px}
.ri .wh{font-size:13px;color:var(--sub)}
.eff{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.pat7{display:inline-grid;grid-template-columns:repeat(7,18px);gap:2px}
.pat7 i{height:18px;border-radius:4px;background:var(--chip);font-style:normal;font-size:9.5px;font-weight:800;display:grid;place-items:center;color:var(--sub)}
.pat7 i.off{background:var(--bad-soft);color:var(--bad)} .pat7 i.pm{background:var(--pm);color:#fff} .pat7 i.t{background:var(--tm);color:#fff} .pat7 i.wk{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}

/* ---------- 본사 현황 ---------- */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sc .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sc .t b{font-size:16px}
.sc .m{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc .m div{background:var(--bg);border-radius:10px;padding:8px 10px}
.sc .m small{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.sc .m b{font-size:17px;font-variant-numeric:tabular-nums}

/* ---------- 내 스케줄 ---------- */
.me{max-width:520px}
.mday{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.mday.off{background:transparent;box-shadow:none;border-style:dashed}

function tMin(t){ if(!t||typeof t!=='string') return null; const m=t.match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1])*60+(+m[2]):null; }

function zen(s){ return String(s||'').replace(/[０-９．：]/g,c=>c==='．'?'.':c==='：'?':':String.fromCharCode(c.charCodeAt(0)-0xFEE0)); }
// "11" "5시반" "17:30" "1730" "오전 9시" → 'HH:MM' (출근 1~9시=오후, 퇴근 1~11시=오후)
function parseT(raw,isEnd){
  let s=zen(raw).trim().replace(/\s+/g,''); if(!s) return null;
  const am=/^오전/.test(s), pmf=/^오후/.test(s); s=s.replace(/^(오전|오후)/,'').replace(/(출근|퇴근|출|퇴)$/,'');
  let m,h,mi=0,lit=false;
  if((m=s.match(/^(\d{1,2}):(\d{2})$/))){ h=+m[1]; mi=+m[2]; lit=m[1].length===2&&(m[1][0]==='0'||h>=12); }
  else if((m=s.match(/^(\d{1,2})(\d{2})$/))){ h=+m[1]; mi=+m[2]; lit=true; }
  else if((m=s.match(/^(\d{1,2})시?(?:(반)|(\d{1,2})분?)?$/))){ h=+m[1]; mi=m[2]?30:(m[3]?+m[3]:0); }
  else return null;
  if(h>24||mi>59) return null;
  if(pmf&&h<12) h+=12; else if(!am&&!lit&&h<12&&(isEnd?h<=11:h<=9)) h+=12;
  if(h>=24) return null; return pad(h)+':'+pad(mi);
}
function parseWon(raw){ let s=zen(raw).trim().replace(/[,\s원]/g,''); if(!s) return null;
  const man=/만$/.test(s); s=s.replace(/만$/,''); if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  let v=parseFloat(s); if(man||v<1000) v*=10000; return Math.round(v); }
function shLbl(sh,st){ if(!sh||sh.k==='full') return ''; if(sh.k==='pm') return '오후'; if(sh.k==='am') return '오전';
  if(sh.k==='t') return tLbl(sh.s)+(sh.e&&sh.e!==(st?st.close:'22:00')?'~'+tLbl(sh.e):''); return ''; }
function shSame(a,b){ const n=x=>(!x||x.k==='full')?'full':x.k==='pm'?'pm':x.k==='am'?'am':'t'+x.s+'-'+(x.e||''); return n(a)===n(b); }
function shIsPm(sh,st){ return !!sh&&(sh.k==='pm'||(sh.k==='t'&&tMin(sh.s)>=12*60)); }
// 근무시간: 영업시간 안쪽만 (급여 계산기와 같은 규칙)
function hoursOf(st,sh){
  if(!sh||sh.k==='full') return +st.fullH||10; if(sh.k==='pm') return +st.pmH||5; if(sh.k==='am') return +st.amH||5;

  a=Math.max(o,Math.min(c,a)); b=Math.max(o,Math.min(c,b)); return Math.max(0,Math.round((b-a)/60*100)/100);
}
function spanOf(st,sh){ // 타임라인 막대용 [시작분, 끝분]
  const o=tMin(st.open), c=tMin(st.close);

  return [Math.max(o,tMin(sh.s)),Math.min(c,tMin(sh.e||st.close))];
}

    const out={app:'ilpum',version:1,createdAt:new Date().toISOString(),tables:{}};
    out.stores=await this.fetchJ('/rest/v1/rpc/sch_my_stores',{method:'POST',body:'{}'});
    for(const [t,ord] of this.BK_TABLES){ if(prog) prog(t); let all=[],from=0;
      for(;;){ const rows=await this.fetchJ(`/rest/v1/${t}?select=*&order=${ord}&limit=1000&offset=${from}`)||[]; all=all.concat(rows); if(rows.length<1000) break; from+=1000; }
      out.tables[t]=all; }

    return out;
  },
  // 복원 = 덮어쓰기(upsert)만 해요. 파일에 없는 자료를 지우지는 않아요. 게시판 글은 서버 규칙상 다시 넣을 수 없어 건너뛰어요.
  async restoreAll(o,prog){
    if(!o||o.app!=='ilpum'||!o.tables) throw new Error('일품집 백업 파일이 아니에요');
    const done={};
    for(const [t,ord] of this.BK_TABLES){ if(t==='board_msgs') continue; const rows=o.tables[t]||[]; if(!rows.length){ done[t]=0; continue; }
      for(let i=0;i<rows.length;i+=200){ if(prog) prog(t,Math.min(i+200,rows.length),rows.length);
        await this.fetchJ(`/rest/v1/${t}?on_conflict=${ord}`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+200))}); }
      done[t]=rows.length; }
    return done;
  }
};

const DEF_POS=[['카운터','#3C5A86',1,1],['홀','#2F6B3F',3,4],['그릴','#B8621B',2,3],['주방','#8A2E2E',3,4],['장치','#5B3F86',0,0],['장잡','#1F6F78',0,0],['배송','#8A6A12',0,0],['주차','#55605A',0,1]];
const defStore=()=>({name:'',open:'11:00',close:'22:00',fullH:10,pmH:5,pmStart:'17:00',amH:5,amStart:'12:00',fivePlus:true,vis:'week',target:25});

const cleanPositions=a=>Array.isArray(a)? a.filter(p=>p&&typeof p.name==='string').map(p=>Object.assign({},p,{color:safeColor(p.color)})) : [];
// 본사가 이 계정 비밀번호를 바꾼 뒤 본인이 아직 다시 안 바꿨으면 그 시각(문자열), 아니면 ''
const pwByHqAt=u=>{ const h=u&&u.app_metadata&&u.app_metadata.pw_by_hq, m=u&&u.user_metadata&&u.user_metadata.pw_self_at; return h&&(!m||m<h)?h:''; };
const CLOSED_MARK=' (사용 중지)', isClosedName=n=>String(n||'').endsWith(CLOSED_MARK);
const TYPES={regular:'고정 근무',weekly:'매주 변동',spot:'단기·당일'};
// 보건증(건강진단결과서): 발급일 hcIss · 만료일 hcExp (만료일을 비우면 발급일 + 1년). 만료 30일 전부터 알림
// 입사 1년 되는 날 (같은 날짜 다음 해, 2/29 입사는 3/1)
function oneYear(k){ const m=String(k||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return ''; return ds(new Date(+m[1]+1,+m[2]-1,+m[3])); }
function hcExpOf(s){ if(!s) return ''; if(s.hcExp) return s.hcExp; if(!s.hcIss) return ''; const m=s.hcIss.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return ''; const d=new Date(+m[1]+1,+m[2]-1,+m[3]); d.setDate(d.getDate()-1); return ds(d); }
function hcState(s,today){ const exp=hcExpOf(s); if(!exp) return {exp:'',days:null,lv:'none'};
  const t=today||ds(new Date()); const days=Math.round((new Date(exp+'T00:00')-new Date(t+'T00:00'))/86400000);
  return {exp,days,lv:days<0?'over':days<=30?'soon':'ok'}; }
function buildD(items,storeName){
  const g=k=>items[k]||{}; const cfg=g('cfg');
  const store=Object.assign(defStore(),cfg.store||{}); if(!store.name) store.name=storeName||'';
  return {store, positions:(cleanPositions(cfg.positions).length)?cleanPositions(cfg.positions):defPositions(),

function staffList(D,all){ return Object.values(D.staff).filter(s=>all||s.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'ko')); }

/* ================= 근무 계산 엔진: 요일 패턴 → 기간 설정 → 주간 입력 → 그날만 ================= */
function rulesSorted(D){ return Object.values(D.rules).filter(r=>r&&r.from&&Array.isArray(r.ids)).sort((a,b)=>(a.at||0)-(b.at||0)); }
function ruleHit(r,sid,key,wd){ return r.ids.includes(sid)&&key>=r.from&&key<=(r.to||r.from)&&(!r.days||!r.days.length||r.days.includes(wd)); }
function resolve(D,d,opt={}){
  const rules=opt.rules||rulesSorted(D);
  const key=ds(d), wd=d.getDay(), di=(wd+6)%7, wk=weekKey(d);
  const list=[], offs=[]; const pnames=D.positions.map(p=>p.name);
  staffList(D).forEach(s=>{
    if(s.last&&key>s.last) return;            // 마지막 근무일이 지난 사람은 그 다음 날부터 근무표에서 빠져요 (지난 기록은 그대로)
    let working=false, reason=null, pos=s.pos, tag=null, sh=null, shSrc='', ruleIds=[], payoff=false, awSh=null, awMissing=false;
    if(s.type==='weekly'){ const en=(D.aw[wk]||{})[s.id];
      if(en){ working=!(en.off||[]).includes(di); if(!working) reason='주간휴무';
        else { const tt=(en.t||{})[di]; if(tt&&tt.s) awSh={k:'t',s:tt.s,e:tt.e||''}; else if((en.pm||[]).includes(di)) awSh={k:'pm'}; } }
      else awMissing=true; }
    else if(s.type==='spot'){ working=false; }
    else { working=!(s.off||[]).includes(wd); if(!working) reason='고정휴무'; }
    const pat=(s.wk||{})[wd]; if(pat&&pat.sh){ sh=pat.sh; shSrc='pat'; }
    rules.forEach(r=>{ if(!ruleHit(r,s.id,key,wd)) return; ruleIds.push(r.id);
      if(r.w==='off'){ working=false; reason=(r.memo&&r.memo.length<=8)?r.memo:'기간휴무'; }
      else if(r.w==='on'&&!working){ working=true; reason=null; tag='add'; }
      if(r.pos) pos=r.pos; if(r.sh){ sh=r.sh; shSrc='rule'; } });
    if(awSh){ sh=awSh; shSrc='week'; }
    const dc=opt.noDc&&opt.noDc===s.id? null : D.dc[key+'|'+s.id];
    if(dc){
      if(dc.st==='off'||dc.st==='annual'){ working=false; reason=dc.st==='annual'?'월차':'휴무'; }
      else if(dc.st==='extra'){ if(!working) tag='add'; working=true; reason=null; }
      else if(dc.st==='paidoff'){ working=true; payoff=true; tag='payoff'; reason=null; }
      if(dc.pos) pos=dc.pos; if(dc.sh){ sh=dc.sh; shSrc='day'; } }
    if(!pnames.includes(pos)) pos=pnames[0];
    if(!tag&&pos!==s.pos) tag='chg';
    if(working) list.push({sid:s.id,name:s.name,nl:s.note||'',type:s.type,pos,tag,sh,shSrc,ruleIds,payoff,memo:(dc&&dc.memo)||''});
    else if(reason||(awMissing&&!opt.quiet)) offs.push({sid:s.id,name:s.name,reason:reason||'미입력',ruleIds,missing:!reason&&awMissing});
  });
  Object.values(D.spot).filter(x=>x&&x.date===key).forEach(x=>{
    list.push({spotId:x.id,name:x.name,type:'spot',pos:pnames.includes(x.pos)?x.pos:pnames[0],tag:'spot',sh:x.sh||null,shSrc:x.sh?'day':'',ruleIds:[],memo:x.memo||'',nl:x.note||''}); });
  return {key,wd,list,offs};
}
function findItem(D,key,sid,opt={}){ return resolve(D,pd(key),opt).list.find(x=>x.sid===sid)||null; }

/* ---------- 금액 (권한 있는 사람만 D.pay가 채워짐) ---------- */
function payOf(D,x,key,wd){
  const P=D.pay||{}; let ov=null, src='';
  if(x.spotId){ ov=P['spot:'+x.spotId]||null; if(ov) src='day'; return {ov,src,base:null}; }
  const pat=P['pat:'+x.sid+':'+wd]; if(pat){ ov=pat; src='pat'; }
  x.ruleIds.forEach(id=>{ const p=P['rule:'+id]; if(p){ ov=p; src='rule'; } });
  const dp=P['dc:'+key+'|'+x.sid]; if(dp){ ov=dp; src='day'; }
  return {ov,src,base:P['staff:'+x.sid]||null};
}
function costOf(D,x,key,wd){
  const st=D.store; const h=x.payoff?0:hoursOf(st,x.sh); const {ov,src,base}=payOf(D,x,key,wd);
  let bc=null; if(base){ if(base.k==='hour') bc=base.v*h; else if(base.k==='day') bc=Math.round(base.v*h/(+st.fullH||10)); else if(base.k==='month') bc=Math.round(base.v/30); }
  let c=bc; if(ov){ if(ov.k==='day') c=ov.v; else if(ov.k==='hour') c=ov.v*h; else if(ov.k==='bonus') c=(bc||0)+ov.v; }
  const rate = h>0&&c!=null&&(ov?ov.k!=='bonus':base&&base.k!=='month')? c/h : null;
  return {h,c,ov,src,base,rate,cash:!!(ov&&ov.cash)};
}

/* ---------- 한 주 계산 + 노동법 경고 ---------- */
function reqOf(D,pos,wd){ const p=D.positions.find(x=>x.name===pos); return p&&p.req? (+p.req[wd]||0) : 0; }
function weekCalc(D,ws,canPay){
  const rules=rulesSorted(D); const st=D.store; const days=[]; const per={};
  let reqCells=0, filled=0, shortCells=0, hours=0, cost=0, costKnown=true, sales=0;
  for(let i=0;i<7;i++){ const d=addDays(ws,i); const R=resolve(D,d,{rules});

const pending=new Map(); let flushTimer=null, writing=false, flushFails=0, pollFails=0, pollNextAt=0, pollStarted=false;
const IDLE_MS=10*60*1000; let lastActive=Date.now();
function put(kind,id,data){
  const D=APP.D;
  if(kind==='cfg'){ if(id==='store') D.store=data; if(id==='positions') D.positions=cleanPositions(data); }
  else { const g=D[{staff:'staff',rule:'rules',dc:'dc',spot:'spot',aw:'aw',sales:'sales',pay:'pay'}[kind]]; if(data==null) delete g[id]; else g[id]=data; }
  pending.set(kind+'\u0001'+id,{sid:APP.sid,kind,id,data:data==null?null:JSON.parse(JSON.stringify(data))});
  clearTimeout(flushTimer); flushTimer=setTimeout(flush,350); schedSummary();
}
async function flush(){
  if(writing){ flushTimer=setTimeout(flush,300); return; } if(!pending.size) return;
  writing=true; setSync('저장 중…','busy'); const batch=[...pending.values()]; pending.clear();
  let denied=0;
  try{
    if(APP.be.putMany){ try{ await APP.be.putMany(batch); }
      catch(e){ if(e.code==='bad_pin'||e.code==='locked'){ APP.pinOk=false; Remote.pin=''; sessionStorage.removeItem('fr-pin'); localStorage.removeItem('fr-pin'); setSync('편집 잠김','err'); renderShell(); render(); toast(e.message+' · 저장하지 못했어요'); writing=false; return; }
        if(e.code||/row-level|permission|policy|42501|403/i.test(String(e.message))){ denied=batch.length; } else throw e; } }
    else for(let i=0;i<batch.length;i++){ const w=batch[i];
      try{ await APP.be.put(w.sid,w.kind,w.id,w.data); }
      catch(e){ if(/row-level|permission|policy|42501|403/i.test(String(e.message))){ denied++; continue; }   // 권한 없는 저장은 다시 시도하지 않음
        batch.slice(i).forEach(x=>{ const k=x.kind+'\u0001'+x.id; if(!pending.has(k)) pending.set(k,x); }); throw e; } }
    const t=new Date(); setSync(`${APP.be===Local?'이 기기에 저장':'저장됨'} ${pad(t.getHours())}:${pad(t.getMinutes())}`,'ok');
    flushFails=0; if(rtDirty){ rtDirty=false; setTimeout(()=>pollSoon(300),50); } if(denied) toast(`권한이 없어 저장하지 못한 항목이 ${denied}개 있어요`); }
  catch(e){ batch.forEach(x=>{ const k=x.kind+'\u0001'+x.id; if(!pending.has(k)) pending.set(k,x); }); flushFails++; setSync('저장 실패 — 다시 시도 중','err'); flushTimer=setTimeout(flush,Math.min(300000,4000*2**Math.min(flushFails-1,7))); }   // 실패하면 점점 천천히 (서버를 계속 두드리지 않도록)
  writing=false;
}
/* ---------- 실시간 알림: 다른 기기에서 근무표가 바뀌면 바로 반영 (Supabase Realtime) ---------- */
// 연결되어 있으면 서버가 "바뀌었어요" 하고 알려 줘서 계속 물어볼 필요가 없어요. 연결이 안 되면 예전처럼 60초마다 확인해요. (로그인 없이 보기는 실시간 없이 60초 확인)
let rtWs=null, rtOk=false, rtRef=0, rtBeat=null, rtTokT=null, rtWait=1000, rtSid='', rtTimer=null, rtDirty=false, lastPollAt=0;
function rtSet(v){ rtOk=!!v; const el=$('#sync'); if(el&&APP.sync&&APP.sync[1]==='ok'&&/^연결됨/.test(APP.sync[0])) setSync(rtOk?'연결됨 · 실시간':'연결됨','ok'); }
async function rtToken(){ const s=Remote.ses; if(s&&(s.expires_at||0)*1000>Date.now()+60000) return s.access_token; try{ await Remote.refresh(); }catch(e){} return Remote.ses&&Remote.ses.access_token; }
function rtStop(){ const w=rtWs; rtWs=null; clearInterval(rtBeat); clearInterval(rtTokT); clearTimeout(rtTimer); rtSet(false); if(w){ w.onclose=null; try{ w.close(); }catch(e){} } }
function rtStart(sid){
  rtStop(); rtSid=sid; if(APP.be!==Remote||!Remote.ses||!sid||!('WebSocket' in window)) return;
  let ws; try{ ws=new WebSocket(Remote.url.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(Remote.key)+'&vsn=1.0.0'); }catch(e){ return; }
  rtWs=ws; const topic='realtime:sch_'+sid;
  const send=(event,payload,t)=>{ try{ if(ws.readyState===1) ws.send(JSON.stringify({topic:t||topic,event,payload,ref:String(++rtRef)})); }catch(e){} };
  ws.onopen=async()=>{
    const tok=await rtToken(); if(!tok||rtWs!==ws){ try{ ws.close(); }catch(e){} return; }
    send('phx_join',{config:{broadcast:{ack:false,self:false},presence:{key:''},postgres_changes:[{event:'*',schema:'public',table:'sch_items',filter:'store_id=eq.'+sid}],private:false},access_token:tok});
    rtBeat=setInterval(()=>send('heartbeat',{},'phoenix'),25000);
    rtTokT=setInterval(async()=>{ const t=await rtToken(); if(t) send('access_token',{access_token:t}); },40*60*1000); };
  ws.onmessage=e=>{
    let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
    if(m.event==='phx_reply'&&m.topic===topic){ rtSet(m.payload&&m.payload.status==='ok'); if(rtOk){ rtWait=1000; pollSoon(100); } return; }     // 연결되면 한 번 맞춰 봄
    if(m.event==='postgres_changes'){ pollSoon(400); return; }
    if(m.event==='phx_error'||m.event==='phx_close'||(m.event==='system'&&m.payload&&m.payload.status==='error')) rtSet(false); };
  ws.onclose=()=>{ rtSet(false); if(rtWs===ws){ rtWs=null; clearInterval(rtBeat); clearInterval(rtTokT); rtTimer=setTimeout(()=>rtStart(rtSid),rtWait); rtWait=Math.min(rtWait*2,300000); } };
  ws.onerror=()=>{ try{ ws.close(); }catch(e){} };
}
let pollTimer=null;
function pollSoon(ms){ if(pending.size||writing){ rtDirty=true; return; } clearTimeout(pollTimer); pollTimer=setTimeout(()=>poll(true),ms); }     // 연달아 오는 알림은 한 번에 처리
async function poll(force){
  if(APP.be!==Remote||!APP.sid||document.hidden||pending.size||writing||Date.now()<pollNextAt) return;
  try{ if(window.frameElement&&window.frameElement.hidden) return; }catch(e){}      // 통합 틀에서 가려진 창은 쉼
  if(!force&&!rtOk&&Date.now()-lastActive>IDLE_MS) return;                            // 실시간이 안 될 때만: 10분 동안 아무도 안 만졌으면 쉼
  try{ lastPollAt=Date.now(); const rows=await APP.be.since(APP.sid); pollFails=0; if(!rows||!rows.length) return;
    const D=APP.D; rows.forEach(r=>{ const data=r.deleted?null:r.data;
      if(r.kind==='cfg'){ if(r.id==='store'&&data) D.store=Object.assign(defStore(),data); if(r.id==='positions'&&data) D.positions=cleanPositions(data); return; }
      const g=D[{staff:'staff',rule:'rules',dc:'dc',spot:'spot',aw:'aw',sales:'sales',pay:'pay'}[r.kind]]; if(!g) return; if(data==null) delete g[r.id]; else g[r.id]=data; });
    render(); setSync('연결됨 · 방금 새로 받음','ok');
  }catch(e){ pollFails++; pollNextAt=Date.now()+Math.min(300000,15000*2**Math.min(pollFails,5)); setSync('연결 확인 실패','err'); }
}

/* ================= 스케줄 카드 (날짜마다 포지션 줄이 다 보이는 화면) ================= */
function vCards(){
  const D=APP.D, ed=canEdit(), cp=canPay(); const rules=rulesSorted(D); const mode=APP.cardMode||'month', a=APP.anchor;
  let start,end,title;
  if(mode==='month'){ start=new Date(a.getFullYear(),a.getMonth(),1); end=new Date(a.getFullYear(),a.getMonth()+1,0); title=`${a.getFullYear()}년 ${a.getMonth()+1}월`; }
  else { start=new Date(a.getFullYear(),a.getMonth(),a.getDate()); end=addDays(start,6); title=`${md(ds(start))} ~ ${md(ds(end))}`; }
  const ws=weekStart(new Date()); const hasWeekly=staffList(D).some(s=>s.type==='weekly');
  const missingAw=hasWeekly?staffList(D).filter(s=>s.type==='weekly'&&!(D.aw[ds(ws)]||{})[s.id]).length:0;
  let cards='', usedAny=new Set(), allPos=new Set();
  for(let d=new Date(start); d<=end; d=addDays(d,1)){
    const R=resolve(D,d,{rules}), key=R.key; if(cp) R.list.forEach(x=>{ x.cost=costOf(D,x,key,R.wd); });
    const by={}; D.positions.forEach(p=>by[p.name]=[]); R.list.forEach(x=>(by[x.pos]=by[x.pos]||[]).push(x)); D.positions.forEach(p=>{ allPos.add(p.name); if(by[p.name].length) usedAny.add(p.name); });
    const rows=D.positions.map(p=>`<div class="cr ${(!APP.showEmpty&&!by[p.name].length)?'empty':''}" style="--pc:${p.color}"><div class="cl">${esc(p.name)}${by[p.name].length?`<span class="cn">${by[p.name].length}명</span>`:''}</div><div class="bc" data-drop="${esc(p.name)}" data-k="${key}">${by[p.name].map(x=>chipH(x,{key},cp,ed)).join('')}${ed?`<button class="add" data-a="add" data-pos="${esc(p.name)}" data-k="${key}" aria-label="${esc(p.name)}에 사람 넣기">+</button>`:''}</div></div>`).join('');
    const offs=R.offs.filter(o=>!o.missing||key>=ds(ws)).map(o=>`<button data-a="${o.missing?'weekly':'edit'}" data-sid="${o.sid}" data-k="${key}" ${o.missing?`data-k2="${weekKey(d)}"`:''}>${esc(o.name)}${o.reason!=='고정휴무'&&o.reason!=='주간휴무'&&!o.missing?`<span class="rs">(${esc(o.reason)})</span>`:''}${o.missing?'<span class="rs">(미입력)</span>':''}</button>`).join('');
    const wd=R.wd;
    cards+=`<div class="dcard ${key===todayStr?'today':''} ${key<todayStr?'past':''}"><div class="ch"><button class="cdate ${wd===0?'sun':wd===6?'sat':''}" data-a="gday" data-k="${key}" title="하루 타임라인"><b>${d.getMonth()+1}/${d.getDate()}</b><span>${DOW[wd]}</span></button>${key===todayStr?'<span class="tag amber">오늘</span>':''}<span class="cn">총 <b>${R.list.length}</b>명</span><span class="sp"></span>${ed?`<button class="btn sm" data-a="add" data-pos="${esc(D.positions[0].name)}" data-k="${key}">+ 사람</button>`:''}<button class="btn sm" data-a="img" data-t="day" data-k="${key}" title="카톡용 사진">사진</button></div>
      ${R.list.length?'':'<div class="cr0">근무자가 없어요</div>'}${rows}${offs?`<div class="cf"><b>쉬는 사람</b>${offs}</div>`:''}</div>`; }
  const hiddenN=allPos.size-usedAny.size;
  return `<div class="vh"><div><h1>${title}</h1><div class="sub">이름을 누르면 시간·금액·휴무, 끌어서(폰은 꾹) 옮기기·복사</div></div>
    <div class="row"><button class="btn ic" data-a="cnav" data-n="-1" aria-label="이전">‹</button><button class="btn" data-a="cnav" data-n="0">${mode==='month'?'이번 달':'오늘'}</button><button class="btn ic" data-a="cnav" data-n="1" aria-label="다음">›</button></div>
    <div class="seg" role="group" aria-label="기간"><button data-a="cmode" data-v="week7" aria-pressed="${mode!=='month'}">오늘부터 7일</button><button data-a="cmode" data-v="month" aria-pressed="${mode==='month'}">한 달</button></div>${viewSeg()}<span class="sp"></span>
    ${hiddenN>0||APP.showEmpty?`<button class="btn" data-a="empty">${APP.showEmpty?'빈 포지션 숨기기':`빈 포지션 ${hiddenN}개 보기`}</button>`:''}
    ${ed?'<button class="btn" data-a="posmgr">포지션 관리</button>':''}
    ${ed&&hasWeekly?`<button class="btn ${missingAw?'pri':''}" data-a="weekly" data-k="${ds(ws)}">매주 변동 입력${missingAw?` (${missingAw}명 미입력)`:''}</button>`:''}
    ${payToggle()}${EMBED&&window.parent!==window?'<button class="btn" data-a="tores">예약 보기 ›</button>':''}<button class="btn" data-a="print">인쇄</button></div>
    <div class="cards">${cards}</div>
    <div class="legend"><span><span class="chip">이름</span> 기본</span><span><span class="chip g-add">이름</span> 추가 출근</span><span><span class="chip g-chg">이름</span> 포지션 변경</span><span><span class="chip t-spot">이름</span> 단기·당일</span><span><span class="chip t-weekly">이름</span> 매주 변동</span><span><span class="chip">이름<i class="pmb">오후</i></span><span class="chip">이름<i class="tm soft">11시</i></span> 출근 시간</span></div>`;
}

// 이름 옆 표기(직원 편집 창의 "이름 옆 표기"): 화면에만 보이는 꼬리표, 메모·급여와 무관
const nlH=x=>x&&x.nl?`<em class="nl2">${esc(x.nl)}</em>`:'';
function chipH(x,dd,cp,ed){

  const cls=['chip','t-'+x.type,x.tag?'g-'+x.tag:''].join(' ');
  const tip=[x.name,TYPES[x.type]||'',l?l+' 출근':'',x.memo].filter(Boolean).join(' · ');
  return `<button class="${cls}" data-a="edit" data-sid="${x.sid||''}" data-spot="${x.spotId||''}" data-k="${dd.key}" data-pos="${esc(x.pos)}" title="${esc(tip)}">${esc(x.name)}${nlH(x)}${tb}${pb}${x.memo?'<i class="mm">✎</i>':''}</button>`;
}

  // 보드
  let g=`<div class="bh corner">포지션</div>`;

    g+=`<div class="${cls}"><button class="dt" data-a="gday" data-k="${dd.key}" title="하루 타임라인"><b>${d.getDate()}</b><span>${DOW[dd.wd]}</span></button><button class="dimg" data-a="img" data-t="day" data-k="${dd.key}" title="${mdw(dd.key)} 근무표를 카톡용 사진으로">사진</button></div>`; });

    <div class="legend"><span><span class="chip">이름</span> 기본</span><span><span class="chip g-add">이름</span> 추가 출근</span><span><span class="chip g-chg">이름</span> 포지션 변경</span><span><span class="chip t-spot">이름</span> 단기·당일</span><span><span class="chip t-weekly">이름</span> 매주 변동</span>

    return h;

/* ================= 월간 (전체 이름) ================= */
function vMonth(){
  const D=APP.D, st=D.store, a=APP.anchor, y=a.getFullYear(), m=a.getMonth(); const first=new Date(y,m,1), last=new Date(y,m+1,0).getDate(), lead=(first.getDay()+6)%7;

  for(let i=0;i<lead;i++) cells+='<div class="cd out"></div>';

    const list=R.list.slice().sort((p,q)=>order.indexOf(p.pos)-order.indexOf(q.pos)); list.forEach(x=>used.add(x.pos));
    const offs=R.offs.filter(o=>!o.missing);
    cells+=`<button class="cd ${key===todayStr?'today':''}" data-a="gweek" data-k="${key}"><span class="n ${R.wd===0?'sun':R.wd===6?'sat':''}">${day}</span>
      <span class="nl">${list.map(x=>{ const t=shLbl(x.sh,st); return `<i class="${x.type==='spot'?'sp':''}" style="--pc:${posColor(x.pos)}">${esc(x.name)}${nlH(x)}${t?`<u>${esc(t)}</u>`:''}</i>`; }).join('')}</span>

    <div class="row"><button class="btn ic" data-a="mon" data-n="-1">‹</button><button class="btn" data-a="mon" data-n="0">이번 달</button><button class="btn ic" data-a="mon" data-n="1">›</button></div>${viewSeg()}<span class="sp"></span>
    <button class="btn pri" data-a="img" data-t="day" data-k="${todayStr.startsWith(ym)?todayStr:ym+'-01'}">하루 사진 보내기</button></div>

/* ================= 하루 타임라인 ================= */
function vDay(){
  const D=APP.D, st=D.store, key=APP.day, R=resolve(D,pd(key)); const o=tMin(st.open), c=tMin(st.close); const hrs=Math.max(1,Math.round((c-o)/60));

  const cnt=[]; for(let i=0;i<hrs;i++){ const t=o+i*60+30; cnt.push(R.list.filter(x=>{ const [a,b]=spanOf(st,x.sh); return a<=t&&t<b; }).length); }

    <div class="row"><button class="btn ic" data-a="dayn" data-n="-1">‹</button><button class="btn" data-a="dayn" data-n="0">오늘</button><button class="btn ic" data-a="dayn" data-n="1">›</button></div>${viewSeg()}<span class="sp"></span>
    <button class="btn pri" data-a="img" data-t="day" data-k="${key}">하루 사진 보내기</button>${ed?`<button class="btn" data-a="add" data-pos="${esc(D.positions[0].name)}" data-k="${key}">+ 사람 넣기</button>`:''}</div>
    <div class="tl"><div class="nm" style="border-left-color:transparent"><small>시간대별 인원</small></div><div><div class="axis">${Array.from({length:hrs},(_,i)=>`<span>${(Math.floor((o+i*60)/60)%12)||12}시</span>`).join('')}</div><div class="cnt">${cnt.map(n=>`<span>${n}</span>`).join('')}</div></div>
    ${rows||'<div class="nm">근무자 없음</div><div></div>'}</div>`;
}
function dayText(key){
  const D=APP.D, R=resolve(D,pd(key)), d=pd(key);
  const lines=[`[${D.store.name}] ${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]}) 근무`];
  D.positions.forEach(p=>{ const l=R.list.filter(x=>x.pos===p.name); if(l.length) lines.push(`${p.name}: ${l.map(x=>x.name+(shLbl(x.sh,D.store)?'('+shLbl(x.sh,D.store)+')':'')).join(', ')}`); });
  const off=R.offs.filter(x=>!x.missing); if(off.length) lines.push(`휴무: ${off.map(x=>x.name).join(', ')}`);

/* ================= 직원 ================= */
function pat7(s){ return `<span class="pat7">${WD_MON.map(wd=>{ const off=s.type==='regular'&&(s.off||[]).includes(wd); const c=(s.wk||{})[wd]; const k=off?'off':c&&c.sh?(c.sh.k==='pm'?'pm':c.sh.k==='am'?'pm':c.sh.k==='t'?'t':''):(s.type!=='regular'?'wk':'');
  return `<i class="${k}" title="${DOW[wd]}">${off?'휴':DOW[wd]}</i>`; }).join('')}</span>`; }

/* ================= 카톡용 사진 (캔버스로 직접 그림 · 금액은 절대 안 들어감) ================= */
const IMG_FONT='"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
function mkCanvas(W,H,sc){ const c=document.createElement('canvas'); c.width=Math.ceil(W*sc); c.height=Math.ceil(H*sc); const g=c.getContext('2d'); g.scale(sc,sc); g.fillStyle='#fff'; g.fillRect(0,0,W,H); return {c,g}; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const scratch=()=>mkCanvas(10,10,1).g;
// 이름들을 폭에 맞춰 줄바꿈하며 배치
function flow(g,items,x,y,maxW,fs,lh,gap){
  let cx=x, cy=y; const ops=[]; const sf=Math.max(9,Math.round(fs*.66));
  items.forEach(it=>{ g.font=`${it.b?800:600} ${fs}px ${IMG_FONT}`; const w1=g.measureText(it.t).width; let w2=0;
    if(it.s){ g.font=`600 ${sf}px ${IMG_FONT}`; w2=g.measureText(it.s).width+2; }
    const w=w1+w2; if(cx>x&&cx+w>x+maxW){ cx=x; cy+=lh; } ops.push({it,x:cx,y:cy,w1,fs,sf}); cx+=w+gap; });
  return {ops,h:(cy-y)+lh};
}
function paintFlow(g,f){ f.ops.forEach(o=>{ g.font=`${o.it.b?800:600} ${o.fs}px ${IMG_FONT}`; g.fillStyle=o.it.c||'#111'; g.fillText(o.it.t,o.x,o.y+o.fs*.9);
  if(o.it.s){ g.font=`600 ${o.sf}px ${IMG_FONT}`; g.fillStyle=o.it.sc||'#8A6A3A'; g.fillText(o.it.s,o.x+o.w1+2,o.y+o.fs*.9); } }); }
function imgItem(x,st,color){ return {t:x.name,s:shLbl(x.sh,st),c:x.type==='spot'?'#B8621B':(color||'#111'),b:x.type==='spot'}; }
async function loadFonts(){ try{ if(document.fonts){ await Promise.race([Promise.all([document.fonts.load(`600 20px ${IMG_FONT}`),document.fonts.load(`800 20px ${IMG_FONT}`)]),new Promise(r=>setTimeout(r,1200))]); } }catch(e){} }

/* ---------- 하루 ---------- */
function drawDay(key){
  const D=APP.D, st=D.store, R=resolve(D,pd(key)), d=pd(key); const W=720, P=30, sc=2;
  const rows=D.positions.map(p=>({p,items:R.list.filter(x=>x.pos===p.name).map(x=>imgItem(x,st))})).filter(r=>r.items.length);
  const g0=scratch(), labelW=128, fs=32, lh=46, pad=16;
  const laid=rows.map(r=>({r,f:flow(g0,r.items,0,0,W-2*P-labelW-26,fs,lh,24)}));
  const bodyH=rows.length?laid.reduce((a,l)=>a+l.f.h+pad*2,0):120, top=P+134, H=top+bodyH+P+8;
  const {c,g}=mkCanvas(W,H,sc); g.textBaseline='alphabetic';
  g.font=`600 20px ${IMG_FONT}`; g.fillStyle='#777'; g.fillText('일품집 근무표',P,P+18); g.textAlign='right'; g.fillText(`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`,W-P,P+18); g.textAlign='left';
  g.font=`800 54px ${IMG_FONT}`; g.fillStyle='#111'; g.fillText(`${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`,P,P+78);
  g.font=`600 22px ${IMG_FONT}`; g.fillStyle='#777'; g.fillText(`${st.name} · 근무 ${R.list.length}명`,P,P+110);
  rr(g,P,top,W-2*P,bodyH,14); g.lineWidth=3; g.strokeStyle='#555'; g.stroke();
  if(!rows.length){ g.font=`600 28px ${IMG_FONT}`; g.fillStyle='#888'; g.textAlign='center'; g.fillText('근무자가 없어요',W/2,top+70); g.textAlign='left'; }
  let y=top; laid.forEach((l,i)=>{ const h=l.f.h+pad*2;
    g.save(); rr(g,P,top,W-2*P,bodyH,14); g.clip(); g.fillStyle=l.r.p.color; g.fillRect(P,y,10,h); g.restore();
    if(i){ g.save(); g.setLineDash([7,6]); g.strokeStyle='#bbb'; g.lineWidth=2; g.beginPath(); g.moveTo(P+14,y); g.lineTo(W-P-14,y); g.stroke(); g.restore(); }
    g.font=`800 28px ${IMG_FONT}`; g.fillStyle=l.r.p.color; g.fillText(l.r.p.name,P+26,y+pad+fs*.9);
    const f=flow(g,l.r.items,P+26+labelW,y+pad,W-2*P-labelW-26-16,fs,lh,24); paintFlow(g,f); y+=h; });
  return c;
}

/* ---------- 한 주 ---------- */
function drawWeek(wk){
  const D=APP.D, st=D.store, ws=pd(wk), rules=rulesSorted(D); const P=24, PC=94, CW=168, W=P*2+PC+CW*7, sc=2;
  const days=[...Array(7)].map((_,i)=>{ const d=addDays(ws,i); return {d,R:resolve(D,d,{rules,quiet:true})}; });
  const g0=scratch(); const fs=19, lh=27;
  const pos=D.positions.filter(p=>days.some(x=>x.R.list.some(z=>z.pos===p.name)));
  const cellF=(list,cw)=>flow(g0,list.map(x=>imgItem(x,st,null)),0,0,cw-14,fs,lh,10);
  const rowsH=pos.map(p=>Math.max(...days.map(x=>cellF(x.R.list.filter(z=>z.pos===p.name),CW).h))+14);
  const offF=days.map(x=>flow(g0,x.R.offs.filter(o=>!o.missing).map(o=>({t:o.name,c:'#777'})),0,0,CW-14,16,22,8)); const offH=Math.max(...offF.map(f=>f.h),22)+14;

  if(id==='impFile'&&t.files[0]){ t.files[0].text().then(txt=>{ try{ const o=JSON.parse(txt); const n=importOld(o.data&&o.data.staff?o.data:o); render(); toast(`직원 ${n}명과 설정을 가져왔어요`); }catch(err){ toast(err.message||'파일을 읽지 못했어요'); } }); t.value=''; }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#drawer').classList.contains('on')) closeDrawer();

  if(e.key==='Enter'&&e.target.id==='npN'&&!e.isComposing) addPos(); });
/* ---------- 끌어서 옮기기·복사 (마우스는 바로, 폰은 꾹 누른 채) ---------- */
let DR=null, DRSUP=0;
const srcOf=el=>({sid:el.dataset.sid,spot:el.dataset.spot,k:el.dataset.k,pos:el.dataset.pos});
function dragBegin(el,x,y,touch){ DR={el,src:srcOf(el),x,y,x0:x,y0:y,on:false,touch,tgt:null,timer:null}; }
function dragStart(){ if(!DR||DR.on) return; DR.on=true; document.body.classList.add('dragging-now');
  const g=DR.el.cloneNode(true); g.classList.add('dghost'); g.removeAttribute('data-a'); g.removeAttribute('title'); document.body.appendChild(g); DR.ghost=g; DR.el.classList.add('dragging');
  // 빈 포지션은 화면을 밀어내지 않고 카드 아래에 떠 있는 판으로 보여줘요 (끌기 시작할 때 화면이 움직이던 것 방지)
  const card=DR.el.closest('.cards .dcard'); if(card){ const rows=[...card.querySelectorAll('.cr.empty')];
    if(rows.length){ const pal=document.createElement('div'); pal.className='dpal'; pal.innerHTML='<span class="dpl">빈 포지션으로</span>'+rows.map(r=>{ const b=r.querySelector('.bc[data-drop]'); return b?`<div class="bc dpal-i" data-drop="${esc(b.dataset.drop)}" data-k="${esc(b.dataset.k)}" style="${r.getAttribute('style')||''}">${esc(b.dataset.drop)}</div>`:''; }).join('');
      document.body.appendChild(pal); const cr=card.getBoundingClientRect(), ph=pal.offsetHeight; pal.style.width=Math.max(160,cr.width)+'px'; pal.style.left=Math.max(4,Math.min(cr.left,innerWidth-pal.offsetWidth-4))+'px'; pal.style.top=Math.max(4,Math.min(cr.bottom+4,innerHeight-ph-8))+'px'; DR.pal=pal; } }
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(_){} dragMove(DR.x,DR.y); }
function dragMove(x,y){ if(!DR||!DR.ghost) return; DR.x=x; DR.y=y; DR.ghost.style.left=x+'px'; DR.ghost.style.top=y+'px';
  const w=$('.boardwrap'); if(w){ const r=w.getBoundingClientRect(); if(x>r.right-50) w.scrollLeft+=16; else if(x<r.left+130) w.scrollLeft-=16; if(y>r.bottom-40) w.scrollTop+=14; else if(y<r.top+50) w.scrollTop-=14; }
  const t=document.elementFromPoint(x,y), c=t&&t.closest?t.closest('.bc[data-drop]'):null;
  $$('.bc.drop').forEach(n=>{ if(n!==c) n.classList.remove('drop'); });
  if(c&&!(c.dataset.k===DR.src.k&&c.dataset.drop===DR.src.pos)){ c.classList.add('drop'); DR.tgt=c; DR.ghost.dataset.mode=c.dataset.k===DR.src.k?'move':'copy'; }
  else { DR.tgt=null; DR.ghost.dataset.mode=''; } }
function dragEnd(commit){ if(!DR) return; clearTimeout(DR.timer); const d=DR; DR=null;
  if(d.ghost) d.ghost.remove(); if(d.pal) d.pal.remove(); d.el.classList.remove('dragging'); $$('.bc.drop').forEach(n=>n.classList.remove('drop')); document.body.classList.remove('dragging-now');
  if(d.on){ DRSUP=Date.now(); if(commit&&d.tgt) dropTo(d.src,d.tgt.dataset.k,d.tgt.dataset.drop); } }
function dropTo(src,tk,pos){
  const D=APP.D;
  if(tk===src.k){                                   // 같은 날 → 그 날만 포지션 변경
    if(src.pos===pos) return;
    if(src.spot){ put('spot',src.spot,{...D.spot[src.spot],pos}); }
    else { const k=src.k+'|'+src.sid, b=findItem(D,src.k,src.sid,{noDc:src.sid}); const o=Object.assign({},D.dc[k]||{}); if(b&&b.pos===pos) delete o.pos; else o.pos=pos; put('dc',k,Object.keys(o).length?o:null); }
    toast(`그 날만 ${pos}(으)로 옮겼어요`); render(); return; }
  // 다른 날 → 복사
  if(src.spot){ const x=D.spot[src.spot]; if(!x) return;
    if(Object.values(D.spot).some(z=>z.date===tk&&z.name===x.name)) return toast(`${x.name}은(는) ${mdw(tk)}에 이미 있어요`);
    const id=uid(); put('spot',id,{...x,id,date:tk,pos}); const pv=(D.pay||{})['spot:'+src.spot]; if(pv) putPay('spot:'+id,pv);
    toast(`${x.name} → ${mdw(tk)} ${pos}에 복사했어요`); render(); return; }
  const s=D.staff[src.sid]; if(!s) return;
  if(findItem(D,tk,src.sid)) return toast(`${s.name}님은 ${mdw(tk)}에 이미 근무해요`);
  const from=findItem(D,src.k,src.sid); const k=tk+'|'+src.sid; const o=Object.assign({},D.dc[k]||{});
  o.st='extra'; if(pos!==s.pos) o.pos=pos; else delete o.pos; if(from&&from.shSrc==='day'&&from.sh) o.sh=from.sh;
  put('dc',k,o); toast(`${s.name} → ${mdw(tk)} ${pos}에 복사했어요`); render(); }
const chipAt=t=>t&&t.closest?t.closest('.board .chip[data-k], .cards .chip[data-k]'):null;
document.addEventListener('pointerdown',ev=>{ if(!canEdit()||ev.pointerType!=='mouse'||ev.button!==0) return; const c=chipAt(ev.target); if(c) dragBegin(c,ev.clientX,ev.clientY,false); });
document.addEventListener('pointermove',ev=>{ if(!DR||DR.touch||ev.pointerType!=='mouse') return; if(!DR.on){ if(Math.hypot(ev.clientX-DR.x0,ev.clientY-DR.y0)<6) return; dragStart(); } dragMove(ev.clientX,ev.clientY); });
document.addEventListener('pointerup',()=>{ if(DR&&!DR.touch) dragEnd(true); });
document.addEventListener('pointercancel',()=>{ if(DR&&!DR.touch) dragEnd(false); });
document.addEventListener('touchstart',ev=>{ if(!canEdit()||ev.touches.length!==1) return; const c=chipAt(ev.target); if(!c) return; const t=ev.touches[0]; dragBegin(c,t.clientX,t.clientY,true); DR.timer=setTimeout(dragStart,320); },{passive:true});
document.addEventListener('touchmove',ev=>{ if(!DR||!DR.touch) return; const t=ev.touches[0];
  if(!DR.on){ if(Math.hypot(t.clientX-DR.x0,t.clientY-DR.y0)>10){ clearTimeout(DR.timer); DR=null; } return; }
  ev.preventDefault(); dragMove(t.clientX,t.clientY); },{passive:false});
document.addEventListener('touchend',()=>{ if(DR&&DR.touch) dragEnd(true); });
document.addEventListener('touchcancel',()=>{ if(DR&&DR.touch) dragEnd(false); });
document.addEventListener('contextmenu',ev=>{ if(DR&&DR.touch) ev.preventDefault(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&DR) dragEnd(false); });

boot();

</script>
