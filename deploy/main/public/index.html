<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<title>일품집 통합관리</title>
<style>
:root{
  --nav:#1F4D3A; --nav-h:#2A5E49; --nav-ink:#DCE8E1; --nav-sub:#8FAE9F; --gold:#D8B16E;
  --bg:#F5F6F4; --card:#FFFFFF; --ink:#1B2620; --sub:#6B7871; --line:#E3E8E5; --brand:#2F6B4F; --brand-soft:#E3F0E8;
  --ok:#2E8B57; --warn:#B98600; --bad:#D64545; --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.05);
  --w:232px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --nav:#14251D; --nav-h:#1D3429; --nav-ink:#D5E3DB; --nav-sub:#7E9A8C;
  --bg:#111513; --card:#1A201D; --ink:#E8EEEA; --sub:#93A199; --line:#2B3631; --brand:#6CC592; --brand-soft:#1F3A2B;
  --ok:#6CC592; --warn:#E8C04E; --bad:#FF7A7A; --shadow:none; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
[hidden]{display:none!important}

/* ---------- 왼쪽 메뉴 ---------- */
.nav{position:fixed;inset:0 auto 0 0;width:var(--w);background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;z-index:30;transition:transform .22s ease;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.mk{width:40px;height:40px;border-radius:11px;background:var(--gold);display:grid;place-items:center;color:#2A2415;font-weight:900;font-size:20px;flex:0 0 auto}
.brand b{display:block;font-size:19px;color:#fff;letter-spacing:-.02em;line-height:1.15}
.brand small{color:var(--nav-sub);font-size:12px}
.lbl{font-size:10.5px;letter-spacing:.14em;color:var(--nav-sub);font-weight:700;padding:6px 10px 8px}
.mi{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--nav-ink);padding:10px 11px;border-radius:10px;font-size:14.5px;font-weight:600;text-align:left;margin-bottom:2px}
.mi:hover{background:var(--nav-h)}
.mi .bdg{margin-left:auto;background:#E5533D;color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:0 8px;min-width:22px;text-align:center;line-height:20px}
.mi[aria-current="page"]{background:#fff;color:#1A3B2C}
.mi .car{margin-left:auto;transition:transform .15s;opacity:.7}
.mi[aria-expanded="true"] .car{transform:rotate(90deg)}
.subm{display:none;margin:0 0 4px 0;padding-left:30px;flex-direction:column;gap:1px;border-left:1px solid rgba(255,255,255,.12);margin-left:19px}
.subm.on{display:flex}
.si{border:0;background:none;color:var(--nav-ink);opacity:.85;text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600}
.si:hover{background:var(--nav-h);opacity:1} .si[aria-current="page"]{color:#fff;opacity:1;background:var(--nav-h);box-shadow:inset 3px 0 0 var(--gold)}
.grow{flex:1}
.nfoot{border-top:1px solid rgba(255,255,255,.12);padding:12px 6px 0;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ver{display:inline-block;align-self:flex-start;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.nfoot b{color:#fff;font-size:14px} .nfoot small{color:var(--nav-sub);font-size:12px}
.hidebtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:none;color:var(--nav-ink);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
.hidebtn:hover{background:var(--nav-h)}

/* ---------- 본문 ---------- */
.main{position:fixed;inset:0 0 0 var(--w);display:flex;flex-direction:column;transition:left .22s ease,inset .22s ease}
body.nav-hidden .nav{transform:translateX(-102%)}
body.nav-hidden .main{inset:0}
.bellw{position:relative}
#bell{position:relative} #bell .bn{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--card)}
.npanel{position:absolute;right:0;top:44px;width:min(360px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.16);z-index:60}
.npanel .nh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;border-bottom:1px solid var(--line)} .npanel .nh small{color:var(--sub);font-size:11.5px}
.npanel .ni{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.npanel .ni:hover{background:var(--brand-soft)} .npanel .ni .em{font-size:18px;line-height:1.2} .npanel .ni b{display:block;font-size:14px} .npanel .ni small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
.npanel .ni.bad b{color:#C8333A} .npanel .none{padding:22px 14px;text-align:center;color:var(--sub);font-size:13px}
.bar{height:54px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:0 0 auto}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink)}
.ib:hover{border-color:var(--brand);color:var(--brand)}
.crumb small{display:block;color:var(--sub);font-size:11.5px;line-height:1.2} .crumb b{font-size:16.5px;letter-spacing:-.01em}
.sp{flex:1}
.lk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.lk:hover{border-color:var(--brand);color:var(--brand)}
.pages{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0;overflow:auto}
iframe.fr{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
body.nav-temp .scrim{background:rgba(10,20,15,.06)}
body.nav-temp:not(.nav-hidden) .scrim{opacity:1;pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}

/* ---------- 오늘 현황 ---------- */
.dash{max-width:1180px;margin:0 auto;padding:22px 24px 40px}
.dh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dh h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.2} .dh p{margin:3px 0 0;color:var(--sub);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 15px;height:38px;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--brand)} .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0E1A13}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{color:var(--sub);font-size:13px} .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.kpi .bar2{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden} .kpi .bar2 i{display:block;height:100%;background:var(--brand);border-radius:99px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:16.5px;letter-spacing:-.01em} .cnt{background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;border-radius:99px;padding:1px 9px}
.more{margin-left:auto;border:0;background:none;color:var(--sub);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.more:hover{color:var(--brand)}
table{border-collapse:collapse;width:100%} th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:10px 16px;background:color-mix(in srgb,var(--bg) 70%,var(--card))}
td{padding:11px 16px;border-top:1px solid var(--line);font-size:14px;vertical-align:top} td.n{font-variant-numeric:tabular-nums;font-weight:700}
td small{display:block;color:var(--sub);font-size:12px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.tag.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)} .tag.g{background:color-mix(in srgb,var(--sub) 16%,transparent);color:var(--sub)}
.empty{padding:34px 16px;text-align:center;color:var(--sub)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.st{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.st b{display:block;font-size:14.5px} .st small{color:var(--sub);font-size:12px}
.st .tm{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;white-space:nowrap} .st .tm small{display:block;font-weight:500}
.note{padding:10px 18px;color:var(--sub);font-size:12.5px;background:color-mix(in srgb,var(--bg) 70%,var(--card));border-top:1px solid var(--line)}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.err{color:var(--bad);padding:16px 18px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1}

/* ---------- 휴대폰 ---------- */
@media (max-width:860px){
  .main{inset:0!important}
  .nav{box-shadow:6px 0 30px rgba(0,0,0,.25)}
  body.nav-hidden .nav{transform:translateX(-102%)}
  body:not(.nav-hidden) .scrim{opacity:1;pointer-events:auto}
  .dash{padding:16px 14px 40px} .dh h1{font-size:22px}
  .lk span{display:none} .lk{padding:0 10px}
  th:nth-child(5),td:nth-child(5){display:none}
  .hidebtn{display:none}
}
@media (prefers-reduced-motion:reduce){.nav,.main{transition:none}}
</style>
</head>
<body>
<aside class="nav" id="nav" aria-label="메뉴">
  <div class="brand"><div class="mk">일</div><div><b>일품집</b><small>통합 운영관리</small></div></div>
  <div class="lbl">WORKSPACE</div>
  <nav id="menu"></nav>
  <div class="grow"></div>
  <div class="nfoot"><span class="ver">V2.0</span><b>일품집 통합관리</b><small>예약부터 근무까지, 한곳에서</small>
    <button class="hidebtn" id="hideBtn"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>메뉴 숨기기</button></div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main" id="main">
  <header class="bar">
    <button class="ib" id="tog" aria-label="메뉴 숨기기 / 보이기" title="메뉴 숨기기 / 보이기"><svg class="i" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="crumb"><small>일품집 통합관리</small><b id="ttl">오늘 현황</b></div>
    <span class="sp"></span>
    <div class="bellw"><button class="ib" id="bell" hidden aria-label="알림" title="알림"><svg class="i" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="bn" id="bellN" hidden></span></button>
      <div class="npanel" id="npanel" hidden><div class="nh"><b>알림</b><small id="nAt"></small></div><div id="nList"></div></div></div>
    <button class="lk" id="acct" hidden></button>
    <button class="lk" id="reload" title="새로고침"><svg class="i" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>새로고침</span></button>
    <a class="lk" id="solo" target="_blank" rel="noopener" title="이 화면만 새 창으로"><svg class="i" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span>새 창</span></a>
  </header>
  <section class="pages" id="pages"><div class="page" id="p-dash"><div class="dash" id="dash"></div></div></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= 기본 도구 ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=k=>new Date(k+'T00:00');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const DOW=['일','월','화','수','목','금','토'], WD_MON=[1,2,3,4,5,6,0];
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const weekStart=d=>{ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const weekKey=d=>ds(weekStart(d));
const md=k=>{ const d=pd(k); return `${d.getMonth()+1}/${d.getDate()}`; };
const mdw=k=>{ const d=pd(k); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const won=v=>Math.round(v||0).toLocaleString('ko-KR')+'원';
const todayStr=ds(new Date());
const MINWAGE=10320;   // 2026년 최저시급
function wonS(v){ if(v==null) return ''; if(v>=10000&&v%1000===0) return (v/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})+'만'; return Math.round(v).toLocaleString('ko-KR')+'원'; }
function payLbl(p){ if(!p||p.v==null) return ''; return p.k==='hour'?'시급 '+wonS(p.v):p.k==='bonus'?'+'+wonS(p.v):p.k==='month'?'월 '+wonS(p.v):wonS(p.v); }
let _tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('on'),2200); }

/* ---------- 시간 ---------- */
function tMin(t){ if(!t||typeof t!=='string') return null; const m=t.match(/^(\d{1,2}):(\d{2})$/); return m?(+m[1])*60+(+m[2]):null; }
function tLbl(t){ const x=tMin(t); if(x==null) return ''; const h=Math.floor(x/60), mi=x%60; const hh=h<10?'오전'+h:(h>12?h-12:h); return hh+'시'+(mi===30?'반':mi?mi+'분':''); }
function zen(s){ return String(s||'').replace(/[０-９．：]/g,c=>c==='．'?'.':c==='：'?':':String.fromCharCode(c.charCodeAt(0)-0xFEE0)); }
// "11" "5시반" "17:30" "1730" "오전 9시" → 'HH:MM' (출근 1~9시=오후, 퇴근 1~11시=오후)
function parseT(raw,isEnd){
  let s=zen(raw).trim().replace(/\s+/g,''); if(!s) return null;
  const am=/^오전/.test(s), pmf=/^오후/.test(s); s=s.replace(/^(오전|오후)/,'').replace(/(출근|퇴근|출|퇴)$/,'');
  let m,h,mi=0,lit=false;
  if((m=s.match(/^(\d{1,2}):(\d{2})$/))){ h=+m[1]; mi=+m[2]; lit=m[1].length===2&&(m[1][0]==='0'||h>=12); }
  else if((m=s.match(/^(\d{1,2})(\d{2})$/))){ h=+m[1]; mi=+m[2]; lit=true; }
  else if((m=s.match(/^(\d{1,2})시?(?:(반)|(\d{1,2})분?)?$/))){ h=+m[1]; mi=m[2]?30:(m[3]?+m[3]:0); }
  else return null;
  if(h>24||mi>59) return null;
  if(pmf&&h<12) h+=12; else if(!am&&!lit&&h<12&&(isEnd?h<=11:h<=9)) h+=12;
  if(h>=24) return null; return pad(h)+':'+pad(mi);
}
function parseWon(raw){ let s=zen(raw).trim().replace(/[,\s원]/g,''); if(!s) return null;
  const man=/만$/.test(s); s=s.replace(/만$/,''); if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  let v=parseFloat(s); if(man||v<1000) v*=10000; return Math.round(v); }
function shLbl(sh,st){ if(!sh||sh.k==='full') return ''; if(sh.k==='pm') return '오후'; if(sh.k==='am') return '오전';
  if(sh.k==='t') return tLbl(sh.s)+(sh.e&&sh.e!==(st?st.close:'22:00')?'~'+tLbl(sh.e):''); return ''; }
function shSame(a,b){ const n=x=>(!x||x.k==='full')?'full':x.k==='pm'?'pm':x.k==='am'?'am':'t'+x.s+'-'+(x.e||''); return n(a)===n(b); }
function shIsPm(sh,st){ return !!sh&&(sh.k==='pm'||(sh.k==='t'&&tMin(sh.s)>=12*60)); }
// 근무시간: 영업시간 안쪽만 (급여 계산기와 같은 규칙)
function hoursOf(st,sh){
  if(!sh||sh.k==='full') return +st.fullH||10; if(sh.k==='pm') return +st.pmH||5; if(sh.k==='am') return +st.amH||5;
  const o=tMin(st.open), c=tMin(st.close); let a=tMin(sh.s), b=tMin(sh.e||st.close); if(a==null||b==null) return +st.fullH||10;
  a=Math.max(o,Math.min(c,a)); b=Math.max(o,Math.min(c,b)); return Math.max(0,Math.round((b-a)/60*100)/100);
}
function spanOf(st,sh){ // 타임라인 막대용 [시작분, 끝분]
  const o=tMin(st.open), c=tMin(st.close);
  if(!sh||sh.k==='full') return [o,c];
  if(sh.k==='pm') return [tMin(st.pmStart)||c-300,c];
  if(sh.k==='am'){ const a=tMin(st.amStart)||720; return [a,Math.min(c,a+60*(+st.amH||5))]; }
  return [Math.max(o,tMin(sh.s)),Math.min(c,tMin(sh.e||st.close))];
}


/* ================= 매장 데이터 ================= */
const DEF_POS=[['카운터','#3C5A86',1,1],['홀','#2F6B3F',3,4],['그릴','#B8621B',2,3],['주방','#8A2E2E',3,4],['장치','#5B3F86',0,0],['장잡','#1F6F78',0,0],['배송','#8A6A12',0,0],['주차','#55605A',0,1]];
const defStore=()=>({name:'',open:'11:00',close:'22:00',fullH:10,pmH:5,pmStart:'17:00',amH:5,amStart:'12:00',fivePlus:true,vis:'week',target:25});
const defPositions=()=>DEF_POS.map(([name,color,wd,we])=>({name,color,req:[we,wd,wd,wd,wd,wd,we]}));
const safeColor=c=>/^#[0-9a-fA-F]{3,8}$/.test(String(c||''))?c:'#888888';
const cleanPositions=a=>Array.isArray(a)? a.filter(p=>p&&typeof p.name==='string').map(p=>Object.assign({},p,{color:safeColor(p.color)})) : [];

function hcExpOf(s){ if(!s) return ''; if(s.hcExp) return s.hcExp; if(!s.hcIss) return ''; const m=s.hcIss.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return ''; const d=new Date(+m[1]+1,+m[2]-1,+m[3]); d.setDate(d.getDate()-1); return ds(d); }
function hcState(s,today){ const exp=hcExpOf(s); if(!exp) return {exp:'',days:null,lv:'none'};
  const t=today||ds(new Date()); const days=Math.round((new Date(exp+'T00:00')-new Date(t+'T00:00'))/86400000);
  return {exp,days,lv:days<0?'over':days<=30?'soon':'ok'}; }

function staffList(D,all){ return Object.values(D.staff).filter(s=>all||s.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name,'ko')); }

/* ================= 근무 계산 엔진: 요일 패턴 → 기간 설정 → 주간 입력 → 그날만 ================= */
function rulesSorted(D){ return Object.values(D.rules).filter(r=>r&&r.from&&Array.isArray(r.ids)).sort((a,b)=>(a.at||0)-(b.at||0)); }
function ruleHit(r,sid,key,wd){ return r.ids.includes(sid)&&key>=r.from&&key<=(r.to||r.from)&&(!r.days||!r.days.length||r.days.includes(wd)); }
function resolve(D,d,opt={}){
  const rules=opt.rules||rulesSorted(D);
  const key=ds(d), wd=d.getDay(), di=(wd+6)%7, wk=weekKey(d);
  const list=[], offs=[]; const pnames=D.positions.map(p=>p.name);
  staffList(D).forEach(s=>{
    if(s.last&&key>s.last) return;            // 마지막 근무일이 지난 사람은 그 다음 날부터 근무표에서 빠져요 (지난 기록은 그대로)
    let working=false, reason=null, pos=s.pos, tag=null, sh=null, shSrc='', ruleIds=[], payoff=false, awSh=null, awMissing=false;
    if(s.type==='weekly'){ const en=(D.aw[wk]||{})[s.id];
      if(en){ working=!(en.off||[]).includes(di); if(!working) reason='주간휴무';
        else { const tt=(en.t||{})[di]; if(tt&&tt.s) awSh={k:'t',s:tt.s,e:tt.e||''}; else if((en.pm||[]).includes(di)) awSh={k:'pm'}; } }
      else awMissing=true; }
    else if(s.type==='spot'){ working=false; }
    else { working=!(s.off||[]).includes(wd); if(!working) reason='고정휴무'; }
    const pat=(s.wk||{})[wd]; if(pat&&pat.sh){ sh=pat.sh; shSrc='pat'; }
    rules.forEach(r=>{ if(!ruleHit(r,s.id,key,wd)) return; ruleIds.push(r.id);
      if(r.w==='off'){ working=false; reason=(r.memo&&r.memo.length<=8)?r.memo:'기간휴무'; }
      else if(r.w==='on'&&!working){ working=true; reason=null; tag='add'; }
      if(r.pos) pos=r.pos; if(r.sh){ sh=r.sh; shSrc='rule'; } });
    if(awSh){ sh=awSh; shSrc='week'; }
    const dc=opt.noDc&&opt.noDc===s.id? null : D.dc[key+'|'+s.id];
    if(dc){
      if(dc.st==='off'||dc.st==='annual'){ working=false; reason=dc.st==='annual'?'월차':'휴무'; }
      else if(dc.st==='extra'){ if(!working) tag='add'; working=true; reason=null; }
      else if(dc.st==='paidoff'){ working=true; payoff=true; tag='payoff'; reason=null; }
      if(dc.pos) pos=dc.pos; if(dc.sh){ sh=dc.sh; shSrc='day'; } }
    if(!pnames.includes(pos)) pos=pnames[0];
    if(!tag&&pos!==s.pos) tag='chg';
    if(working) list.push({sid:s.id,name:s.name,nl:s.note||'',type:s.type,pos,tag,sh,shSrc,ruleIds,payoff,memo:(dc&&dc.memo)||''});
    else if(reason||(awMissing&&!opt.quiet)) offs.push({sid:s.id,name:s.name,reason:reason||'미입력',ruleIds,missing:!reason&&awMissing});
  });
  Object.values(D.spot).filter(x=>x&&x.date===key).forEach(x=>{
    list.push({spotId:x.id,name:x.name,type:'spot',pos:pnames.includes(x.pos)?x.pos:pnames[0],tag:'spot',sh:x.sh||null,shSrc:x.sh?'day':'',ruleIds:[],memo:x.memo||'',nl:x.note||''}); });
  return {key,wd,list,offs};
}
function findItem(D,key,sid,opt={}){ return resolve(D,pd(key),opt).list.find(x=>x.sid===sid)||null; }

/* ---------- 금액 (권한 있는 사람만 D.pay가 채워짐) ---------- */
function payOf(D,x,key,wd){
  const P=D.pay||{}; let ov=null, src='';
  if(x.spotId){ ov=P['spot:'+x.spotId]||null; if(ov) src='day'; return {ov,src,base:null}; }
  const pat=P['pat:'+x.sid+':'+wd]; if(pat){ ov=pat; src='pat'; }
  x.ruleIds.forEach(id=>{ const p=P['rule:'+id]; if(p){ ov=p; src='rule'; } });
  const dp=P['dc:'+key+'|'+x.sid]; if(dp){ ov=dp; src='day'; }
  return {ov,src,base:P['staff:'+x.sid]||null};
}
function costOf(D,x,key,wd){
  const st=D.store; const h=x.payoff?0:hoursOf(st,x.sh); const {ov,src,base}=payOf(D,x,key,wd);
  let bc=null; if(base){ if(base.k==='hour') bc=base.v*h; else if(base.k==='day') bc=Math.round(base.v*h/(+st.fullH||10)); else if(base.k==='month') bc=Math.round(base.v/30); }
  let c=bc; if(ov){ if(ov.k==='day') c=ov.v; else if(ov.k==='hour') c=ov.v*h; else if(ov.k==='bonus') c=(bc||0)+ov.v; }
  const rate = h>0&&c!=null&&(ov?ov.k!=='bonus':base&&base.k!=='month')? c/h : null;
  return {h,c,ov,src,base,rate,cash:!!(ov&&ov.cash)};
}

/* ---------- 한 주 계산 + 노동법 경고 ---------- */
function reqOf(D,pos,wd){ const p=D.positions.find(x=>x.name===pos); return p&&p.req? (+p.req[wd]||0) : 0; }
function weekCalc(D,ws,canPay){
  const rules=rulesSorted(D); const st=D.store; const days=[]; const per={};
  let reqCells=0, filled=0, shortCells=0, hours=0, cost=0, costKnown=true, sales=0;
  for(let i=0;i<7;i++){ const d=addDays(ws,i); const R=resolve(D,d,{rules});
    const by={}; D.positions.forEach(p=>by[p.name]=[]); R.list.forEach(x=>(by[x.pos]=by[x.pos]||[]).push(x));
    let dh=0, dc=0, dMissing=0, need=0, have=0; const short={};
    D.positions.forEach(p=>{ const rq=reqOf(D,p.name,R.wd), n=by[p.name].length; need+=rq; have+=Math.min(n,rq); if(rq&&n<rq){ short[p.name]=rq-n; shortCells+=rq-n; } });
    reqCells+=need; filled+=have;
    R.list.forEach(x=>{ const k=costOf(D,x,R.key,R.wd); x.h=k.h; x.cost=k; dh+=k.h;
      if(canPay){ if(k.c==null) dMissing++; else dc+=k.c; }
      if(x.sid){ const p=per[x.sid]=per[x.sid]||{name:x.name,h:0,days:[]}; p.h+=k.h; p.days.push({key:R.key,h:k.h,rate:k.rate,sh:x.sh}); } });
    const sv=(D.sales[R.key]||{}).v||0; sales+=sv; hours+=dh; cost+=dc; if(dMissing) costKnown=false;
    days.push({d,key:R.key,wd:R.wd,R,by,short,hours:dh,cost:dc,costMissing:dMissing,sales:sv,need,have,count:R.list.length});
  }
  // 경고
  const W=[];
  const P=Object.values(per), nm=l=>l.slice(0,6).join(', ')+(l.length>6?` 외 ${l.length-6}명`:'');
  const o52=P.filter(p=>p.h>52); if(o52.length) W.push({lv:'bad',t:`주 52시간 넘는 사람 ${o52.length}명`,s:nm(o52.map(p=>`${p.name} ${fmtH(p.h)}h`))+' — 연장근로는 주 12시간까지예요'+(st.fivePlus?'':' (5인 미만 매장은 적용 안 됨)')});
  P.filter(p=>p.h>=13&&p.h<15).forEach(p=>W.push({lv:'warn',t:`${p.name} 주 ${fmtH(p.h)}시간 — 주휴수당 경계`,s:'주 15시간 이상이면 주휴수당이 생겨요. 의도한 시간인지 확인하세요'}));
  if(canPay){ const low=[]; P.forEach(p=>{ const d=p.days.filter(x=>x.rate!=null&&x.rate<MINWAGE); if(d.length) low.push(`${p.name} ${won(Math.min(...d.map(x=>x.rate)))}(${d.map(x=>md(x.key)).join(',')})`); });
    if(low.length) W.push({lv:'bad',t:`시간당 금액이 최저시급(${won(MINWAGE)})보다 낮은 사람 ${low.length}명`,s:low.join(' / ')}); }
  if(st.fivePlus){ const o8=P.filter(p=>p.days.some(x=>x.h>8)); if(o8.length){ const extra=P.reduce((a,p)=>a+p.days.reduce((b,x)=>b+Math.max(0,x.h-8),0),0);
    W.push({lv:'info',t:`하루 8시간 넘는 근무 ${o8.length}명 · 연장 합계 ${fmtH(extra)}시간 (가산 50%)`,s:nm(o8.map(p=>p.name))}); } }
  return {days,per,W,reqCells,filled,shortCells,hours,cost,costKnown,sales,fill:reqCells?filled/reqCells:1};
}

async function whoami(){

  const stLabel=x=>isCxl(x)?'<span class="tag g">취소</span>':x.done?'<span class="tag">도착</span>':'<span class="tag w">대기</span>';
  const resRow=x=>`<tr><td class="n">${esc(hhmm(x.time)||'-')}</td><td><b>${esc(x.name||'')}</b><small>${esc(x.phone||'')}</small></td><td class="n">${peopleOf(x.pp)||'-'}명</td><td>${esc((x.tables||[]).join(', ')||'-')}</td><td>${esc(x.req||'')}${x.tnote&&!isCxl(x)?`<small>${esc(x.tnote)}</small>`:''}</td><td>${stLabel(x)}</td></tr>`;
  el.innerHTML=`${ME.pwWarn?`<div class="panel" style="border-color:#E5533D;padding:12px 16px;color:#9B2C1F;font-weight:600">⚠ 본사가 ${new Date(ME.pwWarn).getMonth()+1}/${new Date(ME.pwWarn).getDate()}에 이 계정의 비밀번호를 바꿨어요. 직접 부탁한 게 아니라면 근무 스케줄 → 설정 → <b>내 비밀번호 바꾸기</b>로 새로 정하세요.</div>`:''}
   <div class="dh"><div><h1>오늘 현황</h1><p>오늘(${now.getMonth()+1}월 ${now.getDate()}일 ${'일월화수목금토'[now.getDay()]}요일)의 예약과 근무 현황이에요.</p></div><span class="sp" style="flex:1"></span>
     <button class="btn" id="dRef">새로고침</button>${noRes?'':'<button class="btn pri" data-jump="res">+ 예약 등록</button>'}</div>
   <div class="kpis">
     ${noRes?'':`${kpi('오늘 예약',d.resErr?'-':teams,'팀',pct(teams,20))}${kpi('예약 인원',d.resErr?'-':ppl,'명',pct(ppl,80))}`}
     ${kpi('오늘 출근',d.staffErr?'-':L.length,'명',pct(L.length,30))}${kpi('오후 출근',d.staffErr?'-':pm,'명',pct(pm,10))}${kpi('오늘 휴무',d.staffErr?'-':offs,'명',pct(offs,10))}
   </div>
    ${noRes?'':`<div class="panel"><div class="ph"><h2>오늘의 예약</h2><span class="cnt">${d.resErr?'-':all.length}</span><button class="more" data-jump="res">전체 보기 ›</button></div>
     ${d.resErr?`<div class="err">예약을 불러오지 못했어요 (${esc(d.resErr)})</div>`:all.length?`<div style="overflow-x:auto"><table><thead><tr><th>시간</th><th>고객 / 연락처</th><th>인원</th><th>테이블</th><th>요청사항</th><th>상태</th></tr></thead><tbody>${all.map(resRow).join('')}</tbody></table></div>`:'<div class="empty">오늘 예약이 없어요. 예약 관리에서 등록하세요.</div>'}</div>`}
   ${orderPanel()}
   <div class="panel"><div class="ph"><h2>오늘 출근 직원</h2><span class="cnt">${d.staffErr?'-':L.length}</span><button class="more" data-jump="day">전체 보기 ›</button></div>
     ${d.staffErr?`<div class="err">근무표를 불러오지 못했어요 (${esc(d.staffErr)})</div>`:L.length?`<div class="staff">${sorted.map(x=>{ const [a,b]=spanOf(d.staff.D.store,x.sh); const t=m=>pad(Math.floor(m/60))+':'+pad(m%60); const lb=shLbl(x.sh,d.staff.D.store);
       return `<div class="st"><div class="av">${esc((x.name||'?')[0])}</div><div><b>${esc(x.name)}</b>${x.nl?` <span style="font-size:11.5px;font-weight:700;color:var(--mute,#8A9098);background:rgba(128,128,128,.18);border-radius:5px;padding:0 5px">${esc(x.nl)}</span>`:''}<small>${esc(x.pos)}${x.type==='spot'?' · 단기':x.type==='weekly'?' · 매주 변동':''}</small></div><div class="tm">${t(a)}<small>~ ${t(b)}${lb?' · '+esc(lb):''}</small></div></div>`; }).join('')}</div>`:'<div class="empty">오늘 출근자가 없어요.</div>'}
     <div class="note">근무 시간·휴무는 날짜별로 바꿀 수 있어요 (근무 스케줄)</div></div>
    ${noRes?'':`<div class="panel"><div class="ph"><h2>곧 들어올 예약</h2><span class="sp" style="flex:1"></span><select id="soonSel">${opts.map(m=>`<option value="${m}" ${m===soonAt?'selected':''}>${fmtT(m)}</option>`).join('')}</select></div>
     ${d.resErr?'':soon.length?`<div style="overflow-x:auto"><table><thead><tr><th>시간</th><th>고객 / 연락처</th><th>인원</th><th>테이블</th><th>요청사항</th><th>상태</th></tr></thead><tbody>${soon.map(resRow).join('')}</tbody></table></div>`:`<div class="empty">선택 시간부터 150분 이내 예정된 예약이 없어요.</div>`}</div>`}
   <p style="color:var(--sub);font-size:12px;margin:0">${esc(d.staff&&d.staff.name||'')} 기준이에요 · ${ds(now)} · ${pad(now.getHours())}:${pad(now.getMinutes())} 기준</p>`;
}
document.addEventListener('click',e=>{ const j=e.target.closest('[data-jump]'); if(j) go(j.dataset.jump); if(e.target.id==='dRef') loadDash(true); });
document.addEventListener('change',e=>{ if(e.target.id==='soonSel'){ soonAt=+e.target.value; renderDash(); } });
const IDLE_MS=10*60*1000; let lastActive=Date.now();       // 10분 동안 아무도 안 만졌으면 자동 새로고침을 멈춰요 (켜 둔 채 방치된 기기가 서버를 계속 두드리지 않도록)
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ const was=Date.now()-lastActive; lastActive=Date.now(); if(was>IDLE_MS&&cur==='dash') loadDash(); },{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ lastActive=Date.now(); if(cur==='dash') loadDash(); } });
setInterval(()=>{ if(cur==='dash'&&!document.hidden&&Date.now()-lastActive<IDLE_MS) loadDash(); },60000);
setInterval(()=>{ if(cur!=='dash'&&!document.hidden&&Date.now()-lastActive<IDLE_MS) refreshOrders(); },90000);      // 다른 화면을 보고 있어도 발주가 들어오면 메뉴에 숫자가 떠요

/* ================= 시작 ================= */
buildMenu();
(async function(){
  await whoami(); if(ME.mode==='none'){ showGate(); return; } applyMe(); if(!ME.orderOnly) refreshOrders();
  let open=true; try{ const v=localStorage.getItem('ilpum-nav'); if(v==='hidden') open=false; }catch(e){} if(mobile()) open=false;
  document.body.classList.toggle('nav-hidden',!open);
  let start=location.hash.slice(1); if(!ROUTES[start]){ try{ start=localStorage.getItem('ilpum-page'); }catch(e){} } go(ME.orderOnly?'ord':(ROUTES[start]?start:'dash'));
})();
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(ROUTES[h]&&h!==cur) go(h); });
</script>
</body>
</html>
