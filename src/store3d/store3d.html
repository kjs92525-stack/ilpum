<style>
/* 화면 전체가 3D 모형, 위쪽 제목줄과 아래쪽 시점 막대만 떠 있음 */
:root{
  --bg:#E9ECE8; --panel:rgba(255,255,255,.92); --fg:#1E2B25; --muted:#5E6B64;
  --line:#CBD3CD; --accent:#1F4D3A; --accent-fg:#fff; --gold:#B8893E;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --label-bg:rgba(255,255,255,.88); --label-fg:#1E2B25;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1F1D; --panel:rgba(30,36,33,.92); --fg:#E4EAE6; --muted:#9AA6A0;
  --line:#3A4440; --accent:#D8B16E; --accent-fg:#1A1F1D; --gold:#D8B16E;
  --label-bg:rgba(24,30,27,.86); --label-fg:#E4EAE6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1F1D; --panel:rgba(30,36,33,.92); --fg:#E4EAE6; --muted:#9AA6A0;
  --line:#3A4440; --accent:#D8B16E; --accent-fg:#1A1F1D; --gold:#D8B16E;
  --label-bg:rgba(24,30,27,.86); --label-fg:#E4EAE6; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;
  padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.ttl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;pointer-events:auto;max-width:420px;min-width:0}
.ttl h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.ttl p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.stat{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stat b{color:var(--fg);font-size:15px;margin-right:2px}
.bar{flex-direction:column;align-items:center;gap:6px;position:fixed;left:0;right:0;bottom:0;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;pointer-events:none}
.tools{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto;max-width:100%;justify-content:center}
.tools .sep{width:1px;background:var(--line);margin:4px 2px}
button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:9px;padding:8px 12px;background:transparent;color:var(--fg);cursor:pointer;min-height:36px}
button:hover{background:color-mix(in srgb,var(--fg) 8%,transparent)}
button.on{background:var(--accent);color:var(--accent-fg)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lbl{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--label-fg);background:var(--label-bg);border:1px solid var(--line);
  padding:2px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
.lbl.room{color:var(--accent)}
.hidelbl .lbl{display:none}
#joy{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);touch-action:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--accent);opacity:.85}
body.walk #joy{display:block}
@media (hover:hover) and (pointer:fine){body.walk #joy{display:none}}
#pad{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(3,44px);grid-auto-rows:44px;gap:4px;padding:8px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:none}
#pad button{min-height:0;padding:0;font-size:16px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
#pad button:active,#pad button.hold{background:var(--accent);color:var(--accent-fg)}
#pad .t{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
@media (max-width:640px){#pad{bottom:calc(190px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(3,38px);grid-auto-rows:38px}}
.help{font-size:11px;color:var(--muted);margin-top:6px}
#err[hidden]{display:none}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .ttl p.desc{display:none}
  button{padding:8px 9px;font-size:12px}
}

<div id="gate"><div class="box"><h2 id="gateT">확인하는 중…</h2><p id="gateP">통합관리 로그인을 확인하고 있어요.</p><a id="gateA" href="index.html" hidden>통합관리에서 로그인하기</a></div></div>
<script>
/* 통합관리(같은 주소)의 로그인 토큰이 있어야 3D 를 띄움. 토큰은 서버에 한 번 확인(만료됐으면 갱신) */
(function(){
  const URL0='https://bdqcrbnbuoujozlpttbe.supabase.co', KEY='/*NEWKEY*/', CONF='ilpum-fr-conf';
  const readConf=()=>{ try{ return JSON.parse(localStorage.getItem(CONF))||{}; }catch(e){ return {}; } };
  const readSes=()=>{ const c=readConf(); if(c.ses) return c.ses; try{ const t=sessionStorage.getItem('fr-ses'); if(t) return JSON.parse(t); }catch(e){} return null; };
  const writeSes=j=>{ try{ const c=readConf(); if(c.ses){ c.ses=j; localStorage.setItem(CONF,JSON.stringify(c)); } else sessionStorage.setItem('fr-ses',JSON.stringify(j)); }catch(e){} };
  async function token(){
    const run=async()=>{ const s=readSes(); if(!s) return null;
      if((s.expires_at||0)*1000>Date.now()+60000) return s.access_token;
      const r=await fetch(URL0+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
      const j=await r.json().catch(()=>({})); if(!r.ok||!j.access_token) return null; writeSes(j); return j.access_token; };
    return navigator.locks?navigator.locks.request('ilpum-refresh',run):run();
  }
  const deny=(t,p)=>{ document.getElementById('gateT').textContent=t; document.getElementById('gateP').textContent=p; document.getElementById('gateA').hidden=false; };
  window.__auth=new Promise(ok=>{
    token().then(async t=>{
      if(!t) return deny('로그인이 필요해요','통합관리에 로그인한 기기에서만 매장 3D 배치도를 볼 수 있어요.');
      const r=await fetch(URL0+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+t}});
      if(!r.ok) return deny('로그인이 필요해요','로그인이 만료됐어요. 통합관리에서 다시 로그인해 주세요.');
      document.getElementById('gate').hidden=true; ok(true);
    }).catch(()=>deny('연결하지 못했어요','인터넷 연결을 확인하고 새로고침해 주세요.'));
  });
})();
</script>

{"imports":{

<script type="module">
await window.__auth;   // 로그인 확인 전에는 아무것도 그리지 않음
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// 치수 도면: 가로 39,890mm = 1058px, 세로 22,119mm = 588px → 1px ≈ 37.7mm
const OX = 285, OY = 140, RX = 1345, BY = 740, W = (RX-OX)*39.89/1058, D = (BY-OY)*39.89/1058;
let S = 39.89/1058, X = px => (px-OX)*S - W/2, Z = py => (py-OY)*S - D/2;   // 1층을 만들 땐 1층 도면 기준으로 바뀜

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const css = getComputedStyle(document.documentElement);
const bgCol = () => new THREE.Color(css.getPropertyValue('--bg').trim() || '#E9ECE8');
scene.background = bgCol();

const renderer = new THREE.WebGLRenderer({ antialias:true });
const LOWEND = matchMedia('(pointer:coarse)').matches || innerWidth < 800;
renderer.setPixelRatio(Math.min(devicePixelRatio, LOWEND ? 1.25 : 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const lr = new CSS2DRenderer();
lr.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
stage.appendChild(lr.domElement);

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;  // 스테인리스·구리 반사
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomSpeed = .35;
/* 휠 확대: 마우스·터치패드가 한 번에 이벤트를 많이 보내도 끝까지 튀지 않게, 휠 양에 비례해서 조금씩 부드럽게 (사용자 요청) */
let zoomAcc = 0;
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault(); e.stopImmediatePropagation();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  zoomAcc = Math.max(-.35, Math.min(.35, zoomAcc + Math.max(-120, Math.min(120, dy)) * .0012));   // 한 칸(100) ≈ 12%
}, { capture:true, passive:false });
const _zo = new THREE.Vector3();
function applyZoom(dt){
  if (Math.abs(zoomAcc) < .0005) { zoomAcc = 0; return; }
  const lim = dt * 1.1, step = Math.max(-lim, Math.min(lim, zoomAcc * Math.min(1, dt * 12))); zoomAcc -= step;   // 1초에 최대 약 3배
  _zo.subVectors(camera.position, controls.target);
  const L = Math.max(controls.minDistance, Math.min(controls.maxDistance, _zo.length() * Math.exp(step)));
  _zo.setLength(L); camera.position.copy(controls.target).add(_zo); anim = null;
}
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 3; controls.maxDistance = 90;

const hemi = new THREE.HemisphereLight(0xffffff, 0xb9b2a4, .6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-14, 30, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(LOWEND ? 1024 : 2048, LOWEND ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left:-24, right:24, top:14, bottom:-14, near:1, far:80 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// 스케치업처럼 면 + 검은 윤곽선
// 우리 가게 같은 원목 벽판: 세로 판재(폭 약 15cm) + 나뭇결, 실제 크기로 반복
function WOODWALL(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
  const base = ['#B98A5C', '#AD7F52', '#C29466', '#A87A4E'];
  for (let i = 0; i < 4; i++) {
    g.fillStyle = base[i]; g.fillRect(i*64, 0, 64, 512);
    for (let k = 0; k < 40; k++) {                                   // 나뭇결
      g.strokeStyle = `rgba(${90+Math.random()*30|0},${55+Math.random()*20|0},30,${.08+Math.random()*.12})`;
      g.lineWidth = .6 + Math.random()*1.4; g.beginPath();
      let x = i*64 + 3 + Math.random()*58; g.moveTo(x, 0);
      for (let y = 0; y <= 512; y += 32) { x += (Math.random()-.5)*2.5; g.lineTo(x, y); }
      g.stroke();
    }
    g.fillStyle = 'rgba(60,35,18,.55)'; g.fillRect(i*64, 0, 2, 512);  // 판재 이음매
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/0.6, 1/1.2); t.anisotropy = 4;
  const m = new THREE.MeshStandardMaterial({ map:t, roughness:.72 }); m.userData.worldUV = true; return m;
}
const M = (c, r=.85, m=0) => new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
const mat = {
  floor:M(0xB9B5AD,.45), tile:M(0xD6D9DA,.6), wall:WOODWALL(), wood:M(0xA9774A,.7), part:M(0x8A5F3B,.7),
  table:M(0xCC9A5E,.45), leg:M(0x1E1F21,.6), chair:M(0xC38D52,.6), seat:M(0x1B1B1C,.5),
  steel:M(0xD5D9DC,.28,.75), green:M(0x4E8A3A), dark:M(0x33373A), pos:M(0x2B2B2B,.4), grill:M(0x2A2826,.6),
  knob:M(0x111111,.4), copper:M(0xE0915A,.25,.9), duct:M(0x232426,.95), ceil:M(0x1B1C1E,.95), bin:M(0x161616,.7),
  led:new THREE.MeshBasicMaterial({ color:0xFFFBF0 }), stone:M(0xD9D8D3,.4),
  glass:new THREE.MeshStandardMaterial({color:0x8FB3E6, transparent:true, opacity:.35, roughness:.1}),
  stair:M(0xCFCCC4), ac:M(0xF1F1EE,.5), ash:M(0x8D8C88,.9), ig:M(0x3A3A3A,.8), igDark:M(0x1A1A1A,.9),
  bowl:M(0x8A8A86,.8), bowlK:M(0x151515,.5), ember:new THREE.MeshBasicMaterial({ color:0xFF7A2E }), counter:M(0xD9D2C4)
};
const FOOD = [0xE8C33A, 0xC9302C, 0x4F8F3A, 0xE07B39, 0xF2EEE3, 0x3D6B2E, 0x8C4A2F, 0xD9A441].map(c => M(c, .7));
const edgeMat = new THREE.LineBasicMaterial({ color:0x222222, transparent:true, opacity:.55 });
const walls = [], solids = [], steps = [], below2F = [];  // below2F: 2층만 볼 때 쓰는 아래쪽 벽·바닥  // steps: 계단·참 [x1,z1,x2,z2,높이] — 사람이 올라갈 수 있음
  // solids: 사람이 못 지나가는 바닥 영역 [x1,z1,x2,z2]   // 벽 낮추기용
let nTables = 0, nChairs = 0;
const buckets = new Map();   // 같은 재질 작은 부품은 하나로 합쳐 폰에서도 가볍게
const ceilGroup = new THREE.Group(); scene.add(ceilGroup);  // 천장·덕트·조명: 위에서 볼 땐 숨김

function box(x1, y1, x2, y2, h, m, y0=0, opt={}){
  const w = Math.abs(x2-x1)*S, d = Math.abs(y2-y1)*S;
  const g = new THREE.BoxGeometry(Math.max(w,.02), h, Math.max(d,.02));
  if (m && m.userData && m.userData.worldUV) {   // 무늬가 늘어나지 않게 면마다 실제 크기(m)로 UV

  }

function chair(px, py, face){

  box(px-s/2, py-s/2, px+s/2, py+s/2, .07, mat.seat, .42, {...B, solid:true});

    box(px+dx*L-.6, py+dy*L-.6, px+dx*L+.6, py+dy*L+.6, .42, mat.chair, 0, B);
  const h = face==='l'||face==='r';
  const bx = face==='l' ? px-s/2+.5 : face==='r' ? px+s/2-.5 : px, by = face==='u' ? py-s/2+.5 : face==='d' ? py+s/2-.5 : py;
  for (const k of [-1,1]) { const ox = h ? bx : px+k*L, oy = h ? py+k*L : by;
    box(ox-.6, oy-.6, ox+.6, oy+.6, .5, mat.chair, .45, B); }
  for (const y of [.62, .75, .88]) h ? box(bx-.5, py-L, bx+.5, py+L, .06, mat.chair, y, B)

// 세로 테이블(긴 쪽이 위아래), 양옆으로 n개씩. end = 휴지통·석쇠함을 둘 쪽
function vTable(cx, cy, n=2, end){
  const len = n===3 ? 42 : 32, hw = 12.5;   // 4인 약 94×120cm, 6인 94×158cm (도면 실측)
  tableTop(cx-hw, cy-len/2, cx+hw, cy+len/2);
  for (let i=0;i<n;i++){
    const y = cy - len/2 + len*(i+.5)/n;
    chair(cx-hw-5.5, y, 'l'); chair(cx+hw+5.5, y, 'r');
  }
  if (end==='bot') bin(cx, cy+len/2+6);
  if (end==='top') bin(cx, cy-len/2-10);
}
// 가로 테이블(칸막이 앞), 한쪽 면에만 의자
function hTable(x1, x2, y1, y2, n, side){
  tableTop(x1, y1, x2, y2);
  for (let i=0;i<n;i++){
    const x = x1 + (x2-x1)*(i+.5)/n;
    side==='d' ? chair(x, y2+6.5, 'd') : chair(x, y1-6.5, 'u');
  }
}

function stallRow(yTop, flip){   // yTop: 주차칸 위쪽 끝, flip: 차 앞이 아래쪽

}

function coldRoom(x1, y1, x2, y2, dy1, dy2, name, temp){

  box(x2-t, dy1, x2, dy2, H-2.1, mat.panel, 2.1);
  box(x1, y1, x2, y2, .12, mat.panel, H);                                       // 천장 패널
  for (let x = x1 + 1.1/S; x < x2 - 5; x += 1.1/S) {                             // 패널 이음매
    box(x-.3, y1-.4, x+.3, y1, H, mat.seam, 0, {edges:false, solid:false}); box(x-.3, y2, x+.3, y2+.4, H, mat.seam, 0, {edges:false, solid:false});
  }
  box(x1+t, y1+t, x2-t, y2-t, .01, mat.frost, 0, {edges:false, shadow:false, solid:false});
  // 문: 스테인리스 문짝(살짝 열림) + 손잡이 + 비닐 커튼
  const dw = dy2 - dy1, door = new THREE.Mesh(new THREE.BoxGeometry(.08, 2.0, dw*S), mat.steel);
  door.position.set(X(x2) + .04 + Math.sin(.5)*dw*S/2, 1.0, Z(dy1) + Math.cos(.5)*dw*S/2); door.rotation.y = -.5;
  door.castShadow = true; door.add(new THREE.LineSegments(new THREE.EdgesGeometry(door.geometry), edgeMat)); scene.add(door);
  for (let y = dy1 + 1; y < dy2 - 1; y += 3.2) box(x2-t+1, y, x2-t+1.6, y+2.8, 1.95, mat.strip, .1, {edges:false, shadow:false, solid:false});
  const disp = new THREE.Mesh(new THREE.PlaneGeometry(.32, .16), new THREE.MeshBasicMaterial({ map: tex(160, 80, g => {
    g.fillStyle = '#111'; g.fillRect(0,0,160,80); g.fillStyle = '#ff3b2f'; g.font = 'bold 48px monospace'; g.textAlign = 'center'; g.fillText(temp, 80, 58); }) }));
  disp.rotation.y = Math.PI/2; disp.position.set(X(x2) + .01, 1.75, Z(dy2 + 6)); scene.add(disp);
  // 선반 3줄 + 상자
  for (const [a, b, c, d] of [[x1+t+1, y1+t+1, x2-t-10, y1+t+12], [x1+t+1, y2-t-12, x2-t-10, y2-t-1]]) {
    for (const xp of [a, c]) for (const yp of [b, d]) box(xp-.5, yp-.5, xp+.5, yp+.5, 1.9, mat.steel, 0, {edges:false, solid:false});
    for (const h of [.25, .85, 1.45]) {

      for (let xp = a + 1; xp < c - 9; xp += 10 + (xp % 3)) box(xp, b+1, xp + 8, d-1, .3 + (xp % 2)*.08, (xp|0) % 3 ? mat.box1 : mat.sty, h + .03, {batch:true, edges:false});
    }
  }
  // 위: 실외기(응축기)
  const cx = x1 + 25, cy = (y1+y2)/2;

  label(name, (x1+x2)/2, (y1+y2)/2, H + .6);
}

function tank(x1, y1, x2, y2, face){
  const t = 1.2, H = 1.05;
  box(x1, y1, x2, y2, .24, mat.blue);
  const ew = face==='e' || face==='w';   // 앞(유리)이 동쪽·서쪽
  const back  = face==='e' ? [x1, y1, x1+t, y2] : face==='w' ? [x2-t, y1, x2, y2] : [x1, y2-t, x2, y2];
  const sideA = ew ? [x1, y1, x2, y1+t] : [x1, y1, x1+t, y2];
  const sideB = ew ? [x1, y2-t, x2, y2] : [x2-t, y1, x2, y2];
  const front = face==='e' ? [x2-t, y1, x2, y2] : face==='w' ? [x1, y1, x1+t, y2] : [x1, y1, x2, y1+t];
  for (const b of [back, sideA, sideB]) box(b[0], b[1], b[2], b[3], H, mat.blue, 0, {solid:false});
  box(front[0], front[1], front[2], front[3], .34, mat.blue, 0, {solid:false});
  box(front[0], front[1], front[2], front[3], .12, mat.blue, H-.12, {solid:false});
  box(front[0], front[1], front[2], front[3], H-.46, mat.glass, .34, {shadow:false});
  box(x1+t, y1+t, x2-t, y2-t, .64, mat.water, .24, {edges:false, shadow:false, solid:false});
  for (let i=0; i<8; i++) {
    const e = new THREE.Mesh(new THREE.CapsuleGeometry(.022, .45, 3, 6), mat.eel);
    e.rotation.set(0, Math.random()*Math.PI, Math.PI/2);
    e.position.set(X(x1+t+2 + Math.random()*(x2-x1-2*t-4)), .27 + Math.random()*.12, Z(y1+t+2 + Math.random()*(y2-y1-2*t-4)));
    scene.add(e);
  }
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, (ew ? y2-y1 : x2-x1)*S, 10), mat.pvc);
  if (ew) { p.rotation.x = Math.PI/2; p.position.set(X(face==='e' ? x1+2 : x2-2), H+.05, Z((y1+y2)/2)); }
  else { p.rotation.z = Math.PI/2; p.position.set(X((x1+x2)/2), H+.05, Z(y2-2)); }
  scene.add(p);
}

function bench(x1, y1, x2, y2, back){
  const H = .9, t = 1, alongX = (x2-x1) >= (y2-y1);
  if (alongX) { box(x1, y1, x1+t, y2, H, mat.blue); box(x2-t, y1, x2, y2, H, mat.blue); }
  else        { box(x1, y1, x2, y1+t, H, mat.blue); box(x1, y2-t, x2, y2, H, mat.blue); }
  box(x1, y1, x2, y2, .05, mat.blue, .12, {solid:false});
  box(x1, y1, x2, y2, .04, mat.blue, .48, {solid:false});
  box(x1, y1, x2, y2, .05, mat.blue, H-.05, {solid:false});
  const L = alongX ? x2-x1 : y2-y1, cut = L*.62;
  if (alongX) { box(x1+1, y1+2, x1+cut, y2-2, .04, mat.board, H); box(x1+cut+1, y1+2, x2-2, y2-2, .03, mat.grill, H-.02, {edges:false}); }
  else        { box(x1+2, y1+1, x2-2, y1+cut, .04, mat.board, H); box(x1+2, y1+cut+1, x2-2, y2-2, .03, mat.grill, H-.02, {edges:false}); }
  const bs = { n:[x1, y1, x2, y1+1], s:[x1, y2-1, x2, y2], e:[x2-1, y1, x2, y2], w:[x1, y1, x1+1, y2] }[back];
  box(bs[0], bs[1], bs[2], bs[3], .32, mat.blue, H);
  const fx = alongX ? x1 + cut + (L-cut)/2 : (back==='e' ? x2-3 : x1+3), fy = alongX ? (back==='n' ? y1+3 : y2-3) : y1 + cut + (L-cut)/2;
  cyl(fx, fy, .02, .02, H, .42, mat.steel);
  const arm = new THREE.Mesh(new THREE.TorusGeometry(.11, .015, 6, 16, Math.PI), mat.steel);
  arm.position.set(X(fx), H+.42, Z(fy)); arm.rotation.y = alongX ? (back==='n' ? -Math.PI/2 : Math.PI/2) : (back==='e' ? 0 : Math.PI);
  scene.add(arm);
}

  box(x1, y1, x2, y2, .16, mat.caseW, H-.16, {solid:false});

    for (let x = x1+3; x < x2-6; x += 6) {

      box(x+.3, (y1+y2)/2-3.6, x+4.3, (y1+y2)/2+1.6, .06, mat.pack, h+.05, {batch:true, edges:false});
    }
  }
  box(x1+t, y2-.8, x2-t, y2, H-.46, mat.glass, .3, {shadow:false});
  for (const k of [1/3, 2/3]) { const xb = x1 + (x2-x1)*k; box(xb-.5, y2-1.2, xb+.5, y2, H-.46, mat.caseW, .3, {edges:false, solid:false}); }

    g.fillText('순살 기준 성인 400g 내외', 128, 84); g.fillText('2인 800g · 3인 1200g', 128, 112); g.fillText('추가 주문 가능합니다', 128, 140); });

    pl.position.set(X(x1 + (x2-x1)*k), 1.45, Z(y2)+.02); scene.add(pl);
  }
}

  try { localStorage.setItem('ilpum3d-lite', lite ? '1' : '0'); } catch (_) {}
};
try { if (localStorage.getItem('ilpum3d-lite') === '1') document.getElementById('t-lite').click(); } catch (_) {}
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.1, (now - last)/1000); last = now;
  stepMe(dt);
  camMove(dt);
  applyZoom(dt);
  if (anim){
    const k = reduce ? 1 : Math.min(1, (now - anim.t0)/900), e = 1 - Math.pow(1-k, 3);
    camera.position.lerpVectors(anim.fp, anim.tp, e);
    controls.target.lerpVectors(anim.ft, anim.tt, e);
    if (k >= 1) anim = null;
  }
  controls.update();
  if (renderer.getPixelRatio() !== curPR() && now - lastMove > 250) { renderer.setPixelRatio(curPR()); dirty = 2; }
  if (anim || controls.autoRotate) dirty = Math.max(dirty, 1);
  if (!dirty) return;
  dirty--;
  const cv = F2.visible && camera.position.y < WALL_H - .1;
  if (cv !== ceilGroup.visible) { ceilGroup.visible = cv; renderer.shadowMap.needsUpdate = true; }
  renderer.render(scene, camera); lr.render(scene, camera); window.__renders = (window.__renders || 0) + 1;
});
me.visible = false;   // 사람 걷기 기능은 뺌(사용자 요청)
/* ── 가볍게: 움직이지 않는 물건을 재질별로 하나로 합쳐 그리는 횟수를 줄임(모양·색은 그대로) ── */
function mergeStatic(group){
  group.updateMatrixWorld(true);
  const skip = new Set([...walls, ...below2F]), by = new Map(), lines = [];
  for (const o of [...group.children]) {
    if (!o.isMesh || skip.has(o) || o.children.some(c => !c.isLineSegments)) continue;
    const g = o.geometry.clone().applyMatrix4(o.matrix);
    const key = o.material.uuid + (g.index ? 'i' : 'n') + Object.keys(g.attributes).sort().join() + o.castShadow;
    const b = by.get(key) || by.set(key, { m:o.material, cs:o.castShadow, gs:[], os:[] }).get(key);
    b.gs.push(g); b.os.push(o);
  }
  for (const b of by.values()) {
    if (b.os.length < 2) continue;
    const mg = mergeGeometries(b.gs); if (!mg) continue;
    for (const o of b.os) { group.remove(o); for (const c of o.children) lines.push(c.geometry.clone().applyMatrix4(o.matrix)); }
    const mm = new THREE.Mesh(mg, b.m); mm.castShadow = b.cs; mm.receiveShadow = true; group.add(mm);
  }
  if (lines.length) { const lg = mergeGeometries(lines); if (lg) group.add(new THREE.LineSegments(lg, edgeMat)); }
}
for (const g of [F2, F1, ceilGroup]) mergeStatic(g);
setFloor('2');
window.__ready = true;
