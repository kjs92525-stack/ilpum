<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>오늘의 예약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* 손님용 예약 현황판 (매장 입구 모니터). 상권분석과 같은 보고서형: 네이비 + 금색, 이름·번호는 명조 */
:root{--bg:#f3f4f6;--paper:#fff;--ink:#141a26;--ink2:#2b3445;--sub:#6b7383;--faint:#9aa1ad;--line:#e2e5ea;
  --navy:#1c3557;--navy2:#2d5282;--gold:#a8822e;--goldT:rgba(168,130,46,.12);--ok:#2f6b4f;--warn:#a13a32;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--fs:40px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;cursor:default}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:2vw;padding:1.6vh 3vw;flex:none}
header .eb{font:700 clamp(12px,1.3vw,22px)/1 var(--sans);letter-spacing:.22em;color:#d9bf7f}
header h1{margin:.6vh 0 0;font:700 clamp(22px,3.2vw,58px)/1.1 var(--serif);letter-spacing:-.02em}
header .sp{flex:1}
header .day{text-align:right;font:500 clamp(14px,1.6vw,28px)/1.3 var(--serif);color:#e6eaf0}
header .clock{font:700 clamp(26px,3.6vw,64px)/1 var(--serif);color:#fff;font-variant-numeric:tabular-nums;margin-left:1.4vw}
main{flex:1;min-height:0;padding:2vh 2.4vw 1vh;display:flex}
#grid{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:calc(var(--fs)*.22) calc(var(--fs)*.7);align-content:start}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:calc(var(--fs)*.42);background:var(--paper);border:1px solid var(--line);border-radius:calc(var(--fs)*.22);
  padding:calc(var(--fs)*.16) calc(var(--fs)*.22) calc(var(--fs)*.16) calc(var(--fs)*.4);box-shadow:0 1px 2px rgba(20,26,38,.05);min-width:0;position:relative}
.row .tm{font:700 calc(var(--fs)*.62)/1 var(--sans);color:var(--sub);font-variant-numeric:tabular-nums;min-width:3.6em}
.row .nm{font:700 var(--fs)/1.15 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .nm small{font:600 calc(var(--fs)*.5)/1 var(--sans);color:var(--sub);margin-left:.5em;letter-spacing:0}
.row .tb{font:900 calc(var(--fs)*.92)/1 var(--serif);background:var(--navy);color:#fff;border-radius:calc(var(--fs)*.16);padding:calc(var(--fs)*.16) calc(var(--fs)*.34);min-width:2.6em;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .tb.room{background:var(--gold)}
.row .tb.none{background:#e9ecf1;color:var(--faint);font-weight:700}
.row.soon{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldT)}
.row.soon::before{content:'';position:absolute;left:0;top:18%;bottom:18%;width:calc(var(--fs)*.1);background:var(--gold);border-radius:0 4px 4px 0}
.row.past{opacity:.38}
.empty{margin:auto;text-align:center;color:var(--sub)}
.empty b{display:block;font:700 clamp(26px,3vw,52px)/1.3 var(--serif);color:var(--navy)}
.empty span{font-size:clamp(14px,1.4vw,24px)}
footer{flex:none;display:flex;align-items:center;gap:1.4vw;padding:1vh 3vw 1.6vh;color:var(--sub);font-size:clamp(12px,1.15vw,20px)}
footer .guide{font:600 clamp(14px,1.4vw,26px)/1.3 var(--serif);color:var(--navy)}
footer .guide i{font-style:normal;display:inline-block;width:.9em;height:.9em;border-radius:3px;background:var(--navy);vertical-align:-.1em;margin:0 .25em}
footer .sp{flex:1}
#st{font-size:.85em}#st.ok{color:var(--ok)}#st.err{color:var(--warn);font-weight:700}
.login{margin:auto;max-width:640px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 32px;text-align:center}
.login b{font:700 24px/1.4 var(--serif);color:var(--navy);display:block;margin-bottom:8px}
.login a{color:var(--navy2);font-weight:700}
</style>
</head>
<body>
<header>
  <div><div class="eb" id="eb">ILPUMJIP · RESERVATION</div><h1 id="title">오늘의 예약</h1></div>
  <div class="sp"></div>
  <div class="day" id="day"></div><div class="clock" id="clock"></div>
</header>
<main id="main"><div id="grid"></div></main>
<footer>
  <div class="guide">성함을 찾으시고 <i></i>테이블 번호로 앉아 주세요</div>
  <div class="sp"></div><span id="cnt"></span><span id="st">연결 중…</span>
</footer>
<script>
/* 예약 화면(reserve.html)과 같은 서버·같은 로그인 토큰을 씀. 이 화면은 읽기만 함(예약을 고치지 않음).
   사용량: 실시간 연결(웹소켓)로 바뀐 날짜의 내용을 서버가 직접 보내 줘서 다시 받을 필요가 없음. 10분마다 rev(숫자 하나)만 확인. */
const SUPABASE_URL='https://bdqcrbnbuoujozlpttbe.supabase.co';
const SUPABASE_KEY='/*NEWKEY*/';
const CONF_KEY='ilpum-fr-conf';
const Q=new URLSearchParams(location.search);
const MASK=Q.get('mask')==='1';                 // ?mask=1 이면 가운데 글자를 *로 (홍*원)
let SID='', STORE=null, ITEMS=[], REV=null, DAY='';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ds(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readConf=()=>{ try{ return JSON.parse(localStorage.getItem(CONF_KEY))||{}; }catch(e){ return {}; } };
const readSes=()=>{ const c=readConf(); if(c.ses) return c.ses; try{ const t=sessionStorage.getItem('fr-ses'); if(t) return JSON.parse(t); }catch(e){} return null; };
const writeSes=j=>{ try{ const c=readConf(); if(c.ses){ c.ses=j; localStorage.setItem(CONF_KEY,JSON.stringify(c)); } else sessionStorage.setItem('fr-ses',JSON.stringify(j)); }catch(e){} };
async function freshToken(force){
  const run=async()=>{ const s=readSes(); if(!s) return null;
    if(!force&&(s.expires_at||0)*1000>Date.now()+60000) return s.access_token;
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    const j=await r.json().catch(()=>({})); if(!r.ok||!j.access_token) return null; writeSes(j); return j.access_token; };
  return navigator.locks?navigator.locks.request('ilpum-refresh',run):run();
}
async function fx(path,opt,retry=true){
  opt=opt||{}; const tok=await freshToken(false); if(!tok) throw Object.assign(new Error('로그인이 필요해요'),{auth:true});
  const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});
  if(r.status===401&&retry){ const t2=await freshToken(true); if(t2) return fx(path,opt,false); }
  return r;
}
function setSt(t,k){ const e=document.getElementById('st'); e.textContent=t; e.className=k||''; }

/* ---------- 표시 ---------- */
const isCxl=x=>/취소/.test(x.tnote||'');
const toMin=t=>{ const m=String(t||'').match(/(\d{1,2}):(\d{2})/); return m? +m[1]*60+ +m[2] : 9999; };
const people=pp=>String(pp||'').split(/[+,]/).reduce((a,x)=>a+(parseInt(x,10)||0),0);
// 칠판처럼 12시간 표기(6:00), 오전 11시대는 11:30 그대로
const tmLabel=t=>{ const m=toMin(t); if(m>=9999) return ''; let h=Math.floor(m/60); const mi=m%60; if(h>12) h-=12; return `${h}:${pad(mi)}`; };
function tableLabel(ts){
  ts=(ts||[]).map(String); if(!ts.length) return {t:'-',k:'none'};
  const nums=ts.filter(t=>!/^R/i.test(t)).sort((a,b)=>a-b);
  const rooms=[...new Set(ts.filter(t=>/^R/i.test(t)).map(t=>'룸'+t.replace(/^R/i,'').split('-')[0]))];
  const parts=[]; if(nums.length) parts.push(nums.join('·')); parts.push(...rooms);
  return {t:parts.join(' '), k: nums.length?'':'room'};
}
const maskName=n=>{ n=String(n||''); if(!MASK||n.length<2) return n; return n.length===2? n[0]+'*' : n[0]+'*'.repeat(n.length-2)+n[n.length-1]; };
function render(){
  const g=document.getElementById('grid'); const nowM=new Date().getHours()*60+new Date().getMinutes();
  const list=ITEMS.filter(x=>x&&!x.deleted&&!isCxl(x)&&String(x.name||'').trim()).sort((a,b)=>toMin(a.time)-toMin(b.time)||String(a.name).localeCompare(String(b.name)));
  document.getElementById('cnt').textContent=list.length?`${list.length}팀 · ${list.reduce((a,x)=>a+people(x.pp),0)}명`:'';
  if(!list.length){ g.style.gridTemplateRows=''; g.innerHTML=`<div class="empty"><b>오늘 예약이 아직 없어요</b><span>예약이 들어오면 바로 여기에 표시돼요</span></div>`; return; }
  g.innerHTML=list.map(x=>{ const m=toMin(x.time), tb=tableLabel(x.tables);
    const soon=!x.done && m-nowM<=30 && m-nowM>=-15, past=x.done || nowM-m>90;
    return `<div class="row${soon?' soon':''}${past?' past':''}"><span class="tm">${esc(tmLabel(x.time))}</span><span class="nm">${esc(maskName(x.name))}<small>${people(x.pp)?people(x.pp)+'명':''}</small></span><span class="tb ${tb.k}">${esc(tb.t)}</span></div>`; }).join('');
  fit(list.length);
}
// 스크롤 없이 한 화면에: 열 수와 글자 크기를 바꿔 가며 가장 크게 들어가는 조합을 고름
function fit(n){
  const g=document.getElementById('grid'), H=g.clientHeight, W=g.clientWidth; let best=null;
  for(let cols=1;cols<=4;cols++){ const rows=Math.ceil(n/cols);
    for(let fs=110;fs>=14;fs-=2){ g.style.setProperty('--fs',fs+'px'); g.style.gridTemplateRows=`repeat(${rows},auto)`;
      const okH=g.scrollHeight<=H+1, okW=g.scrollWidth<=W+1 && [...g.children].every(c=>{ const nm=c.querySelector('.nm'); return !nm||nm.scrollWidth<=nm.clientWidth+1; });
      if(okH&&okW){ if(!best||fs>best.fs) best={fs,rows}; break; } } }
  best=best||{fs:14,rows:Math.ceil(n/4)};
  g.style.setProperty('--fs',best.fs+'px'); g.style.gridTemplateRows=`repeat(${best.rows},auto)`;
}
const WD='일월화수목금토';
function tick(){ const d=new Date(); document.getElementById('clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  document.getElementById('day').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
  if(SID&&today()!==DAY){ DAY=today(); ITEMS=[]; REV=null; render(); load(); } }

/* ---------- 서버 ---------- */
let fails=0, nextAt=0;
async function load(){
  if(!SID||Date.now()<nextAt) return;
  try{
    const d=DAY; const r=await fx(`/rest/v1/res_days?store_id=eq.${SID}&id=eq.${d}&select=rev`); if(!r.ok) throw new Error('HTTP '+r.status);
    const rv=((await r.json())[0]||{}).rev; if(rv===undefined){ if(ITEMS.length||REV!==null){ ITEMS=[]; REV=null; render(); } }
    else if(rv!==REV){ const r2=await fx(`/rest/v1/res_days?store_id=eq.${SID}&id=eq.${d}&select=data,rev`); if(!r2.ok) throw new Error('HTTP '+r2.status);
      const row=(await r2.json())[0]; if(d===DAY){ ITEMS=(row&&row.data&&row.data.items)||[]; REV=row?row.rev:null; render(); } }
    fails=0; if(!rtOk) setSt('○ 1분마다 확인','');
  }catch(e){ fails++; nextAt=Date.now()+Math.min(600000,30000*2**fails); setSt(e.auth?'로그인이 필요해요':'연결 실패 · 잠시 뒤 다시 시도','err'); }
}
let rtWs=null, rtOk=false, rtRef=0, rtBeat=null, rtTok=null, rtWait=1000;
function rtConnect(){
  if(!SID||rtWs||!('WebSocket' in window)) return;
  let ws; try{ ws=new WebSocket(SUPABASE_URL.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SUPABASE_KEY)+'&vsn=1.0.0'); }catch(e){ return; }
  rtWs=ws; const topic='realtime:res_days_disp_'+SID;
  const send=(event,payload,t)=>{ try{ if(ws.readyState===1) ws.send(JSON.stringify({topic:t||topic,event,payload,ref:String(++rtRef)})); }catch(e){} };
  ws.onopen=async()=>{ const tok=await freshToken(false); if(!tok){ try{ ws.close(); }catch(e){} return; }
    send('phx_join',{config:{broadcast:{ack:false,self:false},presence:{key:''},postgres_changes:[{event:'*',schema:'public',table:'res_days',filter:'store_id=eq.'+SID}],private:false},access_token:tok});
    clearInterval(rtBeat); rtBeat=setInterval(()=>send('heartbeat',{},'phoenix'),25000);
    clearInterval(rtTok); rtTok=setInterval(async()=>{ const t=await freshToken(false); if(t) send('access_token',{access_token:t}); },40*60*1000); };
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
    if(m.event==='phx_reply'&&m.topic===topic){ rtOk=!!(m.payload&&m.payload.status==='ok'); if(rtOk){ rtWait=1000; setSt('● 실시간','ok'); load(); } return; }
    if(m.event==='postgres_changes'){ const dd=m.payload&&m.payload.data; const rec=dd&&dd.record; const id=(rec&&rec.id)||(dd&&dd.old_record&&dd.old_record.id);
      if(id!==DAY) return;
      // 서버가 보내 준 내용을 그대로 씀(다시 받지 않음). 내용이 빠져 있으면 그때만 받음
      if(rec&&rec.data&&Array.isArray(rec.data.items)){ ITEMS=rec.data.items; REV=rec.rev; render(); } else { REV=null; load(); }
      return; }
    if(m.event==='phx_error'||m.event==='phx_close'||(m.event==='system'&&m.payload&&m.payload.status==='error')){ rtOk=false; setSt('○ 1분마다 확인',''); } };
  ws.onclose=()=>{ rtOk=false; rtWs=null; clearInterval(rtBeat); clearInterval(rtTok); setSt('○ 1분마다 확인',''); setTimeout(rtConnect,rtWait); rtWait=Math.min(rtWait*2,300000); };
  ws.onerror=()=>{ try{ ws.close(); }catch(e){} };
}
function needLogin(msg){ setSt(msg,'err');
  document.getElementById('main').innerHTML=`<div class="login"><b>${esc(msg)}</b>이 모니터(컴퓨터)에서 <a href="index.html">통합관리</a>에 한 번 로그인하면<br>그다음부터는 이 화면이 자동으로 열려요.</div>`; }
(async function boot(){
  tick();
  if(!readSes()) return needLogin('로그인이 필요해요');
  try{
    const r=await fx('/rest/v1/rpc/sch_my_stores',{method:'POST',body:'{}'}); if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{auth:r.status===401});
    const ss=(await r.json()).filter(x=>x.role);
    if(!ss.length) return needLogin('연결된 매장이 없어요');
    const want=Q.get('store'); const byName=want&&ss.find(x=>x.name&&x.name.includes(want));
    STORE=ss.find(x=>x.id===want)||byName||ss.find(x=>x.id===readConf().sid)||ss.find(x=>x.is_hq)||ss[0]; SID=STORE.id;
    document.getElementById('title').textContent=`일품집 ${String(STORE.name||'').replace(/^일품집\s*/,'')} · 오늘의 예약`;
    document.title=`오늘의 예약 · ${STORE.name}`;
  }catch(e){ return needLogin(e.auth?'로그인이 필요해요':'연결 실패 — 인터넷 연결을 확인해 주세요'); }
  DAY=today(); render(); await load(); rtConnect();
  // 실시간이면 10분마다 숫자 하나(rev)만 확인, 아니면 1분마다
  let last=Date.now(); setInterval(()=>{ const every=rtOk?600000:60000; if(Date.now()-last<every-1000) return; last=Date.now(); load(); },15000);
  setInterval(()=>{ tick(); render(); },30000);       // 시계·"곧 도착" 표시 (서버 요청 없음)
  window.addEventListener('resize',()=>render());
  // 모니터가 꺼지지 않게 (지원하는 브라우저만)
  const lock=async()=>{ try{ if(navigator.wakeLock&&!document.hidden) await navigator.wakeLock.request('screen'); }catch(e){} };
  lock(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ lock(); load(); } });
})();
</script>
</body>
</html>
