<!doctype html>
<html lang="ko">
<head>
<title>일품집 · 상권 분석</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1c2420;--sub:#68736d;--line:#e2e5e1;--accent:#14524a;--accent-ink:#fff;--warn:#c0392b;--ok:#2e7d4f;--soft:#eef2ef;--gold:#b88a2a;--amber:#d9822b}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--panel:#1b2420;--ink:#e8ede9;--sub:#9aa7a0;--line:#2c3732;--accent:#2f8f82;--soft:#222d28;--warn:#ff7a6b;--ok:#6fcf97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:1000}
header h1{margin:0;font-size:18px}.sp{flex:1}
#sync{font-size:12px;opacity:.85}
main{max-width:1180px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--warn)}.btn.sm{padding:3px 9px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.note{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:22px 8px}
input[type=text],select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel)}
textarea{width:100%;min-height:60px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2000;max-width:90vw}
.toast.on{opacity:1}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
#map{height:460px;border-radius:10px;background:var(--soft)}
@media (max-width:900px){#map{height:320px}}
.cands button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;margin-top:6px;cursor:pointer}
.cands button:hover{border-color:var(--accent)}
.cands small{color:var(--sub)}
.score{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.score .n{font-size:40px;font-weight:800;line-height:1;color:var(--accent)}
.score .g{font-size:15px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;font-size:12.5px}
td.num{text-align:right;white-space:nowrap}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent)}
.warnbox{border:1px solid var(--warn);background:rgba(192,57,43,.07);color:var(--warn);border-radius:10px;padding:9px 11px;margin:8px 0;font-weight:600}
.okbox{border:1px solid var(--ok);background:rgba(46,125,79,.07);color:var(--ok);border-radius:10px;padding:9px 11px;margin:8px 0}
.tbl-wrap{overflow-x:auto}
details summary{cursor:pointer;font-weight:700}
.disc{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.printonly{display:none}
@media print{.printonly{display:block!important}header,.noprint{display:none!important}main{max-width:none;padding:0}.card{break-inside:avoid;border:0}#map{height:360px}}
</style>
</head>
<body>
<header><h1>상권 분석</h1><span class="note" style="color:#fff;opacity:.8">본사 전용 · 내부 참고용</span><span class="sp"></span><span id="sync">연결 중…</span></header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* ================== Supabase 연결 (새 서버 · 로그인 필요) ================== */
const SUPABASE_URL = 'https://bdqcrbnbuoujozlpttbe.supabase.co';
const SUPABASE_KEY = '/*NEWKEY*/';
const CONF_KEY='ilpum-fr-conf';
const readConf=()=>{ try{ return JSON.parse(localStorage.getItem(CONF_KEY))||{}; }catch(e){ return {}; } };
const readSes=()=>{ const c=readConf(); if(c.ses) return c.ses; try{ const t=sessionStorage.getItem('fr-ses'); if(t) return JSON.parse(t); }catch(e){} return null; };
const writeSes=j=>{ try{ const c=readConf(); if(c.ses){ c.ses=j; localStorage.setItem(CONF_KEY,JSON.stringify(c)); } else sessionStorage.setItem('fr-ses',JSON.stringify(j)); }catch(e){} };
async function freshToken(force){
  const run=async()=>{ const s=readSes(); if(!s) return null;
    if(!force && (s.expires_at||0)*1000>Date.now()+60000) return s.access_token;
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    const j=await r.json().catch(()=>({})); if(!r.ok||!j.access_token) return null; writeSes(j); return j.access_token; };
  return navigator.locks?navigator.locks.request('ilpum-refresh',run):run();
}
async function fx(path,opt,retry=true){
  opt=opt||{}; const tok=await freshToken(false); if(!tok) throw Object.assign(new Error('로그인이 필요해요'),{auth:true});
  const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});
  if(r.status===401&&retry){ const t2=await freshToken(true); if(t2) return fx(path,opt,false); }
  return r;
}
async function jx(path,opt){ const r=await fx(path,opt); if(!r.ok){ let m='HTTP '+r.status; try{ const j=await r.json(); m=j.error||j.message||m; }catch(e){} throw Object.assign(new Error(m),{status:r.status}); } const t=await r.text(); return t?JSON.parse(t):null; }
const fn=(body)=>jx('/functions/v1/site-analysis',{method:'POST',body:JSON.stringify(body)});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2800); }
const kday=iso=>{ const d=new Date(iso); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`; };
const safeUrl=u=>/^https?:\/\//.test(String(u||''))?String(u):'';

/* ================== 계산 (서버 응답 → 점수) ================== */
// 두 지점 사이 거리(m)
function distM(a,b){ const R=6371000, r=Math.PI/180; const dLat=(b.y-a.y)*r, dLon=(b.x-a.x)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.y*r)*Math.cos(b.y*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtM=m=>m==null?'-':m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km';
// 참고 점수 (100점). 기준은 처음 정한 값 — 매장을 더 내 보면서 맞춰 갈 것
const BANDS=(v,list)=>{ for(const [lim,s] of list) if(v<=lim) return s; return list[list.length-1][1]; };
function scoreOf(R){
  const n500=R.comp.filter(c=>c.dist!=null&&c.dist<=500).length, nAll=R.comp.length, near=n500+0.5*(nAll-n500);
  const sub=R.subway&&R.subway[0]; const subD=sub?sub.dist:null;
  const items=[
    {k:'comp',t:'경쟁 장어집',max:30,v:`500m 안 ${n500}곳 · ${R.radius>=1000?(R.radius/1000)+'km':R.radius+'m'} 안 ${nAll}곳${R.compMore?' 이상':''}`,
      s:BANDS(near,[[0,30],[1,22],[2,15],[4,8],[1e9,3]]),why:'가까운 장어집이 적을수록 높음 (500m 밖은 반만 셈)'},
    {k:'food',t:'상권 크기 (음식점)',max:25,v:`500m 안 ${R.food500}곳 · 1km 안 ${R.food1k}곳`,
      s:BANDS(R.food500,[[49,8],[149,15],[299,22],[1e9,25]]),why:'음식점이 많을수록 사람이 모이는 곳'},
    {k:'apt',t:'주거 (아파트)',max:15,v:`1km 안 아파트 검색 ${R.apt}건`,
      s:BANDS(R.apt,[[0,3],[9,7],[29,11],[1e9,15]]),why:'가족 손님·포장 수요'},
    {k:'sub',t:'교통 (지하철)',max:15,v:sub?`${sub.name} ${fmtM(subD)}`:'2km 안에 역 없음',
      s:subD==null?3:BANDS(subD,[[300,15],[600,12],[1000,8],[1e9,5]]),why:'가까운 역이 걸어서 갈 거리면 높음'},
    {k:'park',t:'주차',max:15,v:`500m 안 주차장 ${R.park500}곳`,
      s:BANDS(R.park500,[[0,3],[2,8],[5,12],[1e9,15]]),why:'장어집은 차로 오는 가족·회식 손님이 많음'}
  ];
  const total=items.reduce((a,b)=>a+b.s,0);
  const grade=total>=75?'좋음':total>=55?'보통':total>=40?'신중':'어려움';
  return {total,grade,items,n500,nAll};
}
// 우리 매장과의 거리 (영업지역 겹침 확인)
function nearStores(R){
  return STORES.map(s=>{ const L=LOCS[s.id]; if(!L) return null; return {id:s.id,name:s.name,addr:L.addr,d:distM(R,L)}; }).filter(Boolean).sort((a,b)=>a.d-b.d);
}

/* ================== 자료 (sch_items kind='site') ================== */
// - 매장 위치: 각 매장 칸 id 'loc' {addr,x,y}
// - 저장한 분석: 본점 칸 id 'a:<무작위>' {name,addr,x,y,radius,res,memo,at}
// - 설정: 본점 칸 id 'cfg' {zoneKm}
let STORES=[], HQ=null, LOCS={}, SAVED={}, CFG={zoneKm:2};
async function loadAll(){
  const rows=(await jx('/rest/v1/sch_items?kind=eq.site&deleted=eq.false&select=store_id,id,data,updated_at'))||[];
  LOCS={}; SAVED={};
  rows.forEach(r=>{ if(!r.data) return;
    if(r.id==='loc') LOCS[r.store_id]=r.data;
    else if(r.id==='cfg'&&r.store_id===HQ.id) CFG=Object.assign({zoneKm:2},r.data);
    else if(r.id.startsWith('a:')&&r.store_id===HQ.id) SAVED[r.id]=r.data; });
}
async function putRow(store,id,data){
  await jx('/rest/v1/sch_items?on_conflict=store_id,kind,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify({store_id:store,kind:'site',id,data:data==null?null:data,deleted:data==null})});
}

/* ================== 화면 ================== */
let CUR=null;        // 지금 보고 있는 분석 {name,addr,x,y,radius,res,memo,at,id?}
let CANDS=[], RADIUS=1000, LOC_OPEN=null;
function render(){
  $('#main').innerHTML=`
  <div class="card noprint">
    <h2>후보지 찾기</h2>
    <div class="row">
      <input type="text" id="q" placeholder="예: 부산 해운대구 중동 1394 / 서면역 / 광안리" style="flex:1;min-width:220px" autocomplete="off">
      <select id="rad" title="분석 반경"><option value="500">반경 500m</option><option value="1000">반경 1km</option><option value="1500">반경 1.5km</option></select>
      <button class="btn pri" id="find">찾기</button>
    </div>
    <div class="cands" id="cands"></div>
  </div>
  <div class="grid">
    <div id="result">${CUR?resultHtml():'<div class="card empty">주소나 장소를 찾아서 고르면 분석이 나와요</div>'}</div>
    <div class="card"><div id="map"></div><div class="note" id="mapNote" style="margin-top:6px">빨강 = 후보지 · 검정 = 장어집 · 초록 = 우리 매장</div></div>
  </div>
  ${savedHtml()}
  ${locHtml()}`;
  $('#rad').value=String(RADIUS);
  paintCands(); drawMap();
}
function paintCands(){
  const el=$('#cands'); if(!el) return;
  el.innerHTML=CANDS.map((c,i)=>`<button data-cand="${i}"><b>${esc(c.name)}</b><br><small>${esc(c.addr)}</small></button>`).join('');
}
function resultHtml(){
  const R=CUR.res, S=scoreOf(R), near=nearStores(R), zone=(+CFG.zoneKm||2)*1000;
  const clash=near.filter(n=>n.d<zone);
  const ext=`https://map.kakao.com/link/map/${encodeURIComponent(CUR.name||'후보지')},${R.y},${R.x}`;
  return `<div class="card" id="rcard">
    <div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(CUR.name||'후보지')}</h2>
      <div class="note">${esc(CUR.addr||'')}${R.region?' · '+esc(R.region.name):''} · 반경 ${fmtM(R.radius)} · ${kday(R.at)} 기준</div></div>
      <div class="row noprint"><button class="btn sm" id="print">인쇄·PDF</button></div></div>
    <div class="score"><span class="n">${S.total}</span><div><div class="g">참고 점수 · ${S.grade}</div><div class="note">100점 만점 · 아래 기준으로 계산</div></div></div>
    ${clash.length?`<div class="warnbox">⚠ 영업지역 ${CFG.zoneKm}km 안에 우리 매장이 있어요: ${clash.map(n=>esc(n.name)+' '+fmtM(n.d)).join(', ')}</div>`
      :near.length?`<div class="okbox">가장 가까운 우리 매장: ${esc(near[0].name)} ${fmtM(near[0].d)} (영업지역 ${CFG.zoneKm}km 밖)</div>`
      :'<div class="note">우리 매장 위치를 아래에서 정하면 영업지역 겹침을 같이 봐 드려요</div>'}
    <div class="tbl-wrap"><table><thead><tr><th>항목</th><th>값</th><th class="num">점수</th></tr></thead><tbody>
    ${S.items.map(i=>`<tr><td><b>${i.t}</b><div class="note">${i.why}</div></td><td>${esc(i.v)}</td><td class="num">${i.s} / ${i.max}<div class="bar"><i style="width:${Math.round(i.s/i.max*100)}%"></i></div></td></tr>`).join('')}
    </tbody></table></div>
    <h2 style="margin-top:14px">반경 안 장어집 ${R.comp.length}곳${R.compMore?' (45곳이 넘어 일부만)':''}</h2>
    ${R.comp.length?`<div class="tbl-wrap"><table><thead><tr><th>이름</th><th class="num">거리</th><th>분류</th><th>주소</th></tr></thead><tbody>
      ${R.comp.map(c=>{ const u=safeUrl(c.url); return `<tr><td>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(c.name)}</a>`:esc(c.name)}${c.tel?`<div class="note">${esc(c.tel)}</div>`:''}</td><td class="num">${fmtM(c.dist)}</td><td class="note">${esc(String(c.cat||'').replace(/^음식점 > /,''))}</td><td class="note">${esc(c.addr)}</td></tr>`; }).join('')}
    </tbody></table></div>`:'<div class="note">반경 안에 장어집이 없어요</div>'}
    <div class="row noprint" style="margin-top:12px">
      <input type="text" id="sname" placeholder="이름 (예: 해운대 1안)" value="${esc(CUR.name||'')}" style="flex:1;min-width:160px" maxlength="40">
    </div>
    <textarea id="smemo" class="noprint" placeholder="메모 (임대료·보증금·면적·현장 느낌 등)" maxlength="2000" style="margin-top:6px">${esc(CUR.memo||'')}</textarea>
    ${CUR.memo?`<div style="white-space:pre-wrap" class="printonly">${esc(CUR.memo)}</div>`:''}
    <div class="row noprint" style="margin-top:6px">
      <button class="btn pri" id="save">${CUR.id?'저장 (덮어쓰기)':'저장'}</button>
      ${CUR.id?'<button class="btn" id="saveNew">새로 저장</button>':''}
      <button class="btn" id="redo">다시 분석</button>
      <a class="btn" href="${esc(ext)}" target="_blank" rel="noopener" style="text-decoration:none">카카오맵</a>
      <a class="btn" href="https://sg.sbiz.or.kr/" target="_blank" rel="noopener" style="text-decoration:none">소상공인 상권정보 (매출 추정)</a>
    </div>
    <div class="disc">카카오 지도에 등록된 가게·장소 기준이라 실제와 다를 수 있어요. 인구·유동인구·매출은 아직 없어요 (소상공인 상권정보시스템에서 직접 확인). 점수는 본사 내부 참고용이며 가맹 희망자에게 예상 매출처럼 보여 주지 마세요.</div>
  </div>`;
}
function savedHtml(){
  const L=Object.entries(SAVED).sort((a,b)=>(b[1].at||'')<(a[1].at||'')?-1:1);
  return `<div class="card"><h2>저장한 후보지 비교 (${L.length})</h2>${L.length?`<div class="tbl-wrap"><table id="cmp"><thead><tr><th>이름</th><th class="num">점수</th><th class="num">장어집</th><th class="num">음식점 500m</th><th class="num">아파트</th><th>지하철</th><th class="num">주차</th><th>가까운 우리 매장</th><th>날짜</th><th class="noprint"></th></tr></thead><tbody>
  ${L.map(([id,a])=>{ const S=scoreOf(a.res), n=nearStores(a.res)[0], s0=a.res.subway&&a.res.subway[0];
    const clash=n&&n.d<(+CFG.zoneKm||2)*1000;
    return `<tr><td><b>${esc(a.name||'후보지')}</b><div class="note">${esc(a.addr||'')}</div></td><td class="num"><b>${S.total}</b> ${S.grade}</td><td class="num">${S.nAll}</td><td class="num">${a.res.food500}</td><td class="num">${a.res.apt}</td><td>${s0?esc(s0.name)+' '+fmtM(s0.dist):'-'}</td><td class="num">${a.res.park500}</td><td${clash?' style="color:var(--warn);font-weight:700"':''}>${n?esc(n.name)+' '+fmtM(n.d):'-'}</td><td class="note">${kday(a.at)}</td>
      <td class="noprint" style="white-space:nowrap"><button class="btn sm" data-open="${esc(id)}">열기</button> <button class="btn sm bad" data-del="${esc(id)}">삭제</button></td></tr>`; }).join('')}
  </tbody></table></div>`:'<div class="note">분석한 뒤 "저장"을 누르면 여기서 여러 후보지를 나란히 비교할 수 있어요</div>'}</div>`;
}
function locHtml(){
  return `<details class="card noprint" id="locs"${(LOC_OPEN??!Object.keys(LOCS).length)?' open':''}><summary>우리 매장 위치 · 영업지역 (${Object.keys(LOCS).length}/${STORES.length})</summary>
    <div class="note" style="margin:6px 0">후보지에서 우리 매장까지 거리를 재서, 영업지역 안이면 빨갛게 알려 드려요. (가맹계약서의 영업지역과 같게 맞추세요)</div>
    <div class="row" style="margin-bottom:8px"><span>영업지역 반경</span><select id="zone">${[0.5,1,1.5,2,3,5].map(k=>`<option value="${k}"${+CFG.zoneKm===k?' selected':''}>${k}km</option>`).join('')}</select></div>
    <table><tbody>${STORES.map(s=>{ const L=LOCS[s.id]; return `<tr><td><b>${esc(s.name)}</b></td><td class="note">${L?esc(L.addr):'아직 안 정함'}</td><td style="white-space:nowrap"><button class="btn sm" data-loc="${esc(s.id)}">${L?'바꾸기':'위치 정하기'}</button>${L?` <button class="btn sm bad" data-locdel="${esc(s.id)}">지우기</button>`:''}</td></tr>`; }).join('')}</tbody></table>
    <div class="cands" id="locCands"></div>
  </details>`;
}

/* ================== 지도 (Leaflet + OpenStreetMap, 없어도 나머지는 동작) ================== */
let MAP=null, LAYER=null, leafletP=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve(true);
  if(!leafletP) leafletP=new Promise(res=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload=()=>res(!!window.L); s.onerror=()=>res(false); document.head.appendChild(s); setTimeout(()=>res(!!window.L),8000); });
  return leafletP;
}
async function drawMap(){
  const el=$('#map'); if(!el) return;
  if(!await loadLeaflet()){ el.innerHTML='<div class="empty">지도를 불러오지 못했어요 (인터넷 연결 확인). 분석은 그대로 쓸 수 있어요</div>'; return; }
  if(MAP){ MAP.remove(); MAP=null; }
  const c=CUR?[CUR.res.y,CUR.res.x]:[35.1796,129.0756];      // 기본: 부산시청
  MAP=L.map(el).setView(c,CUR?(CUR.res.radius>1000?14:15):12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
  LAYER=L.layerGroup().addTo(MAP);
  const dot=(y,x,color,r,tip)=>L.circleMarker([y,x],{radius:r,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).bindTooltip(tip).addTo(LAYER);
  STORES.forEach(s=>{ const Lc=LOCS[s.id]; if(Lc) dot(Lc.y,Lc.x,'#2e7d4f',8,'우리 매장 · '+s.name); });
  if(!CUR) return;
  const R=CUR.res;
  [500,R.radius].filter((v,i,a)=>a.indexOf(v)===i).forEach(r=>L.circle([R.y,R.x],{radius:r,color:'#c0392b',weight:1,fillOpacity:.04,dashArray:r===500&&R.radius!==500?'4 4':null}).addTo(LAYER));
  if(LOCS&&Object.keys(LOCS).length) L.circle([R.y,R.x],{radius:(+CFG.zoneKm||2)*1000,color:'#2e7d4f',weight:1,fill:false,dashArray:'2 6'}).addTo(LAYER);
  R.comp.forEach(p=>dot(p.y,p.x,'#222',6,p.name+' · '+fmtM(p.dist)));
  (R.subway||[]).forEach(p=>dot(p.y,p.x,'#2b6cb0',5,p.name+' · '+fmtM(p.dist)));
  dot(R.y,R.x,'#c0392b',9,'후보지');
}

/* ================== 동작 ================== */
let busy=false;
async function find(){
  const q=$('#q').value.trim(); if(q.length<2) return toast('주소나 장소를 두 글자 이상 넣어 주세요');
  if(busy) return; busy=true; $('#find').disabled=true; $('#cands').innerHTML='<div class="note" style="margin-top:6px">찾는 중…</div>';
  try{ const r=await fn({action:'geocode',q}); CANDS=r.list||[];
    if(!CANDS.length) $('#cands').innerHTML='<div class="note" style="margin-top:6px">찾지 못했어요. "부산 ○○구 ○○동" 처럼 넣어 보세요</div>';
    else if(CANDS.length===1) analyze(CANDS[0]); else paintCands();
  }catch(e){ $('#cands').innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
  finally{ busy=false; const b=$('#find'); if(b) b.disabled=false; }
}
async function analyze(c,keep){
  RADIUS=+($('#rad')&&$('#rad').value)||RADIUS;
  $('#result').innerHTML='<div class="card empty">분석하는 중… (5초쯤 걸려요)</div>';
  try{ const res=await fn({action:'analyze',x:c.x,y:c.y,radius:RADIUS});
    CUR=Object.assign(keep?{id:CUR.id,memo:CUR.memo}:{},{name:keep?CUR.name:c.name,addr:c.addr,x:c.x,y:c.y,radius:RADIUS,res});
    CANDS=[]; render(); $('#result').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){ $('#result').innerHTML=`<div class="card"><div class="warnbox">${esc(e.message)}</div></div>`; }
}
async function save(asNew){
  if(!CUR) return; const name=$('#sname').value.trim()||CUR.name||'후보지', memo=$('#smemo').value;
  const id=(!asNew&&CUR.id)||('a:'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)));
  const data={name,addr:CUR.addr,x:CUR.x,y:CUR.y,radius:CUR.radius,res:CUR.res,memo,at:CUR.res.at};
  try{ await putRow(HQ.id,id,data); SAVED[id]=data; CUR=Object.assign({},data,{id}); render(); toast('저장했어요'); }
  catch(e){ toast('저장하지 못했어요: '+e.message); }
}
let locFor=null;
async function setLoc(sid){
  const s=STORES.find(x=>x.id===sid); const q=prompt(`${s.name} 주소를 넣어 주세요`,(LOCS[sid]||{}).addr||''); if(!q||q.trim().length<2) return;
  locFor=sid; $('#locCands').innerHTML='<div class="note">찾는 중…</div>';
  try{ const r=await fn({action:'geocode',q:q.trim()}); const L=r.list||[];
    if(!L.length){ $('#locCands').innerHTML='<div class="note">찾지 못했어요</div>'; return; }
    if(L.length===1) return pickLoc(L[0]);
    window._locL=L; $('#locCands').innerHTML='<div class="note">어느 곳인가요?</div>'+L.map((c,i)=>`<button data-lc="${i}"><b>${esc(c.name)}</b><br><small>${esc(c.addr)}</small></button>`).join('');
  }catch(e){ $('#locCands').innerHTML=`<div class="warnbox">${esc(e.message)}</div>`; }
}
async function pickLoc(c){
  const data={addr:c.addr||c.name,x:c.x,y:c.y};
  try{ await putRow(locFor,'loc',data); LOCS[locFor]=data; render(); toast('매장 위치를 저장했어요'); }catch(e){ toast('저장하지 못했어요: '+e.message); }
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='find') return find();
  if(t.dataset.cand!=null) return analyze(CANDS[+t.dataset.cand]);
  if(t.id==='save') return save(false);
  if(t.id==='saveNew') return save(true);
  if(t.id==='redo'&&CUR) return analyze({name:CUR.name,addr:CUR.addr,x:CUR.x,y:CUR.y},true);
  if(t.id==='print') return window.print();
  if(t.dataset.open){ const a=SAVED[t.dataset.open]; CUR=Object.assign({},a,{id:t.dataset.open}); RADIUS=a.radius||1000; render(); $('#result').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.dataset.del){ const a=SAVED[t.dataset.del]; if(!confirm(`"${a.name}" 분석을 지울까요?`)) return;
    try{ await putRow(HQ.id,t.dataset.del,null); delete SAVED[t.dataset.del]; if(CUR&&CUR.id===t.dataset.del) delete CUR.id; render(); toast('지웠어요'); }catch(err){ toast('지우지 못했어요: '+err.message); } return; }
  if(t.dataset.loc) return setLoc(t.dataset.loc);
  if(t.dataset.lc!=null) return pickLoc(window._locL[+t.dataset.lc]);
  if(t.dataset.locdel){ if(!confirm('이 매장 위치를 지울까요?')) return; try{ await putRow(t.dataset.locdel,'loc',null); delete LOCS[t.dataset.locdel]; render(); }catch(err){ toast(err.message); } }
});
document.addEventListener('toggle',e=>{ if(e.target.id==='locs') LOC_OPEN=e.target.open; },true);
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='q'){ e.preventDefault(); find(); } });
document.addEventListener('change',async e=>{
  if(e.target.id==='rad') RADIUS=+e.target.value;
  if(e.target.id==='zone'){ CFG.zoneKm=+e.target.value; try{ await putRow(HQ.id,'cfg',CFG); render(); }catch(err){ toast(err.message); } }
});

function blocked(msg){ $('#sync').textContent=''; $('#main').innerHTML=`<div class="card"><b>${esc(msg)}</b><div class="note" style="margin-top:6px">통합관리(index.html)에서 본사 계정으로 로그인하면 보여요.</div></div>`; }
async function start(){
  if(!readSes()) return blocked('로그인이 필요해요');
  try{
    const r=await jx('/rest/v1/rpc/sch_my_stores',{method:'POST',body:'{}'});
    if(!r.some(x=>x.role==='hq')) return blocked('상권 분석은 본사 계정만 쓸 수 있어요');
    STORES=r.filter(x=>x.role); HQ=STORES.find(x=>x.is_hq)||STORES[0];
    await loadAll(); $('#sync').textContent=''; render();
  }catch(e){ blocked(e.auth||e.status===401?'로그인이 필요해요':'연결 실패: '+e.message); }
}
window.pullNow=()=>{};            // 통합 틀이 탭을 다시 열 때 부름 — 자동 확인 없음 (전송량 절약)
start();
</script>
