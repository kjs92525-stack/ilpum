<!doctype html>
<html lang="ko">
<head>
<title>일품집 상권분석</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f3f5f3;--panel:#fff;--ink:#17201b;--sub:#66726b;--line:#e3e8e4;--accent:#14524a;--accent2:#1d7a6d;--accent-ink:#fff;--warn:#c0392b;--ok:#2e7d4f;--soft:#eef3ef;--gold:#b88a2a;--shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.05);
  --gA:#2e7d4f;--gB:#2b6cb0;--gC:#d9822b;--gD:#b83a3a;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--panel:#18211d;--ink:#e8ede9;--sub:#98a69e;--line:#2a3630;--accent:#34a393;--accent2:#34a393;--soft:#202b26;--warn:#ff7a6b;--ok:#6fcf97;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(135deg,#0e3d37,#14524a 60%,#1d7a6d);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{margin:0;font-size:17px;letter-spacing:-.2px}
header .tag{font-size:11.5px;opacity:.9;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:1px 9px}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:6px}
nav button{background:transparent;border:0;color:#fff;opacity:.72;padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:700}
nav button:hover{opacity:1}
nav button[aria-current]{opacity:1;background:rgba(255,255,255,.2)}
.sp{flex:1}
main{max-width:1320px;margin:0 auto;padding:14px 14px 90px}
.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.85fr);gap:14px;align-items:start}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.mapbox{order:-1;position:static!important}#map{height:260px!important;min-height:0!important}}
.mapbox{position:sticky;top:66px}
#map{height:calc(100vh - 118px);min-height:380px;border-radius:var(--r);background:var(--soft);border:1px solid var(--line);overflow:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:16.5px;letter-spacing:-.2px}
.card h3{margin:0 0 8px;font-size:14.5px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--warn)}.btn.sm{padding:4px 11px;font-size:13px}.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:-1px}
textarea{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid2 label{font-size:12.5px;color:var(--sub);font-weight:700;display:flex;flex-direction:column;gap:3px}
.cands button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;margin-top:6px;cursor:pointer}
.cands button:hover{border-color:var(--accent)}.cands small{color:var(--sub)}
.gr{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;border-radius:8px;color:#fff;font-weight:800;padding:0 7px;font-size:13px}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}
.st{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--sub)}
.st[data-s="계약"]{background:var(--ok);color:#fff}.st[data-s="탈락"]{text-decoration:line-through}.st[data-s="현장 확인"]{background:#dbeafe;color:#1e4f8f}
.cc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--panel)}
.cc:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.cc .sc{width:54px;height:54px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.05;text-align:center}
.cc .sc small{font-size:11px;font-weight:700;opacity:.9}.cc .sc b{font-size:20px}
.cc .sc.none{background:var(--soft);color:var(--sub)}
.mini{display:flex;gap:3px;margin-top:6px}.mini i{display:block;width:34px;height:5px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}.mini i b{position:absolute;left:0;top:0;bottom:0;background:var(--accent2)}
.chk{width:18px;height:18px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .chips{justify-content:center}}
.gauge{position:relative}
.gauge svg{transform:rotate(-90deg)}
.gauge .gn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .gn b{line-height:1;font-weight:800}
.verdict{font-size:16px;font-weight:800;letter-spacing:-.3px}
.radar{display:block;margin:0 auto;max-width:400px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.sw{border-radius:12px;padding:10px 12px}
.sw.g{background:rgba(46,125,79,.09)}.sw.b{background:rgba(192,57,43,.08)}
.sw h4{margin:0 0 6px;font-size:13.5px}.sw ul{margin:0;padding-left:18px;font-size:13.5px}.sw li{margin:3px 0}
.dm{border-top:1px solid var(--line);padding:12px 0}
.dm:first-of-type{border-top:0}
.dm-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.dm-h b{font-size:15px}.dm-h .w{font-size:12px;color:var(--sub)}
.dm-sc{margin-left:auto;font-weight:800;font-size:15px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent2);border-radius:4px}
.sr{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(70px,.7fr) minmax(90px,1.3fr) 74px;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
@media (max-width:640px){.sr{grid-template-columns:1fr auto;gap:2px 8px}.sr .strip{grid-column:1/-1;order:5}}
.sr .v{font-weight:700;text-align:right;white-space:nowrap}
.sr .lb{color:var(--sub)}
.pill{justify-self:end;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--sub);white-space:nowrap}
.pill.hi{background:rgba(46,125,79,.14);color:var(--ok)}.pill.lo{background:rgba(192,57,43,.12);color:var(--warn)}
.strip{position:relative;height:16px}
.strip::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line);border-radius:2px}
.strip i{position:absolute;top:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#aab5ae;opacity:.8}
.strip b{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--accent)}
.strip u{position:absolute;top:2px;bottom:2px;width:0;border-left:2px dashed var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.best{background:rgba(46,125,79,.13);font-weight:800}
.ring{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.ring div{background:var(--soft);border-radius:12px;text-align:center;padding:9px 4px}
.ring b{display:block;font-size:22px;line-height:1.1}.ring span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--soft);border-radius:999px;padding:3px 11px;font-size:13px}
.warnbox{border:1px solid var(--warn);background:rgba(192,57,43,.07);color:var(--warn);border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:700;font-size:14px}
.okbox{border:1px solid var(--ok);background:rgba(46,125,79,.07);color:var(--ok);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14px}
.infobox{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 13px;margin:8px 0;font-size:13.5px}
.prog{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--gold);transition:width .2s}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
.toast.on{opacity:1}
.mk{display:inline-block;font:700 12px/1 sans-serif;color:#fff;border:2px solid #fff;border-radius:999px;padding:4px 8px;box-shadow:0 1px 5px rgba(0,0,0,.45);white-space:nowrap;transform:translateY(-4px)}
.mk.dot{padding:0;width:11px;height:11px}
.disc{font-size:12.5px;color:var(--sub);border-top:1px dashed var(--line);margin-top:12px;padding-top:9px}
.ponly{display:none}
details summary{cursor:pointer}
.secnav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:56px;z-index:20;background:var(--bg);padding:6px 0 8px;margin:-6px 0 4px}
.secnav a{text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.secnav a:hover{border-color:var(--accent)}
@media (max-width:1000px){.secnav{position:static}}
.card[id^="s-"]{scroll-margin-top:110px}
.type{display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:4px 12px;font-weight:800;font-size:15px}
.op p{margin:8px 0;line-height:1.7;font-size:14.5px}
.todo{margin:6px 0 0;padding-left:0;list-style:none}.todo li{position:relative;padding:5px 0 5px 26px;font-size:14px;border-bottom:1px dashed var(--line)}
.todo li::before{content:"";position:absolute;left:2px;top:8px;width:14px;height:14px;border:2px solid var(--accent2);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--soft);border-radius:12px;padding:10px 12px}.kpi span{display:block;font-size:12px;color:var(--sub);font-weight:700}.kpi b{display:block;font-size:20px;margin-top:2px;letter-spacing:-.3px}.kpi small{color:var(--sub);font-size:11.5px}
.kpi.bad b{color:var(--warn)}
.fr{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stars{display:flex;gap:4px}.stars button{width:34px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-weight:800;color:var(--sub)}
.stars button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mix{font-size:13px;color:var(--sub);margin-top:4px}
@media print{header,.noprint,.mapbox,nav{display:none!important}.wrap{display:block}main{max-width:none;padding:0}.card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}.ponly{display:block}body{background:#fff;color:#000}.sr{grid-template-columns:1.1fr .7fr 1.3fr 74px}}
</style>
</head>
<body>
<header>
  <h1>일품집 상권분석</h1><span class="tag">대구 · 본사 내부용</span>
  <nav id="nav"><button data-tab="list">후보지</button><button data-tab="detail">분석</button><button data-tab="cmp">비교</button><button data-tab="set">설정</button></nav>
  <span class="sp"></span><span id="sdk" style="font-size:12px;opacity:.85"></span>
</header>
<main><div class="wrap"><div id="pane"></div><div class="mapbox"><div id="map"></div><div class="legend" id="legend"></div></div></div></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* =====================================================================
   일품집 상권분석 (대구) — 서버 없이 카카오 지도 JavaScript SDK 만 사용
   - JavaScript 키는 카카오 개발자 사이트에 등록한 주소에서만 동작하는 공개용 키
   - 후보지 기록은 이 브라우저(localStorage)에 저장, 설정 → 백업 파일로 옮김
   - 점수 = 대구 "기준 상권"(설정에서 편집) 측정값과 비교한 백분위. 자료는 카카오 지도 등록 기준
   ===================================================================== */
const KAKAO_JS_KEY='1aaf38e9a5c0669aad33526fced00618';
const STORE_KEY='ilpum-sk-v1';
const STATUSES=['검토 중','현장 확인','보류','탈락','계약'];
const DEF_BENCH=['동성로','반월당역','범어역','수성못','들안길','동대구역','칠곡3지구','상인역','월배역','계명대역','죽전역','두류역','신매역','대곡역','경북대학교 북문','침산동','앞산카페거리','율하역','대구혁신도시','대실역'];

/* ---- 분석 영역과 지표 (d = 한 지점에서 모은 값과 거기서 계산한 값) ---- */
const fm=v=>v==null?'-':v<1000?Math.round(v)+'m':(v/1000).toFixed(1)+'km';
const DIMS=[
  {k:'hub',t:'저녁 외식 상권',w:20,why:'사람이 저녁에 모이는 곳인가',subs:[
    {k:'food500',t:'음식점',u:'곳',r:'500m',get:d=>d.food500},
    {k:'meat500',t:'고깃집',u:'곳',r:'500m',get:d=>d.meat500},
    {k:'pub500',t:'술집',u:'곳',r:'500m',get:d=>d.pub500},
    {k:'cafe500',t:'카페',u:'곳',r:'500m',get:d=>d.cafe500},
    {k:'cvs500',t:'편의점 (유동 대용)',u:'곳',r:'500m',get:d=>d.cvs500}]},
  {k:'fam',t:'가족·주거',w:20,why:'가족 손님과 동네 단골',subs:[
    {k:'apt500',t:'아파트',u:'건',r:'500m',get:d=>d.apt500},
    {k:'apt1k',t:'아파트',u:'건',r:'1km',get:d=>d.apt1k},
    {k:'school1k',t:'학교',u:'곳',r:'1km',get:d=>d.school1k},
    {k:'acad1k',t:'학원',u:'곳',r:'1km',get:d=>d.acad1k}]},
  {k:'biz',t:'회식·방문 수요',w:15,why:'직장인 회식, 병원·관공서 방문객',subs:[
    {k:'gov1k',t:'관공서',u:'곳',r:'1km',get:d=>d.gov1k},
    {k:'bank1k',t:'은행',u:'곳',r:'1km',get:d=>d.bank1k},
    {k:'hosp1k',t:'병원',u:'곳',r:'1km',get:d=>d.hosp1k},
    {k:'lodge1k',t:'숙박',u:'곳',r:'1km',get:d=>d.lodge1k},
    {k:'mart1k',t:'대형마트',u:'곳',r:'1km',get:d=>d.mart1k}]},
  {k:'acc',t:'접근성',w:20,why:'차로·대중교통으로 오기 쉬운가',subs:[
    {k:'park300',t:'주차장',u:'곳',r:'300m',get:d=>d.park300},
    {k:'park500',t:'주차장',u:'곳',r:'500m',get:d=>d.park500},
    {k:'subD',t:'가까운 지하철역',u:'',r:'',low:true,get:d=>d.subD,fmt:fm},
    {k:'bus300',t:'버스정류장',u:'곳',r:'300m',get:d=>d.bus300}]},
  {k:'comp',t:'경쟁',w:25,why:'가까운 장어집이 적을수록 유리',subs:[
    {k:'compIdx',t:'경쟁 지수 (거리 가중)',u:'',r:'',low:true,get:d=>d.compIdx,fmt:v=>v==null?'-':(+v).toFixed(1)},
    {k:'n500',t:'장어집',u:'곳',r:'500m',low:true,get:d=>d.n500},
    {k:'alt1k',t:'대체 보양식 (오리·백숙 등)',u:'곳',r:'1km',low:true,get:d=>d.alt1k}]}
];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//.test(String(u||''))?String(u):'';
const fmtM=fm;
const fmtN=n=>n==null||n===''?'-':Number(n).toLocaleString('ko-KR');
const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),3000); }
function distM(a,b){ const R=6371000,r=Math.PI/180,dLat=(b.y-a.y)*r,dLon=(b.x-a.x)*r; const h=Math.sin(dLat/2)**2+Math.cos(a.y*r)*Math.cos(b.y*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- 저장 ---------------- */
const defW=()=>Object.fromEntries(DIMS.map(i=>[i.k,i.w]));
const defFin=()=>({cost:40,labor:25,var:8,other:200,ticket:4,days:26,interior:250});
const defDB=()=>({v:2,stores:[],zoneKm:2,weights:defW(),fin:defFin(),benchNames:DEF_BENCH.slice(),bench:null,cands:[]});
let DB=defDB();
// 예전(v1) 기록: 후보지·매장·설정은 살리고, 분석값은 새 형식이 아니라 다시 분석하도록 비움
function migrate(j){
  if(!j||!Array.isArray(j.cands)) return null;
  const o=Object.assign(defDB(),j,{v:2});
  if(j.v!==2){ o.bench=null; o.weights=defW(); o.cands=j.cands.map(c=>{ const x=Object.assign({},c); delete x.m; return x; }); }
  o.weights=Object.assign(defW(),o.weights||{}); o.fin=Object.assign(defFin(),o.fin||{});
  return o;
}
function load(){ try{ const j=migrate(JSON.parse(localStorage.getItem(STORE_KEY))); if(j) DB=j; }catch(e){} }
function save(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); }catch(e){ toast('이 브라우저에 저장하지 못했어요. 설정 → 백업 파일로 받아 두세요'); } }

/* ---------------- 카카오 SDK ---------------- */
let K=null;
function loadSdk(){
  return new Promise(res=>{
    const s=document.createElement('script');
    s.src='https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&libraries=services&appkey='+KAKAO_JS_KEY;

/* ---------------- 계산: 값 → 백분위 → 영역 점수 → 종합 ---------------- */
function derive(m){

    d.compIdx=d.n300+0.7*(d.n500-d.n300)+0.35*(d.n1k-d.n500); }
  else{ d.n300=d.n500=d.n1k=d.compIdx=null; }

  return d;
}
// 기준 값들 속 위치 (0~100, 클수록 좋음). 같은 값이 많으면 가운데로 계산
function pct(v,arr,low){ if(!arr.length) return null; let less=0,eq=0; arr.forEach(a=>{ if(a<v) less++; else if(a===v) eq++; }); const p=(less+eq/2)/arr.length*100; return Math.round(low?100-p:p); }
function benchD(){ return DB.bench?DB.bench.points.filter(b=>b.m&&b.m.v===2).map(b=>derive(b.m)):[]; }
let _bc=null;
function benchCache(){ const key=(DB.bench?DB.bench.at+DB.bench.points.length:'')+JSON.stringify(DB.weights); if(_bc&&_bc.key===key) return _bc; _bc={key,list:benchD()}; _bc.arr={}; DIMS.forEach(dm=>dm.subs.forEach(s=>{ _bc.arr[s.k]=_bc.list.map(d=>s.get(d)).filter(v=>v!=null); })); _bc.totals=null; return _bc; }
function evalD(d,withBench=true){
  const B=withBench?benchCache():null, W=DB.weights;
  const dims=DIMS.map(dm=>{
    const subs=dm.subs.map(s=>{ const v=s.get(d); const arr=B?B.arr[s.k]:[]; const p=(v!=null&&arr.length)?pct(v,arr,s.low):null;
      let rank=null; if(p!=null) rank=arr.filter(a=>s.low?a<v:a>v).length+1;
      return Object.assign({},s,{v,p,arr,rank,of:arr.length}); });
    const ps=subs.map(s=>s.p).filter(x=>x!=null);
    return {k:dm.k,t:dm.t,w:+W[dm.k]||0,why:dm.why,subs,score:ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):null};
  });
  const ok=dims.filter(x=>x.score!=null), ws=ok.reduce((a,x)=>a+x.w,0);
  const total=ok.length&&ws?Math.round(ok.reduce((a,x)=>a+x.w*x.score,0)/ws):null;

}

    : d.n1k>=5?`반경 1km 안에 장어집이 ${d.n1k}곳${c.m.compMore?' 이상':''} 모여 있어요. 손님이 일부러 찾아오는 목적형 상권이지만, 가격·맛·서비스에서 확실한 차별점이 없으면 묻힐 수 있어요.`
    : d.n300>0?`300m 안에 직접 경쟁하는 장어집(${esc(d.comp[0].name)}, ${fmtM(d.comp[0].dist)})이 있어요. 그 가게의 가격대와 저녁 손님 수를 직접 확인하세요.`
    : `1km 안 장어집은 ${d.n1k}곳이고 300m 안에는 없어 경쟁 부담은 크지 않은 편이에요.`);
  const sub=d.subway&&d.subway[0], pp=subP(s,'park500');
  P.push(`${sub?`가장 가까운 지하철역은 ${esc(sub.name)}(${fmtM(d.subD)})이고`:'2km 안에 지하철역이 없고'}, 500m 안 주차장은 ${fmtN(d.park500)}곳이에요.${pp!=null&&pp<=30?' 장어집은 차로 오는 가족·회식 손님이 많아 주차 대책이 꼭 필요해요.':''}`);
  const sp=satP(d); if(sp!=null) P.push(sp<=35?'배후 수요(아파트·관공서·병원)에 비해 음식점이 많은 편이라 외식 경쟁이 치열해요.':sp>=65?'배후 수요에 비해 음식점이 적은 편이라 외식 수요를 흡수할 여지가 있어요.':'배후 수요와 음식점 수는 대구 기준 상권과 비슷한 수준이에요.');
  if(fin) P.push(`월세 ${fmtN(c.rent)}만원 기준 손익분기 월매출은 약 <b>${fmtN(Math.round(fin.need))}만원</b>, 하루 손님 약 <b>${Math.ceil(fin.guests)}명</b>이 필요해요.${fin.target?(fin.rentRatio>12?` 목표 매출 대비 임대료 비율이 ${fin.rentRatio.toFixed(1)}%로 높은 편이에요(10% 이하 권장).`:` 목표 매출 대비 임대료 비율은 ${fin.rentRatio.toFixed(1)}%로 적정해요.`):''}`);
  const clash=nearStores(c).filter(n=>n.d<(+DB.zoneKm||2)*1000);
  if(clash.length) P.push(`<span style="color:var(--warn);font-weight:700">우리 매장 ${esc(clash[0].name)}과 ${fmtM(clash[0].d)} 거리라 영업지역(${DB.zoneKm}km)이 겹쳐요. 가맹계약상 출점이 어려울 수 있어요.</span>`);
  return P;
}

/* ---------------- 대구 기준 상권 만들기 ---------------- */
let benchBusy=false;
async function buildBench(){
  if(!K) return toast('카카오 지도가 아직 안 열렸어요');
  if(benchBusy) return; benchBusy=true; render();
  const names=DB.benchNames.filter(Boolean), pts=[];
  try{
    for(let i=0;i<names.length;i++){
      setProg(`기준 상권 ${i+1}/${names.length} · ${names[i]}`,i/names.length);
      const k=await retry(()=>kcall(cb=>K.ps.keywordSearch('대구 '+names[i],cb,{size:1})));
      const x=k.list[0]; if(!x){ pts.push({name:names[i],err:'못 찾음'}); continue; }
      const p={x:+x.x,y:+x.y};
      try{ const m=await measure(p,(n,t)=>setProg(`기준 상권 ${i+1}/${names.length} · ${names[i]}`,(i+n/t)/names.length)); pts.push({name:names[i],place:x.place_name,x:p.x,y:p.y,m}); }
      catch(e){ pts.push({name:names[i],err:'측정 실패'}); }
    }
    DB.bench={at:today(),points:pts}; _bc=null; save();
    toast(`대구 기준 상권 ${pts.filter(b=>b.m).length}곳을 만들었어요`);
  }catch(e){ toast(e.message); }
  finally{ benchBusy=false; setProg('',0); render(); }
}
function setProg(label,f){ const el=$('#prog'); if(!el) return; el.hidden=!label; el.querySelector('span').textContent=label; el.querySelector('i').style.width=Math.round(f*100)+'%'; }

/* ---------------- 그림: 게이지 · 레이더 · 분포 ---------------- */
const GC={A:'#2e7d4f',B:'#2b6cb0',C:'#d9822b',D:'#b83a3a'};
function gauge(score,grade,size){
  const r=size*0.41, C=2*Math.PI*r, c=GC[grade]||'#999', sw=size*0.085;
  return `<div class="gauge" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(score/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="gn"><b style="font-size:${size*0.26}px">${score}</b><span class="gr g${grade}" style="margin-top:4px;height:20px;font-size:12px">${grade}</span></div></div>`;
}
const PAL=['#14524a','#d9822b','#2b6cb0','#b83a3a'];
function radar(series){
  const n=DIMS.length, W=380, H=300, cx=W/2, cy=H/2+6, R=96, ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*v/100*Math.cos(ang(i)), cy+R*v/100*Math.sin(ang(i))];
  const ring=v=>DIMS.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g=`<polygon points="${ring(100)}" fill="none" stroke="var(--line)"/><polygon points="${ring(75)}" fill="none" stroke="var(--line)"/><polygon points="${ring(50)}" fill="none" stroke="var(--gold)" stroke-dasharray="3 3"/><polygon points="${ring(25)}" fill="none" stroke="var(--line)"/>`;
  DIMS.forEach((dm,i)=>{ const [x,y]=pt(i,100), [lx,ly]=pt(i,118); g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${lx<cx-4?'end':lx>cx+4?'start':'middle'}" font-size="12" font-weight="700" fill="var(--ink)">${esc(dm.t)}</text>`; });
  series.forEach((s,k)=>{ const pts=s.map((v,i)=>pt(i,v==null?0:v)); g+=`<polygon points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="${PAL[k]}" fill-opacity="${series.length>1?.14:.22}" stroke="${PAL[k]}" stroke-width="2"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${PAL[k]}"/>`).join(''); });
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="영역별 점수 레이더 차트">${g}</svg><div class="note" style="text-align:center">점선 = 대구 기준 상권의 중간(50점)</div>`;
}
function strip(x){
  if(x.v==null||!x.arr.length) return '<div class="strip"></div>';
  const mn=Math.min(...x.arr,x.v), mx=Math.max(...x.arr,x.v), sp=(mx-mn)||1, pos=v=>((v-mn)/sp*100).toFixed(1);
  const med=[...x.arr].sort((a,b)=>a-b)[Math.floor(x.arr.length/2)];
  return `<div class="strip" title="회색 점 = 대구 기준 상권 ${x.of}곳, 큰 점 = 이 후보지, 점선 = 기준 중간값">${x.arr.map(v=>`<i style="left:${pos(v)}%"></i>`).join('')}<u style="left:${pos(med)}%"></u><b style="left:${pos(x.v)}%"></b></div>`;
}

/* ---------------- 지도 ---------------- */
let MAP=null, OVL=[];
function mk(p,label,color,dot,title){
  const el=document.createElement('div'); el.className='mk'+(dot?' dot':''); el.style.background=color; if(!dot) el.textContent=label; el.title=title||label;
  OVL.push(new kakao.maps.CustomOverlay({position:LL(p),content:el,yAnchor:1,map:MAP})); return el;
}
function circ(p,r,color,dash,fill){ OVL.push(new kakao.maps.Circle({center:LL(p),radius:r,strokeWeight:1.5,strokeColor:color,strokeOpacity:.85,strokeStyle:dash?'dashed':'solid',fillColor:color,fillOpacity:fill||0,map:MAP})); }
const lg=(c,t)=>`<span><i style="background:${c}"></i>${t}</span>`;
function drawMap(){
  if(!K) return;
  if(!MAP){ MAP=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(35.8714,128.6014),level:8});
    kakao.maps.event.addListener(MAP,'click',e=>{ if(!PICK) return; PICK=false; const ll=e.latLng; addCand({name:'지도에서 고른 곳',addr:'',x:ll.getLng(),y:ll.getLat()},true); }); }
  OVL.forEach(o=>o.setMap(null)); OVL=[];
  DB.stores.filter(s=>s.x).forEach(s=>{ mk(s,s.name,'#14524a',false,'우리 매장 · '+s.name); circ(s,(+DB.zoneKm||2)*1000,'#14524a',true,0.03); });
  const c=TAB==='detail'&&DB.cands.find(x=>x.id===CUR); let L='';
  if(c){
    if(c.m&&c.m.v===2){ circ(c,300,'#c0392b',true,0.06); circ(c,500,'#c0392b',true,0); circ(c,1000,'#c0392b',false,0.03);
      (c.m.comp||[]).forEach(p=>mk(p,'','#222',true,p.name+' · '+fmtM(p.dist)));
      (c.m.subway||[]).forEach(p=>mk(p,'역','#2b6cb0',false,p.name+' · '+fmtM(p.dist))); }
    mk(c,'후보지','#c0392b',false,c.name); MAP.setLevel(5); MAP.setCenter(LL(c));
    L=lg('#c0392b','후보지 (원 = 300·500m·1km)')+lg('#222','장어집')+lg('#2b6cb0','지하철')+lg('#14524a','우리 매장 (점선 = 영업지역)');
  }else{
    const list=TAB==='cmp'?DB.cands.filter(x=>SEL.has(x.id)):DB.cands;
    list.forEach(x=>{ const s=x.m?scoreOf(x.m):null, F=finalOf(x,s); const el=mk(x,(F.grade?F.grade+' ':'')+x.name,F.grade?GC[F.grade]:'#777',false,x.addr); el.style.cursor='pointer'; el.addEventListener('click',()=>go('detail',x.id)); });
    if(TAB==='set'&&DB.bench) DB.bench.points.filter(b=>b.m).forEach(b=>mk(b,'','#b88a2a',true,'기준 · '+b.name));
    L=TAB==='set'?lg('#b88a2a','대구 기준 상권')+lg('#14524a','우리 매장'):lg(GC.A,'A')+lg(GC.B,'B')+lg(GC.C,'C')+lg(GC.D,'D')+lg('#14524a','우리 매장');
  }
  $('#legend').innerHTML=L;
  setTimeout(()=>MAP.relayout(),0);
}

async function find(){
  const q=$('#q').value.trim(); if(q.length<2) return toast('주소나 장소를 두 글자 이상 넣어 주세요');
  if(!K) return toast('카카오 지도가 아직 안 열렸어요');
  try{ CANDS=await geocode(q); if(!CANDS.length) toast('찾지 못했어요. "대구 ○○구 ○○동" 처럼 넣어 보세요'); else if(CANDS.length===1) return addCand(CANDS[0]); render(); }
  catch(e){ toast(e.message); }
}
function addCand(p,fromMap){
  const c={id:uid(),name:p.name,addr:p.addr||p.name,x:p.x,y:p.y,status:'검토 중',created:today()};
  DB.cands.push(c); save(); CANDS=[]; go('detail',c.id); analyze(c.id);
  if(fromMap) setTimeout(async()=>{ try{ const r=await kcall(cb=>K.geo.coord2Address(c.x,c.y,cb)); const a=r.list[0]; if(a){ c.addr=(a.road_address&&a.road_address.address_name)||a.address.address_name; c.name=c.addr; save(); if(TAB==='detail'&&CUR===c.id) render(); } }catch(e){} },0);
}
async function analyze(id){
  const c=DB.cands.find(x=>x.id===id); if(!c||!K||busy) return;
  busy=true; render();
  try{
    const show=(n,t)=>{ const el=$('#anaProg'); if(!el) return; el.hidden=false; el.querySelector('span').textContent=`자료 모으는 중 ${n}/${t}`; el.querySelector('i').style.width=Math.round(n/t*100)+'%'; };
    show(0,STEPS); c.m=await measure(c,show); save();
  }catch(e){ toast(e.message); }
  finally{ busy=false; render(); }
  if(!benchOk()&&!benchBusy) toast('점수를 보려면 "대구 기준 상권 만들기"를 한 번 눌러 주세요');
}
function exportFile(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`일품집-상권분석-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importFile(f){
  const r=new FileReader(); r.onload=()=>{ try{ const j=migrate(JSON.parse(r.result)); if(!j) throw 0;
    if(!confirm(`백업의 후보지 ${j.cands.length}곳으로 바꿀까요? 지금 이 브라우저의 기록은 덮어써져요`)) return;
    DB=j; _bc=null; save(); render(); toast('불러왔어요'); }catch(e){ toast('일품집 상권분석 백업 파일이 아니에요'); } }; r.readAsText(f);
}
document.addEventListener('click',async e=>{
  const nb=e.target.closest('#nav button'); if(nb) return go(nb.dataset.tab);
  if(e.target.matches('[data-sel]')){ const id=e.target.dataset.sel; e.target.checked?SEL.add(id):SEL.delete(id); const b=$('[data-act=cmpSel]'); if(b){ b.disabled=SEL.size<2; b.textContent=`선택 ${SEL.size}곳 비교`; } e.stopPropagation(); return; }
  const cc=e.target.closest('[data-open]'); if(cc&&!e.target.closest('input')) return go('detail',cc.dataset.open);
  const t=e.target.closest('button,[data-act]'); if(!t) return;
  if(t.dataset.cand!=null) return addCand(CANDS[+t.dataset.cand]);
  if(t.dataset.sc!=null){ const p=window._sc[+t.dataset.sc]; DB.stores.push({name:window._scName,addr:p.addr,x:p.x,y:p.y}); save(); render(); return; }
  if(t.dataset.fs){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.field=c.field||{}; const v=+t.dataset.v; c.field[t.dataset.fs]=c.field[t.dataset.fs]===v?0:v; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.sdel!=null){ if(confirm('이 매장을 지울까요?')){ DB.stores.splice(+t.dataset.sdel,1); save(); render(); } return; }
  const a=t.dataset.act;
  if(a==='find') return find();
  if(a==='pick'){ PICK=!PICK; render(); if(PICK) toast('지도에서 후보지 위치를 누르세요'); return; }
  if(a==='bench') return buildBench();
  if(a==='cmpSel') return go('cmp');
  if(a==='redo') return analyze(CUR);
  if(a==='print') return window.print();
  if(a==='del'){ const c=DB.cands.find(x=>x.id===CUR); if(c&&confirm(`"${c.name}" 후보지를 지울까요?`)){ DB.cands=DB.cands.filter(x=>x.id!==CUR); SEL.delete(CUR); save(); go('list',null); } return; }
  if(a==='sadd'){ const n=$('#sname').value.trim(), q=$('#saddr').value.trim(); if(!n||q.length<2) return toast('매장 이름과 주소를 넣어 주세요'); if(!K) return;
    try{ const L=await geocode(q); if(!L.length) return toast('주소를 찾지 못했어요');
      if(L.length===1){ DB.stores.push({name:n,addr:L[0].addr,x:L[0].x,y:L[0].y}); save(); render(); return; }
      window._sc=L; window._scName=n; $('#scands').innerHTML='<div class="note">어느 곳인가요?</div>'+L.map((p,i)=>`<button data-sc="${i}"><b>${esc(p.name)}</b><br><small>${esc(p.addr)}</small></button>`).join(''); }catch(err){ toast(err.message); } return; }
  if(a==='wreset'){ DB.weights=defW(); save(); render(); return; }
  if(a==='finreset'){ DB.fin=defFin(); save(); render(); return; }
  if(a==='export') return exportFile();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f; if(f){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c[f]=e.target.type==='number'?(e.target.value===''?'':+e.target.value):e.target.value; save(); if(['rent','area','premium','target'].includes(f)){ const el=$('#finres'); if(el) el.innerHTML=finRes(c); } return; }
  const fk=e.target.dataset.fin; if(fk){ DB.fin[fk]=Math.max(0,+e.target.value||0); save(); return; }
  const w=e.target.dataset.w; if(w){ DB.weights[w]=Math.max(0,+e.target.value||0); save(); return; }
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(e.target.dataset.f==='status'||e.target.dataset.w) return render();
  if(id==='filter'){ FILTER=e.target.value; render(); }
  if(id==='zone'){ DB.zoneKm=+e.target.value; save(); render(); }
  if(id==='benchNames'){ DB.benchNames=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,40); save(); }
  if(id==='imp'&&e.target.files[0]) importFile(e.target.files[0]);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='q'){ e.preventDefault(); find(); } });

load(); render();
$('#sdk').textContent='카카오 지도 여는 중…';
loadSdk().then(ok=>{
  $('#sdk').textContent=ok?'':'카카오 지도 연결 실패';
  if(!ok){ $('#map').innerHTML=`<div class="empty">카카오 지도를 열지 못했어요.<br>카카오 개발자 사이트(JavaScript 키 → 사이트 도메인)에 지금 열고 있는 주소 ${esc(location.origin)} 를 등록했는지, 카카오맵 사용 설정이 켜져 있는지 확인해 주세요.</div>`; }
  render();
});
</script>
</body>
