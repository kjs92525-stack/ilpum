<!doctype html>
<html lang="ko">
<head>
<title>일품집 상권분석</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 보고서형 디자인: 네이비 한 색 + 회색, 제목·큰 숫자는 명조 */
:root{--bg:#f3f4f6;--paper:#fff;--ink:#141a26;--ink2:#2b3445;--sub:#6b7383;--faint:#9aa1ad;--line:#e2e5ea;--line2:#cfd4dc;
  --navy:#1c3557;--navy2:#2d5282;--navyT:rgba(28,53,87,.07);--gold:#a8822e;--warn:#a13a32;--ok:#2f6b4f;--soft:#f1f3f6;
  --gA:#2f6b4f;--gB:#2d5282;--gC:#a8822e;--gD:#a13a32;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:sticky;top:0;z-index:50;min-height:58px}
header h1{margin:0;font:700 17px/1 var(--serif);color:var(--navy);letter-spacing:-.02em}
header .tag{font-size:11px;color:var(--sub);border-left:1px solid var(--line2);padding-left:12px;letter-spacing:.04em}
nav{display:flex;gap:2px;align-self:stretch}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:0 14px;cursor:pointer;font-weight:600;font-size:14.5px}
nav button:hover{color:var(--ink)}
nav button[aria-current]{color:var(--navy);border-bottom-color:var(--navy)}
.sp{flex:1}
main{max-width:1340px;margin:0 auto;padding:22px 20px 100px}
.wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);gap:22px;align-items:start}
@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}.mapbox{order:-1;position:static!important}#map{height:250px!important;min-height:0!important}header{padding:6px 14px;gap:10px}nav button{padding:10px 10px}main{padding:14px 12px 90px}}
.mapbox{position:sticky;top:80px}
#map{height:calc(100vh - 130px);min-height:380px;border:1px solid var(--line);background:var(--soft);overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* 종이 */
.card{background:var(--paper);border:1px solid var(--line);padding:24px 26px;margin-bottom:16px}
@media (max-width:640px){.card{padding:18px 16px}}
.card h2{margin:0;font:700 18px/1.35 var(--serif);color:var(--ink);letter-spacing:-.02em}
.card h3{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--ink2)}
.sh{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--ink)}
.sh .no{font:700 13px/1 var(--serif);color:var(--gold);letter-spacing:.06em}
.sh .aside{margin-left:auto;font-size:13px;color:var(--sub)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.btn{border:1px solid var(--line2);background:var(--paper);padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-block;color:var(--ink2);border-radius:4px}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2);color:#fff}
.btn.bad{color:var(--warn)}.btn.sm{padding:5px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
.note{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:36px 10px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:4px;padding:8px 10px;background:var(--paper);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:-1px}
textarea{width:100%;min-height:76px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid2 label{font-size:12px;color:var(--sub);font-weight:600;display:flex;flex-direction:column;gap:4px}
.cands button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);padding:10px 14px;margin-top:6px;cursor:pointer}
.cands button:hover{border-color:var(--navy)}.cands small{color:var(--sub)}
.gr{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;color:#fff;font:700 13px/1 var(--serif);padding:0 6px;border-radius:3px}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}
.st{display:inline-block;padding:1px 8px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--sub);border-radius:3px;vertical-align:2px}
.st[data-s="계약"]{background:var(--ok);border-color:var(--ok);color:#fff}.st[data-s="탈락"]{text-decoration:line-through}.st[data-s="현장 확인"]{border-color:var(--navy2);color:var(--navy2)}
/* 목록 */
.cc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cc:last-child{border-bottom:0}
.cc:hover{background:var(--soft)}
.cc .sc{width:56px;text-align:center}
.cc .sc b{display:block;font:700 26px/1 var(--serif);color:var(--ink)}
.cc .sc small{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.cc .sc.none b{color:var(--faint);font-size:14px;font-family:var(--sans)}
.cc .nm{font-weight:700;font-size:15.5px}
.mini{display:flex;gap:3px;margin-top:7px}.mini i{display:block;width:30px;height:4px;background:var(--line);position:relative;overflow:hidden}.mini i b{position:absolute;left:0;top:0;bottom:0;background:var(--navy)}
.chk{width:18px;height:18px;accent-color:var(--navy)}
.warnmark{color:var(--warn);font-size:12px;font-weight:700;margin-left:6px}

/* ---- 시각 자료 (표지 점수 링 · 요약 타일 · 차트) ---- */
.card{border-radius:10px;box-shadow:0 1px 2px rgba(20,26,38,.04),0 6px 20px rgba(20,26,38,.04)}
.btn{border-radius:8px}.facts,.kpis,.ring{border-radius:8px;overflow:hidden}
.chip{border-radius:999px;background:var(--soft);border-color:transparent}
.scorebox{border:0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.scorebox .lab{padding:0}
.donut{--p:0;width:148px;height:148px;border-radius:50%;background:conic-gradient(var(--gcol,var(--navy)) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center}
.donut>div{width:116px;height:116px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.donut .num{font:700 40px/1 var(--serif);padding:0}.donut .num small{font-size:12px}
.scorebox .dec{border:0;padding:0;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--soft);border-radius:10px;padding:13px 14px;border-left:3px solid var(--navy)}
.tile.bad{border-left-color:var(--warn)}.tile.good{border-left-color:var(--ok)}
.tile span{display:block;font-size:11.5px;color:var(--sub)}
.tile b{display:block;font:700 24px/1.25 var(--serif);margin-top:2px}.tile b small{font:600 12px var(--sans);color:var(--sub);margin-left:2px}
.tile em{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px}
.vizrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:6px 0 18px}
@media (max-width:860px){.vizrow{grid-template-columns:1fr}}
.viz{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--paper)}
.viz h4{margin:0 0 2px;font-size:13.5px;font-weight:700;color:var(--ink)}
.viz .cap{font-size:12px;color:var(--sub);margin-bottom:10px}
.age{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:8px}
.age div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.age i{display:block;width:100%;background:#c3cad6;border-radius:4px 4px 0 0;min-height:2px}
.age .hl i{background:var(--navy)}
.age span{font-size:10.5px;color:var(--sub);margin-bottom:3px}.age .hl span{color:var(--ink);font-weight:700}
.age.lb{height:auto;margin-top:4px;align-items:flex-start}.age.lb span{margin:0;text-align:center;width:100%;font-size:10.5px}
.rkrow{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:12px;height:19px}
.rkrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.rkrow .bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.rkrow .bar i{display:block;height:100%;background:#aab3c2;border-radius:4px}
.rkrow .v{text-align:right;font-weight:600;color:var(--sub)}
.rkrow.me .nm,.rkrow.me .v{color:var(--ink);font-weight:800}.rkrow.me .bar i{background:var(--gold)}
.dv{display:grid;grid-template-columns:minmax(80px,1.1fr) 1.4fr 30px;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.dv .nm{line-height:1.3}.dv .nm small{display:block;color:var(--sub);font-size:11px}
.dv .tr{position:relative;height:10px;background:var(--soft);border-radius:5px}.dv .tr::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid var(--line2)}
.dv .tr i{position:absolute;top:0;bottom:0}
.dv .tr i.pos{left:50%;background:var(--ok);border-radius:0 5px 5px 0}.dv .tr i.neg{right:50%;background:var(--warn);border-radius:5px 0 0 5px}
.dv .v{font-weight:700;text-align:right}
.dvh{font-size:11.5px;font-weight:700;color:var(--sub);margin:8px 0 2px;letter-spacing:.04em}
.cmprow{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:18px;align-items:center;margin-bottom:14px}
@media (max-width:760px){.cmprow{grid-template-columns:1fr}}
.cmap{display:block;width:100%;max-width:360px;margin:0 auto}
.fbar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0 6px}
.fbar i{display:block;min-width:2px}
.flg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub)}.flg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);vertical-align:-1px}
.swotg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
@media (max-width:760px){.swotg{grid-template-columns:1fr}}
.swot{border-radius:10px;padding:13px 16px;border:1px solid var(--line);border-top:3px solid var(--navy);background:var(--paper)}
.swot h4{margin:0 0 6px;font-size:13.5px}
.swot ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:var(--ink2)}.swot li{margin:3px 0}
.swot.s{border-top-color:var(--ok)}.swot.w{border-top-color:var(--warn)}.swot.o{border-top-color:var(--navy2)}.swot.t{border-top-color:var(--gold)}
.glance{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:linear-gradient(180deg,var(--navyT),transparent 70%)}
.gl-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.gl-t{font:700 20px/1.3 var(--serif);color:var(--navy)}.gl-v{font-weight:800;font-size:14px;color:var(--ink)}.gl-r{font-size:12.5px;color:var(--sub);margin-left:auto}
.gl-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}@media (max-width:760px){.gl-g{grid-template-columns:1fr}}
.gl-b{display:grid;grid-template-columns:104px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.gl-b .bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.gl-b .bar i{display:block;height:100%;border-radius:5px;background:var(--gold)}
.gl-b.hi .bar i{background:var(--ok)}.gl-b.lo .bar i{background:var(--warn)}.gl-b b{text-align:right;font-family:var(--serif)}
.gl-l{margin-bottom:10px;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.55}.gl-l b{display:block;margin-bottom:2px;font-size:12px;letter-spacing:.04em}.gl-l p{margin:3px 0}.gl-l p.n{color:var(--sub)}
.gl-l.ok{background:rgba(47,107,79,.07)}.gl-l.ok b{color:var(--ok)}.gl-l.no{background:rgba(161,58,50,.07)}.gl-l.no b{color:var(--warn)}

.an-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.an-c{background:var(--soft);border-radius:10px;padding:12px 14px;border-left:3px solid var(--gold)}
.an-c span{font-size:12px;color:var(--sub)}.an-c b{display:block;font:700 28px/1.2 var(--serif)}.an-c b small{font-size:13px;color:var(--sub)}
.an-c .bar{height:6px;background:#fff;border-radius:3px;overflow:hidden;margin:4px 0}.an-c .bar i{display:block;height:100%;background:var(--gold)}
.an-c em{font-style:normal;font-size:12px;color:var(--ink2)}
.cq input,.cq select{width:76px;padding:5px 7px}
.sys-top{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}@media (max-width:700px){.sys-top{grid-template-columns:repeat(2,1fr)}}
.sys-top>div{background:var(--soft);border-radius:10px;padding:11px 13px}.sys-top>div>span{display:block;font-size:11.5px;color:var(--sub)}.sys-top b{display:block;font:700 24px/1.3 var(--serif)}.sys-top b small{font-size:12px;color:var(--sub)}.sys-top em{font-style:normal;font-size:11.5px;color:var(--sub)}
.sys-top b.bad{color:var(--warn);font-size:18px}.sys-top b.mid{color:var(--gold);font-size:18px}.sys-top b.good{color:var(--ok);font-size:18px}
tr.miss td{color:var(--faint)}
.kol{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.ko{border-radius:8px;padding:9px 12px;border:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.ko span{font-size:11.5px;font-weight:800;grid-row:1/3}.ko em{font-style:normal;color:var(--sub);font-size:12px}
.ko.ok span{color:var(--ok)}.ko.fail{background:rgba(161,58,50,.06);border-color:rgba(161,58,50,.3)}.ko.fail span{color:var(--warn)}.ko.unk span{color:var(--gold)}
.gl-v.bad{color:var(--warn)}
.ks{display:grid;gap:8px;font-size:14px}.ks label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ks input[type=number]{width:70px;padding:5px 8px}
/* 표지 */
.cover{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:20px;border-bottom:3px double var(--ink)}
@media (max-width:640px){.cover{grid-template-columns:1fr}}
.cover h1{margin:8px 0 6px;font:700 26px/1.3 var(--serif);letter-spacing:-.03em}
.cover .meta{font-size:13px;color:var(--sub)}
.scorebox{border:1px solid var(--ink);min-width:200px;text-align:center}
.scorebox .lab{font-size:11px;letter-spacing:.14em;color:var(--sub);padding:8px 0 0}
.scorebox .num{font:700 54px/1.05 var(--serif);color:var(--ink);padding:2px 0}
.scorebox .num small{font-size:16px;color:var(--faint);margin-left:2px}
.scorebox .dec{border-top:1px solid var(--ink);padding:9px 12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:center}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mix{font-size:12.5px;color:var(--sub);margin-top:6px}
/* 결론 요약 */
.exec{margin:18px 0 0;padding:0;list-style:none;counter-reset:ex}
.exec li{counter-increment:ex;position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.65}
.exec li::before{content:counter(ex,decimal-leading-zero);position:absolute;left:0;top:11px;font:700 13px/1.4 var(--serif);color:var(--gold)}
.exec li.w{color:var(--warn);font-weight:600}
/* 사실 표 */
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin:4px 0 18px}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,1fr)}}
.facts div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 13px}
.facts span{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.02em}
.facts b{display:block;font-size:15px;margin-top:3px;font-weight:700}
.typeline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.type{font:700 20px/1.3 var(--serif);color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line2);padding:1px 9px;font-size:12.5px;color:var(--ink2);border-radius:3px}
.op p{margin:10px 0;line-height:1.85;font-size:14.5px;color:var(--ink2)}
.op p b{color:var(--ink)}
/* 영역 평가 */
.evgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:20px;align-items:center}
@media (max-width:760px){.evgrid{grid-template-columns:1fr}}
.ev{display:grid;grid-template-columns:110px 1fr 44px 46px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .nm{font-weight:700}.ev .w{font-size:11.5px;color:var(--faint)}
.ev .sc{font:700 18px/1 var(--serif);text-align:right}
.ev .lv{font-size:12px;font-weight:700;text-align:right}
.lv.hi{color:var(--ok)}.lv.lo{color:var(--warn)}.lv.md{color:var(--sub)}
.hbar{height:8px;background:var(--soft);position:relative}.hbar i{position:absolute;left:0;top:0;bottom:0;background:var(--navy)}
.hbar u{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px dashed var(--gold)}
.radar{display:block;margin:0 auto;max-width:360px;width:100%}
/* 세부 지표 표 */
.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{font-size:11.5px;color:var(--sub);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--ink);letter-spacing:.02em}
.dt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tr.grp td{padding-top:16px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line2);font-size:13px}
.dt td.v{text-align:right;font-weight:700;white-space:nowrap}
.dt td.rk{text-align:right;white-space:nowrap;font-weight:600}
.rk.hi{color:var(--ok)}.rk.lo{color:var(--warn)}
.dt td.sb{width:38%}
@media (max-width:640px){.dt td.sb{display:none}.dt th.sbh{display:none}}
.strip{position:relative;height:14px}
.strip::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--line2)}
.strip i{position:absolute;top:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#b7bdc7}
.strip b{position:absolute;top:1px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--navy);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--navy)}
.strip u{position:absolute;top:1px;bottom:1px;border-left:1px dashed var(--gold)}
/* 공용 표 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.best{background:var(--navyT);font-weight:700;color:var(--navy)}

/* ---- 2026-10-07 트렌디 테마 + 한눈에 대시보드 (보고서 구성은 그대로, 글꼴·색·카드만 현대적으로) ---- */
:root{--serif:var(--sans);--bg:#eef1f7;--navy:#1f3a6e;--navy2:#3461d6;--navyT:rgba(52,97,214,.08);--gold:#d4952a;--ok:#16a06b;--warn:#e0533d;--soft:#f3f5fa;--line:#e4e8f0;--line2:#d3d9e4;--track:#e7ebf3;
  --gA:#16a06b;--gB:#3461d6;--gC:#d4952a;--gD:#e0533d;--ink:#111827;--ink2:#374151;--sub:#6b7280;--r:18px}
body{background:radial-gradient(1200px 500px at 10% -10%,rgba(52,97,214,.10),transparent 60%),radial-gradient(900px 400px at 100% 0,rgba(212,149,42,.08),transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(100deg,#13284f,#1f3a6e 60%,#2b4f93);border-bottom:0;box-shadow:0 6px 24px rgba(19,40,79,.25)}
header h1{color:#fff;font-weight:800;font-size:18px}
header h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#ffd36b,#d4952a);margin-right:8px;vertical-align:1px}
header .tag{color:rgba(255,255,255,.7);border-left-color:rgba(255,255,255,.2)}header .tag b{color:#ffd36b}
header select{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}header select option{color:#111}
header #sdk,header .note{color:rgba(255,255,255,.7)}
nav{align-self:center;gap:4px}nav button{color:rgba(255,255,255,.72);border:0;border-radius:999px;padding:8px 16px;white-space:nowrap}
.secnav{border-bottom:0;gap:6px;background:var(--bg)}.secnav a{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:5px 12px;margin:2px 0}.secnav a:last-child{border-right:1px solid var(--line)}.secnav a:hover{border-color:var(--navy2)}
nav button:hover{color:#fff;background:rgba(255,255,255,.08)}nav button[aria-current]{color:#13284f;background:#fff;border:0}
.card{border:0;border-radius:var(--r);box-shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px rgba(31,58,110,.07)}
.card h2,.cover h1,.type,.gl-t{font-weight:800;letter-spacing:-.03em}
.sh{border-bottom:1px solid var(--line)}
.sh .no{background:linear-gradient(135deg,#3461d6,#1f3a6e);color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;letter-spacing:0}
.btn{border-radius:10px}.btn.pri{background:linear-gradient(135deg,#3461d6,#1f3a6e);border:0;box-shadow:0 4px 14px rgba(52,97,214,.3)}
.cover{border-bottom:1px solid var(--line)}
.eyebrow{color:var(--navy2)}
.gr{border-radius:8px;font-weight:800}
.tile,.an-c,.sys-top>div,.viz,.swot{border-radius:14px}
.donut .num,.tile b,.kpi b,.ring b,.facts b{font-weight:800}
/* 대시보드 */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:18px}
.db{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.db-score{grid-column:span 5;display:flex;gap:16px;align-items:center;background:linear-gradient(140deg,rgba(52,97,214,.07),rgba(212,149,42,.05))}
.db-sales{grid-column:span 7}.db-dims{grid-column:span 7}.db-comp{grid-column:span 5}.db-kpi{grid-column:span 12;padding:0;border:0;background:transparent}
.db-pro{grid-column:span 6;border-top:4px solid var(--ok)}.db-con{grid-column:span 6;border-top:4px solid var(--warn)}
@media (max-width:980px){.db-score,.db-sales,.db-dims,.db-comp,.db-pro,.db-con{grid-column:span 12}}
.sring{width:132px;height:132px;flex:0 0 auto}.sr-n{font:800 38px/1 var(--sans);fill:var(--ink)}.sr-u{font:600 12px var(--sans);fill:var(--sub)}
.sc-r{min-width:0;flex:1}.pill{display:inline-block;color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
.sc-d{font-weight:800;font-size:17px;margin:6px 0 2px;line-height:1.35}.sc-d.bad{color:var(--warn)}.sc-t{font-size:13px;color:var(--sub);font-weight:600}
.sc-p{margin-top:10px;font-size:12px;color:var(--sub)}.sc-p div{height:6px;background:var(--track);border-radius:3px;margin-top:4px;overflow:hidden}.sc-p i{display:block;height:100%;background:var(--navy2);border-radius:3px}
.kos{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--sub)}.kos i{width:10px;height:10px;border-radius:50%;background:var(--line2)}.kos i.ok{background:var(--ok)}.kos i.fail{background:var(--warn)}.kos i.unk{background:var(--gold)}.kos span{margin-left:4px}.kos b.bad{color:var(--warn)}
.db-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.db-h b{font-size:14.5px;font-weight:800}.db-sub{margin-left:auto;font-size:11.5px;color:var(--sub)}
.db-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--navyT);color:var(--navy2);font-weight:900;flex:0 0 auto}.db-ic svg{width:17px;height:17px}.db-ic.ok{background:rgba(22,160,107,.12);color:var(--ok)}.db-ic.no{background:rgba(224,83,61,.12);color:var(--warn)}
.db-empty{display:flex;gap:12px;align-items:flex-start;color:var(--sub);font-size:13.5px}.db-empty svg{width:28px;height:28px;color:var(--navy2);flex:0 0 auto}.db-empty b{color:var(--ink)}.db-empty p{margin:4px 0 0}
.sb-big{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px}.sb-big>div{min-width:0}.sb-big span{display:block;font-size:11.5px;color:var(--sub);font-weight:600}
.sb-big strong{display:block;font:800 30px/1.15 var(--sans);color:var(--navy2);letter-spacing:-.03em}.sb-big strong.mut{color:var(--ink2)}.sb-big strong small{font-size:14px;margin-left:2px;color:var(--sub)}
.sb-big em{font-style:normal;font-size:12px;color:var(--sub)}.sb-x.hi strong{color:var(--ok)}.sb-x.md strong{color:var(--gold)}.sb-x.lo strong{color:var(--warn)}
.bul{position:relative;height:30px;background:repeating-linear-gradient(90deg,var(--track) 0 1px,transparent 1px 25%),var(--soft);border-radius:8px;margin:22px 0 4px}
.bul i{position:absolute;top:0;bottom:0}.bul-band{background:rgba(52,97,214,.22);border-radius:8px}
.bul-pt{width:4px;margin-left:-2px;background:var(--navy2);border-radius:2px;top:-4px!important;bottom:-4px!important;box-shadow:0 0 0 2px var(--paper)}
.bul-be,.bul-tg{width:0;border-left:2px dashed var(--warn)}.bul-tg{border-left-color:var(--ok)}
.bul i u{position:absolute;top:-19px;left:-30px;width:60px;text-align:center;text-decoration:none;font-size:11px;font-weight:700;color:var(--warn);white-space:nowrap}.bul-tg u{color:var(--ok)!important;top:auto!important;bottom:-19px}
.bul-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:6px}
.dmb-r{display:grid;grid-template-columns:110px 1fr 30px 26px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.dmb-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dmb-t{position:relative;height:12px;background:var(--track);border-radius:6px}
.dmb-t i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--navy2)}.dmb-t u{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:2px solid var(--paper)}
.dmb-r.hi i{background:var(--ok)}.dmb-r.lo i{background:var(--warn)}.dmb-r.md i{background:var(--gold)}
.dmb-r b{text-align:right;font-weight:800}.dmb-r em{font-style:normal;font-size:11px;color:var(--faint);text-align:right}
.cr-g{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.cr-m .cmap{max-width:300px}.cr-m .legend{font-size:11.5px;gap:10px}
.cr-n{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.cr-n div{text-align:center}.cr-n div{background:var(--soft);border-radius:12px;padding:8px 10px}.cr-n span{display:block;font-size:11px;color:var(--sub)}.cr-n b{font:800 20px/1.2 var(--sans)}.cr-n small{font-size:11px;color:var(--sub);margin-left:1px}
.kcg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media (max-width:980px){.kcg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 15px;position:relative;overflow:hidden}
.kc::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--navyT)}
.kc-top{display:flex;align-items:center;gap:8px}.kc-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--navyT);color:var(--navy2)}.kc-ic svg{width:18px;height:18px}
.kc-l{font-size:12.5px;color:var(--sub);font-weight:600;line-height:1.25}
.kc-v{font:800 26px/1.2 var(--sans);margin:8px 0 6px;letter-spacing:-.03em}.kc-v small{font-size:13px;color:var(--sub);margin-left:2px;font-weight:600}
.kc-m{height:6px;background:var(--track);border-radius:3px;overflow:hidden}.kc-m i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.kc.hi .kc-m i{background:var(--ok)}.kc.lo .kc-m i{background:var(--warn)}.kc.hi .kc-ic{background:rgba(22,160,107,.12);color:var(--ok)}.kc.lo .kc-ic{background:rgba(224,83,61,.12);color:var(--warn)}
.kc-s{font-size:11.5px;color:var(--sub);margin-top:6px}.kc-s b{color:var(--ink2)}
@media screen{.cover .scorebox{display:none}.cover{grid-template-columns:1fr}}
@media print{.dash{display:block}.db{break-inside:avoid;margin-bottom:8px}}
.db-pro ul,.db-con ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:var(--ink2)}.db-pro li,.db-con li{margin:4px 0}
@media (max-width:700px){.dash{gap:10px}.db{padding:13px 13px;border-radius:14px}.db-score{flex-direction:row}.sring{width:104px;height:104px}.sb-big strong{font-size:24px}.dmb-r{grid-template-columns:86px 1fr 26px 22px;gap:7px}.kc-v{font-size:21px}.cr-n{gap:6px}}
@media (max-width:700px){nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}nav button{white-space:nowrap;padding:7px 11px!important;font-size:13.5px}header h1::before{display:none}}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--paper:#161b23;--ink:#e6e9ee;--ink2:#c7ccd5;--sub:#8d95a3;--faint:#6c7480;--line:#262d38;--line2:#323a47;--navy:#7fa6d8;--navy2:#9bbbe4;--navyT:rgba(127,166,216,.12);--soft:#1c222c;--gold:#e0a94a;--warn:#f07a68;--ok:#3cc68e;--track:#252c38;--bg:#0b0f16;--navy2:#7aa2ff;--gA:#3cc68e;--gB:#7aa2ff;--gC:#e0a94a;--gD:#f07a68}body{background:var(--bg)}.btn.pri{color:#0e1116}.stars button.on{color:#0e1116}}
@media print{header,.noprint,.mapbox,nav,.secnav{display:none!important}.wrap{display:block}main{max-width:none;padding:0}body{background:#fff}.card{border:0;border-bottom:1px solid #ccc;padding:14px 0;break-inside:avoid}.ponly{display:block}}

/* ---- 폰 전용: 구역 접기·가로 스크롤 메뉴·표를 카드로·지도 접기 ---- */

  .mobonly{display:inline-block}

  .secnav a,.secnav button{flex:0 0 auto;border:1px solid var(--line2);border-radius:999px;background:var(--paper);padding:6px 13px;font-size:13px;white-space:nowrap}

/* 후보지 목록 카드 */
.ls-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.ls{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}.ls>div>span{display:block;font-size:11.5px;color:var(--sub);font-weight:600}.ls b{font:800 20px/1.2 var(--sans)}.ls b small{font-size:12px;color:var(--sub);margin-left:1px}
.lc-g{display:grid;gap:10px}

.lc:hover{border-color:var(--navy2);box-shadow:0 6px 18px rgba(31,58,110,.10);transform:translateY(-1px)}

.lc-a{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lc-d{font-size:13px;font-weight:700;color:var(--navy2);margin-top:3px}.lc-d.bad{color:var(--warn)}

function derive(m,opt){
  opt=opt||{}; const ex=opt.ex||{}, c=m.comp?m.comp.filter(x=>!ex[x.id]&&x.id!==opt.self&&!(opt.self&&x.dist<25)):null, d=Object.assign({},m,{comp:c});
  if(d.eel3k!=null&&m.comp&&c) d.eel3k=Math.max(c.length,d.eel3k-(m.comp.length-c.length));
  if(c){ d.n300=c.filter(x=>x.dist<=300).length; d.n500=c.filter(x=>x.dist<=500).length; d.n1k=c.length;
    d.compIdx=d.n300+0.7*(d.n500-d.n300)+0.35*(d.n1k-d.n500); }
  else{ d.n300=d.n500=d.n1k=d.compIdx=null; }
  d.subD=m.subway?(m.subway[0]?m.subway[0].dist:2500):null;
  if(m.popTot&&m.pCore!=null){ d.corePop=Math.round(m.popTot*m.pCore/100); if(m.restOn!=null) d.restPer1k=Math.round(m.restOn/m.popTot*10000)/10; if(d.n1k!=null) d.corePerEel=Math.round(d.corePop/Math.max(1,d.n1k)); }
  if(m.restOpen12!=null&&m.restClose12!=null) d.restNet=m.restOpen12-m.restClose12;
  if(m.aptPy!=null&&m.aptGu) d.aptRel=Math.round(m.aptPy/m.aptGu*100);
  d.pull=['gov1k','hosp1k','ghosp2k','wed2k','fun2k','golf1k','univ2k'].some(k=>m[k]!=null)?['gov1k','hosp1k','ghosp2k','wed2k','fun2k','golf1k','univ2k'].reduce((a,k)=>a+(+m[k]||0),0):null;
  return d;
}
// 기준 값들 속 위치 (0~100, 클수록 좋음). 같은 값이 많으면 가운데로 계산
function pct(v,arr,low){ if(!arr.length) return null; let less=0,eq=0; arr.forEach(a=>{ if(a<v) less++; else if(a===v) eq++; }); const p=(less+eq/2)/arr.length*100; return Math.round(low?100-p:p); }


function benchCache(){ return {list:[],arr:{}}; }   // 비교 기준은 쓰지 않음(장어집 기준표 AB 로 바로 점수)
function evalD(d,withBench=true){
  const B=withBench?benchCache():null, W=DB.weights;
  const dims=DIMS.map(dm=>{
    const subs=dm.subs.map(s=>{ const v=s.get(d);
      if(s.abs) return Object.assign({},s,{v:v==null?null:v,p:v==null?null:s.abs(v),arr:[],rank:null,of:0});
      const arr=B?B.arr[s.k]:[]; const p=(v!=null&&arr.length)?pct(v,arr,s.low):null;
      let rank=null; if(p!=null) rank=arr.filter(a=>s.low?a<v:a>v).length+1;
      return Object.assign({},s,{v,p,arr,rank,of:arr.length}); });
    const ps=subs.filter(s=>s.p!=null), sw=ps.reduce((a,s)=>a+(s.w??1),0);
    return {k:dm.k,t:dm.t,w:Math.round((+W[dm.k]||0)*takeMul(dm.k)*10)/10,why:dm.why,prop:!!dm.prop,subs,score:ps.length?Math.round(ps.reduce((a,s)=>a+s.p*(s.w??1),0)/sw):null};
  });
  const avg=L=>{ const ok=L.filter(x=>x.score!=null), ws=ok.reduce((a,x)=>a+x.w,0); return ok.length&&ws?Math.round(ok.reduce((a,x)=>a+x.w*x.score,0)/ws):null; };
  const mkt=avg(dims.filter(x=>!x.prop)), total=mkt==null?null:avg(dims);
  return {dims,total,mkt,propScore:(dims.find(x=>x.prop)||{}).score??null};
}

function scoreOf(m,c){

const ANALOG=[['food500','음식점 500m'],['meat500','고깃집 500m'],['pub500','술집 500m'],['apt1k','아파트 1km'],['popTot','주민 인구'],['pCore','30~50대 비율'],['aptPy','아파트 평당가'],['subD','지하철 거리'],['park500','주차장 500m'],['n500','장어집 500m'],['compIdx','경쟁 지수'],['restOn','영업 음식점'],['pull','집객시설'],['bus300','버스정류장 300m']];
const ANALOG_FMT={pCore:v=>v+'%',aptPy:v=>fmtN(v)+'만',subD:v=>fmtM(v),compIdx:v=>(+v).toFixed(1)};
let storeBusy=false;
async function measureStores(){
  if(!K) return toast('카카오 지도가 아직 안 열렸어요'); if(storeBusy) return;
  const L=DB.stores.filter(x=>x.x); if(!L.length) return toast('먼저 우리 매장 주소를 넣어 주세요');
  storeBusy=true; render();
  try{ for(let i=0;i<L.length;i++){ toast(`우리 매장 ${i+1}/${L.length} · ${L[i].name} 분석 중…`); try{ L[i].m=await measure({x:L[i].x,y:L[i].y},()=>{}); L[i].at=today(); }catch(e){ L[i].err='측정 실패'; } }
    save(); toast('우리 매장 분석을 마쳤어요'); }
  finally{ storeBusy=false; render(); }
}
function analogSim(dc,ds){
  const B=benchCache(), parts=[];
  ANALOG.forEach(([k])=>{ const a=dc[k], b=ds[k]; if(a==null||b==null) return;
    const arr=B.list.map(x=>x[k]).filter(v=>v!=null);
    if(arr.length>=5){ parts.push(100-Math.abs(pct(a,arr,false)-pct(b,arr,false))); }
    else { const m=Math.max(Math.abs(a),Math.abs(b),1); parts.push(100-Math.min(100,Math.abs(a-b)/m*100)); } });
  return parts.length>=4?Math.round(parts.reduce((x,y)=>x+y,0)/parts.length):null;
}
const MIN_SALES=5, MIN_ANALOG=3;
function analogData(s){
  return DB.stores.filter(x=>x.m&&x.m.v===2).map(st=>{ const d=derive(st.m,{self:'__self'}); return {st,d,sim:analogSim(s.d,d),sales:+st.sales||0}; }).filter(x=>x.sim!=null).sort((a,b)=>b.sim-a.sim);
}

/* ---------------- 우리 매장 기준 환산 매출 (매장 1~4곳일 때도 보는 내부 참고값) ---------------- */
// 우리 매장 실제 월매출 × (후보지 ÷ 그 매장) 차이 보정. 보정 크기(지수)는 내 판단으로 정한 값 — 매장 매출이 쌓이면 조정.
const CONV=[
  {k:'dem',t:'3km 수요 (30~59세 + 직장인 절반)',e:0.5,lo:0.6,hi:1.6,get:d=>d.core3k!=null?d.core3k+(d.work3k!=null?0.5*d.work3k:0):d.pop3k!=null?d.pop3k*0.45:d.corePop!=null?d.corePop:null,same:d=>d.core3k!=null?(d.work3k!=null?'cw':'c'):d.pop3k!=null?'p':'d',fmt:v=>fmtN(Math.round(v))+'명'},
  {k:'eel',t:'3km 안 장어집 (적을수록 유리)',e:0.3,lo:0.7,hi:1.4,inv:true,get:d=>d.eel3k!=null?d.eel3k:d.n1k,same:d=>d.eel3k!=null?'3':'1',fmt:v=>v+'곳'},
  {k:'near',t:'가까운 경쟁 지수 (적을수록 유리)',e:0.15,lo:0.8,hi:1.2,inv:true,get:d=>d.compIdx,fmt:v=>(+v).toFixed(1)},
  {k:'park',t:'주차장 500m',e:0.15,lo:0.8,hi:1.25,get:d=>d.park500,fmt:v=>v+'곳'}];
function convEst(c){
  if(!c||!c.m||c.m.v!==2) return null; const dc=derive(c.m,{ex:c.compEx||{}});
  const L=DB.stores.filter(st=>st.m&&st.m.v===2&&+st.sales>0).map(st=>{
    const ds=derive(st.m,{self:'__self'}); let mul=1; const parts=[];
    CONV.forEach(f=>{ let a=f.get(dc), b=f.get(ds); if(a==null||b==null) return; if(f.same&&f.same(dc)!==f.same(ds)) return;
      if(f.k!=='dem'){ a+=1; b+=1; } if(b<=0||a<=0) return;
      const x=Math.min(f.hi,Math.max(f.lo,Math.pow(f.inv?b/a:a/b,f.e))); mul*=x; parts.push({f,a:f.get(dc),b:f.get(ds),x}); });
    mul=Math.min(2,Math.max(0.4,mul)); const sim=analogSim(dc,ds);
    return {st,sales:+st.sales,mul,est:+st.sales*mul,parts,sim}; }).filter(x=>x.parts.length>=2);
  if(!L.length) return null;
  const w=L.map(x=>x.sim!=null?Math.pow(Math.max(20,x.sim)/100,2):0.3), ws=w.reduce((a,b)=>a+b,0);
  let v=L.reduce((a,x,i)=>a+x.est*w[i],0)/ws; const band=Math.max(15,Math.round(35/Math.sqrt(L.length)));
  let lo=v*(1-band/100), hi=v*(1+band/100), cap=null; const tb=tablesOf(c), F=DB.fin;
  if(tb){ cap=tb.n*(+F.party||3)*3*(+F.ticket||4)*(+F.days||26)/Math.max(0.3,1-TAKE()/100); hi=Math.min(hi,cap); lo=Math.min(lo,cap); v=Math.min(v,cap); }
  const r=x=>Math.round(x/100)*100;
  return {list:L,v:r(v),lo:r(lo),hi:r(hi),band,cap:cap&&r(cap),capped:cap!=null&&r(v)>=r(cap),tb};
}
function convHtml(c,inFin){
  const E=convEst(c);
  if(!E){ if(inFin) return ''; const has=DB.stores.some(x=>+x.sales>0), meas=DB.stores.some(x=>x.m&&x.m.v===2);
    return `<div class="infobox" style="margin:10px 0">${!has?'설정 → 우리 매장에 <b>월매출</b>을 넣으면':'설정 → 우리 매장 → <b>"우리 매장 분석하기"</b>를 누르면'} 그 매장 매출을 이 후보지 조건으로 바꿔 본 <b>환산 매출</b>을 보여 줘요.${has&&!meas?'':''}</div>`; }

  const rows=E.list.map(x=>`<div class="tw" style="margin-top:8px"><table class="dt"><thead><tr><th>${esc(x.st.name)} → 후보지</th><th style="text-align:right">후보지</th><th style="text-align:right">${esc(x.st.name)}</th><th style="text-align:right">보정</th></tr></thead><tbody>
    ${x.parts.map(p=>`<tr><td>${p.f.t}</td><td class="num">${p.f.fmt(p.a)}</td><td class="num">${p.f.fmt(p.b)}</td><td class="num"><b style="color:${p.x>=1?'var(--good,#1a7f37)':'var(--bad)'}">×${p.x.toFixed(2)}</b></td></tr>`).join('')}
    <tr><td><b>합계</b> · 월매출 ${fmtN(x.sales)}만원 × ${x.mul.toFixed(2)}</td><td class="num" colspan="3"><b>${fmtN(Math.round(x.est))}만원</b>${x.sim!=null?` <span class="note">(닮은 정도 ${x.sim}%)</span>`:''}</td></tr></tbody></table></div>`).join('');

    <div class="note" style="margin-top:6px">범위 ±${E.band}% = 매장 ${E.list.length}곳 기준 오차 (매장 매출이 늘수록 좁아져요)${E.cap?` · 테이블 ${E.tb.n}개${E.tb.est?'(평수로 추정)':''}로 하루 3회전 했을 때 최대 약 ${fmtN(E.cap)}만원${E.capped?' — <b>환산값이 자리 크기를 넘어 최대값으로 잘랐어요</b>':''}`:''}</div>

}

function compThreat(p,q){
  const w=p.dist<=300?1:p.dist<=500?0.7:0.35; q=q||{};
  const rf=q.r>0?Math.min(1.6,Math.max(0.4,1+(q.r-4.0)*0.6)):1, nf=q.n>=0&&q.n!==''&&q.n!=null?Math.min(1.8,Math.max(0.6,0.6+Math.log10(+q.n+1)*0.35)):1, zf=[1,0.8,1,1.3][+q.z||0];

  return {w,rf,nf,zf,pf,t:w*rf*nf*zf*pf,has:!!(q.r||q.n||q.z||q.p)};
}

  const s=c.m?scoreOf(c.m,c):null, F=s?finalOf(c,s):null, now=F?F.tot:null, diff=now!=null&&sn&&r.score!=null&&now!==r.score;
  const why=[]; if(false) why.push(`비교 기준이 바뀜 (${esc(sn.bench.at)} ${sn.bench.mode==='eel'?'장어집 자리':'대표 상권'} ${sn.bench.n}곳 → ${esc(DB.bench.at)} ${BL()} ${benchCache().list.length}곳)`);
  if(JSON.stringify(sn.weights)!==JSON.stringify(DB.weights)) why.push('영역 비중이 바뀜'); if(JSON.stringify(sn.sys)!==JSON.stringify(SYS())) why.push('출점 기준(배점·필수 조건)이 바뀜');
  if(sn.fin&&(sn.fin.cost!=DB.fin.cost||sn.fin.labor!=DB.fin.labor||sn.fin.var!=DB.fin.var)) why.push('손익 가정이 바뀜');
  return `<div class="infobox" style="margin-top:8px"><b>심사 당시 (${esc(sn.at)}): ${esc(r.score)}점 ${esc(sn.grade)} · ${esc(sn.decision)}</b> · 평가 완료 ${sn.done}%
    <div class="note" style="margin-top:4px">${(sn.parts||[]).filter(x=>x.score!=null).map(x=>`${esc(x.t)} ${x.score}`).join(' · ')}${sn.bench?` · 기준 ${esc(sn.city||'')} ${sn.bench.mode==='eel'?'장어집 자리':'대표 상권'} ${sn.bench.n}곳(${esc(sn.bench.at)})`:''}</div>
    ${diff?`<div class="note" style="margin-top:6px;color:var(--warn);font-weight:600">지금 다시 계산하면 ${now}점이에요${why.length?' — '+why.join(' · '):' — 입력값(매물·현장 실사 등)이 바뀜'}. 결정은 심사 당시 기준으로 기록돼 있어요.</div>`:''}</div>`;
}

function miniRing(v,grade){
  const R=22, C=2*Math.PI*R, off=C*(1-Math.max(0,Math.min(100,v))/100);
  return `<svg class="mring" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${R}" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="28" cy="28" r="${R}" fill="none" stroke="var(--g${grade})" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 28 28)"/><text x="28" y="33" text-anchor="middle">${v}</text></svg>`;
}

function execList(c,s,F,fin){
  const t=typeOf(s), d=s.d, ds=s.dims.filter(x=>x.score!=null).sort((a,b)=>b.score-a.score), L=[];
  L.push(`<b>${esc(t.name)}</b> — ${esc(t.desc.split('. ')[0].replace(/\.$/,''))}.`);
  if(ds.length) L.push(`강점은 <b>${esc(ds[0].t)}</b>(${ds[0].score}점)${ds[1]&&ds[1].score>=60?`·<b>${esc(ds[1].t)}</b>(${ds[1].score}점)`:''}, 약점은 <b>${esc(ds.at(-1).t)}</b>(${ds.at(-1).score}점)이에요.`);
  if(d.n1k!=null) L.push(d.n1k===0?'반경 1km 안에 장어집이 없는 경쟁 공백 지역이에요.':`장어집은 300m 안 ${d.n300}곳 · 500m 안 ${d.n500}곳 · 1km 안 ${d.n1k}곳${c.m.compMore?' 이상':''}이에요.`);
  if(fin) L.push(`월세 ${fmtN(c.rent)}만원 기준 손익분기 월매출 약 ${fmtN(Math.round(fin.need))}만원(하루 손님 약 ${Math.ceil(fin.guests)}명)${fin.turns!=null?`, 테이블당 하루 ${fin.turns.toFixed(1)}회전`:''}이 필요해요.${s.propScore!=null?` 매물 조건 점수는 <b>${s.propScore}점</b>이에요.`:''}`);
  else L.push('월세·평수를 넣으면 매물 조건까지 반영해 판단해요 (모르면 비워 두어도 돼요).');
  const out=L.map(x=>`<li>${x}</li>`);
  nearStores(c).filter(n=>n.d<(+DB.zoneKm||2)*1000).forEach(n=>out.push(`<li class="w">우리 매장 ${esc(n.name)}과 ${fmtM(n.d)} — 영업지역(${DB.zoneKm}km)이 겹쳐요.</li>`));
  return out.join('');
}

}

    ${s.dims.map(dm=>`<tr class="grp"><td colspan="4">${esc(dm.t)}${dm.prop?' <span class="note" style="font-weight:400">· 입력한 것만</span>':''}</td></tr>`+dm.subs.map(x=>`<tr class="${dm.prop?'pr':'sr'}"><td>${esc(x.t)}${x.r?` <span class="note">${x.r}</span>`:''}</td><td class="v">${esc(fv(x))}</td><td class="sb"><span class="note">${esc(x.hint||'')}</span></td><td class="rk ${x.p!=null?(x.p>=70?'hi':x.p<=30?'lo':''):''}">${x.p==null?'<span class="note">입력 없음</span>':`${x.p}점`}</td></tr>`).join('')).join('')}

function cmpHtml(){
  const L=DB.cands.filter(c=>SEL.has(c.id)).slice(0,4);
  if(L.length<2) return `<div class="card empty">후보지 목록에서 2곳 이상 체크하고 "비교"를 누르세요 (최대 4곳)</div>`;
  const S=L.map(c=>c.m?scoreOf(c.m,c):null), okAll=S.every(s=>s&&s.has&&s.total!=null);
  const maxIdx=vs=>{ let b=-1,bv=-Infinity; vs.forEach((v,i)=>{ if(v.v!=null&&v.v>bv){ bv=v.v; b=i; } }); return b; };
  const minIdx=vs=>{ let b=-1,bv=Infinity; vs.forEach((v,i)=>{ if(v.v!=null&&v.v<bv){ bv=v.v; b=i; } }); return b; };
  const row=(label,vals,best)=>{ const b=best?best(vals):-1; return `<tr><th>${label}</th>${vals.map((v,i)=>`<td class="num${i===b?' best':''}">${v.t}</td>`).join('')}</tr>`; };
  return `<div class="card"><div class="sh"><h2>후보지 비교</h2><span class="aside">${L.length}곳 · 초록 칸 = 가장 좋은 값</span></div>
    ${okAll?radar(S.map(s=>s.dims.filter(x=>!x.prop).map(x=>x.score)))+`<div class="legend" style="justify-content:center;margin:4px 0 14px">${L.map((c,i)=>`<span><i style="background:${PAL[i]}"></i>${esc(c.name)}</span>`).join('')}</div>`:'<div class="infobox">모든 후보지가 분석되고 대구 기준 상권이 있어야 점수 비교가 나와요</div>'}
    <div class="tw"><table class="cmpt"><thead><tr><th></th>${L.map(c=>`<th class="num">${esc(c.name)}</th>`).join('')}</tr></thead><tbody>
    ${row('종합 점수',L.map((c,i)=>{ const F=finalOf(c,S[i]); return F.tot!=null?{v:F.tot,t:`<span class="gr g${F.grade}">${F.grade}</span> ${F.tot}`}:{v:null,t:'-'}; }),maxIdx)}
    ${row('데이터 점수',S.map(s=>s&&s.total!=null?{v:s.total,t:s.total+'점'}:{v:null,t:'-'}),maxIdx)}
    ${row('상권 유형',S.map(s=>s&&s.has&&s.total!=null?{v:null,t:esc(typeOf(s).name)}:{v:null,t:'-'}))}
    ${DIMS.map((dm,i)=>row(esc(dm.t),S.map(s=>s&&s.dims[i].score!=null?{v:s.dims[i].score,t:s.dims[i].score+'점'}:{v:null,t:'-'}),maxIdx)).join('')}
    ${row('장어집 300m / 500m / 1km',S.map(s=>s&&s.d.n1k!=null?{v:s.d.compIdx,t:`${s.d.n300} / ${s.d.n500} / ${s.d.n1k}`}:{v:null,t:'-'}),minIdx)}
    ${row('음식점 500m',S.map(s=>s?{v:s.d.food500,t:fmtN(s.d.food500)}:{v:null,t:'-'}),maxIdx)}
    ${row('아파트 1km',S.map(s=>s?{v:s.d.apt1k,t:fmtN(s.d.apt1k)}:{v:null,t:'-'}),maxIdx)}
    ${row('주차장 500m',S.map(s=>s?{v:s.d.park500,t:fmtN(s.d.park500)}:{v:null,t:'-'}),maxIdx)}
    ${row('가까운 지하철',S.map(s=>s&&s.d.subD!=null?{v:s.d.subD,t:fmtM(s.d.subD)}:{v:null,t:'-'}),minIdx)}
    ${row('가까운 우리 매장',L.map(c=>{ const n=nearStores(c)[0]; return n?{v:n.d,t:esc(n.name)+' '+fmtM(n.d)}:{v:null,t:'-'}; }),maxIdx)}
    ${row('월세',L.map(c=>c.rent?{v:+c.rent,t:fmtN(c.rent)+'만'}:{v:null,t:'-'}),minIdx)}
    ${row('보증금',L.map(c=>c.deposit?{v:+c.deposit,t:fmtN(c.deposit)+'만'}:{v:null,t:'-'}),minIdx)}
    ${row('권리금',L.map(c=>c.premium?{v:+c.premium,t:fmtN(c.premium)+'만'}:{v:null,t:'-'}),minIdx)}
    ${row('면적',L.map(c=>c.area?{v:+c.area,t:fmtN(c.area)+'평'}:{v:null,t:'-'}),maxIdx)}
    ${row('손익분기 월매출',L.map(c=>{ const f=finCalc(c); return f?{v:f.need,t:fmtN(Math.round(f.need))+'만'}:{v:null,t:'-'}; }),minIdx)}
    ${row('하루 필요 손님',L.map(c=>{ const f=finCalc(c); return f?{v:f.guests,t:Math.ceil(f.guests)+'명'}:{v:null,t:'-'}; }),minIdx)}
    ${row('투자 회수',L.map(c=>{ const f=finCalc(c); return f&&f.payback?{v:f.payback,t:f.payback.toFixed(1)+'개월'}:{v:null,t:'-'}; }),minIdx)}
    ${row('상태',L.map(c=>({v:null,t:esc(c.status)})))}
    <tr><th>메모</th>${L.map(c=>`<td class="note" style="white-space:pre-wrap;min-width:130px">${esc(c.memo||'')}</td>`).join('')}</tr>
  </tbody></table></div><div class="note" style="margin-top:6px">초록 칸 = 그 줄에서 가장 좋은 값</div></div>`;
}

/* ---------------- 지도 ---------------- */
let MAP=null, OVL=[];
function mk(p,label,color,dot,title){
  const el=document.createElement('div'); el.className='mk'+(dot?' dot':''); el.style.background=color; if(!dot) el.textContent=label; el.title=title||label;
  OVL.push(new kakao.maps.CustomOverlay({position:LL(p),content:el,yAnchor:1,map:MAP})); return el;
}
function circ(p,r,color,dash,fill){ OVL.push(new kakao.maps.Circle({center:LL(p),radius:r,strokeWeight:1.5,strokeColor:color,strokeOpacity:.85,strokeStyle:dash?'dashed':'solid',fillColor:color,fillOpacity:fill||0,map:MAP})); }
const lg=(c,t)=>`<span><i style="background:${c}"></i>${t}</span>`;
function drawMap(){
  if(!K) return;
  if(!MAP){ MAP=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(35.8714,128.6014),level:8});
    kakao.maps.event.addListener(MAP,'click',e=>{ if(!PICK) return; PICK=false; const ll=e.latLng; addCand({name:'지도에서 고른 곳',addr:'',x:ll.getLng(),y:ll.getLat()},true); }); }
  OVL.forEach(o=>o.setMap(null)); OVL=[];
  DB.stores.filter(s=>s.x).forEach(s=>{ mk(s,s.name,'#14524a',false,'우리 매장 · '+s.name); circ(s,(+DB.zoneKm||2)*1000,'#14524a',true,0.03); });
  const c=TAB==='detail'&&DB.cands.find(x=>x.id===CUR); let L='';
  if(c){
    if(c.m&&c.m.v===2){ circ(c,300,'#c0392b',true,0.06); circ(c,500,'#c0392b',true,0); circ(c,1000,'#c0392b',false,0.03);
      ((cm(c)||{}).comp||[]).forEach(p=>mk(p,'','#222',true,p.name+' · '+fmtM(p.dist)));
      (c.m.subway||[]).forEach(p=>mk(p,'역','#2b6cb0',false,p.name+' · '+fmtM(p.dist))); }
    mk(c,'후보지','#c0392b',false,c.name); MAP.setLevel(5); MAP.setCenter(LL(c));
    L=lg('#c0392b','후보지 (원 = 300·500m·1km)')+lg('#222','장어집')+lg('#2b6cb0','지하철')+lg('#14524a','우리 매장 (점선 = 영업지역)');
  }else{
    const list=TAB==='cmp'?DB.cands.filter(x=>SEL.has(x.id)):DB.cands;
    list.forEach(x=>{ const s=x.m?scoreOf(x.m,x):null, F=finalOf(x,s); const el=mk(x,(F.grade?F.grade+' ':'')+x.name,F.grade?GC[F.grade]:'#777',false,x.addr); el.style.cursor='pointer'; el.addEventListener('click',()=>go('detail',x.id)); });

    L=TAB==='set'?lg('#b88a2a',CT()+' 기준 상권')+lg('#14524a','우리 매장'):lg(GC.A,'A')+lg(GC.B,'B')+lg(GC.C,'C')+lg(GC.D,'D')+lg('#14524a','우리 매장');
  }
  $('#legend').innerHTML=L;
  setTimeout(()=>MAP.relayout(),0);
}

// 입력 칸은 그대로 두고 점수·결론·평가 카드만 새로 그림 (입력 중 포커스를 잃지 않게)
let softT=null;
function softRender(){
  if(TAB!=='detail') return;
  const c=DB.cands.find(x=>x.id===CUR); if(!c) return;
  const tmp=document.createElement('div'); tmp.innerHTML=ct(detailHtml());
  ['rcard','s-diag','s-eval','s-items','s-comp','s-todo'].forEach(id=>{ const a=document.getElementById(id), b=tmp.querySelector('#'+id); if(a&&b) a.replaceWith(b); });
  const fr=$('#finres'); if(fr) fr.innerHTML=finRes(c);
  const tb=$('[data-f=tables]'); if(tb) tb.placeholder=c.area?'비우면 '+Math.max(1,Math.round(c.area/(+DB.fin.pyPerTable||3.3)))+'개로 추정':'모르면 비움';
}
async function find(){
  const q=$('#q').value.trim(); if(q.length<2) return toast('주소나 장소를 두 글자 이상 넣어 주세요');
  if(!K) return toast('카카오 지도가 아직 안 열렸어요');
  try{ CANDS=await geocode(q); if(!CANDS.length) toast('찾지 못했어요. "'+CT()+' ○○구 ○○동" 처럼 넣어 보세요'); else if(CANDS.length===1) return addCand(CANDS[0]); render(); }
  catch(e){ toast(e.message); }
}
function addCand(p,fromMap){
  const c={id:uid(),name:p.name,addr:p.addr||p.name,x:p.x,y:p.y,status:'검토 중',created:today()};
  DB.cands.push(c); save(); CANDS=[]; go('detail',c.id); analyze(c.id);
  if(fromMap) setTimeout(async()=>{ try{ const r=await kcall(cb=>K.geo.coord2Address(c.x,c.y,cb)); const a=r.list[0]; if(a){ c.addr=(a.road_address&&a.road_address.address_name)||a.address.address_name; c.name=c.addr; save(); if(TAB==='detail'&&CUR===c.id) render(); } }catch(e){} },0);
}
async function analyze(id){
  const c=DB.cands.find(x=>x.id===id); if(!c||!K||busy) return;
  busy=true; render();
  try{
    const show=(n,t)=>{ const el=$('#anaProg'); if(!el) return; el.hidden=false; el.querySelector('span').textContent=`자료 모으는 중 ${n}/${t}`; el.querySelector('i').style.width=Math.round(n/t*100)+'%'; };
    show(0,STEPS); c.m=await measure(c,show); save();
  }catch(e){ toast(e.message); }
  finally{ busy=false; render(); }
}
function exportFile(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`일품집-상권분석-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  DB.lastBackup=today(); save(); render();
}
// 기록은 이 브라우저에만 있어서, 후보지가 있는데 14일 넘게 백업을 안 받았으면 맨 위에 알림
function backupWarn(){ if(!DB.cands.length) return ''; const lb=DB.lastBackup, days=lb?Math.floor((new Date(today())-new Date(lb))/864e5):null; if(days!=null&&days<14) return '';
  return `<div class="infobox noprint" style="border-color:var(--warn)"><b>${lb?`마지막 백업 ${days}일 전`:'아직 백업 파일을 받은 적이 없어요'}</b> — 후보지·심사 기록은 이 브라우저에만 있어서 기록 지우기·기기 변경 때 사라져요. <button class="btn sm" data-act="export">지금 백업 받기</button></div>`; }
function benchWarn(){ return ''; }
function importFile(f){
  const r=new FileReader(); r.onload=()=>{ try{ const j=migrate(JSON.parse(r.result)); if(!j) throw 0;
    if(!confirm(`백업의 후보지 ${j.cands.length}곳으로 바꿀까요? 지금 이 브라우저의 기록은 덮어써져요`)) return;
    DB=j; save(); render(); toast('불러왔어요'); }catch(e){ toast('일품집 상권분석 백업 파일이 아니에요'); } }; r.readAsText(f);
}
document.addEventListener('click',async e=>{
  const nb=e.target.closest('#nav button'); if(nb) return go(nb.dataset.tab);
  if(isMob()){
    const sh=e.target.closest('.card[id^="s-"] > .sh'); if(sh){ const c=sh.parentElement; if(OPENSET.has(c.id)) OPENSET.delete(c.id); else OPENSET.add(c.id); applyFold(); return; }
    const na=e.target.closest('.secnav a'); if(na){ const id=(na.getAttribute('href')||'').slice(1); if(id&&id.startsWith('s-')&&id!=='s-sum'){ e.preventDefault(); openSec(id); const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; } }
  }
  if(e.target.closest('[data-act=maptoggle]')){ document.body.classList.toggle('showmap'); drawMap(); return; }
  if(e.target.closest('[data-act=foldall]')){ const ids=$$('.card[id^="s-"]').map(c=>c.id); if(ids.every(i=>OPENSET.has(i))) OPENSET.clear(); else ids.forEach(i=>OPENSET.add(i)); applyFold(); return; }
  if(e.target.matches('[data-sel]')){ const id=e.target.dataset.sel; e.target.checked?SEL.add(id):SEL.delete(id); const b=$('[data-act=cmpSel]'); if(b){ b.disabled=SEL.size<2; b.textContent=`선택 ${SEL.size}곳 비교`; } e.stopPropagation(); return; }
  const cc=e.target.closest('[data-open]'); if(cc&&!e.target.closest('input')) return go('detail',cc.dataset.open);
  const t=e.target.closest('button,[data-act]'); if(!t) return;
  if(t.dataset.cand!=null) return addCand(CANDS[+t.dataset.cand]);
  if(t.dataset.sc!=null){ const p=window._sc[+t.dataset.sc]; DB.stores.push({name:window._scName,addr:p.addr,x:p.x,y:p.y}); save(); seedSales(); render(); return; }
  if(t.dataset.ev){ EVAL=t.dataset.ev; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.fs){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; const fk=EVAL==='A'?'field':'field2'; c[fk]=c[fk]||{}; const v=+t.dataset.v; c[fk][t.dataset.fs]=c[fk][t.dataset.fs]===v?0:v; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.sdel!=null){ if(confirm('이 매장을 지울까요?')){ DB.stores.splice(+t.dataset.sdel,1); save(); render(); } return; }
  const a=t.dataset.act;
  if(a==='find') return find();
  if(a==='pick'){ PICK=!PICK; render(); if(PICK) toast('지도에서 후보지 위치를 누르세요'); return; }
  if(a==='storeMeasure') return measureStores();
  if(a==='sysreset'){ DB.sys=defSys(); save(); render(); return; }
  if(a==='cmpSel') return go('cmp');
  if(a==='redo') return analyze(CUR);
  if(a==='print') return window.print();
  if(a==='del'){ const c=DB.cands.find(x=>x.id===CUR); if(c&&confirm(`"${c.name}" 후보지를 지울까요?`)){ DB.cands=DB.cands.filter(x=>x.id!==CUR); SEL.delete(CUR); save(); go('list',null); } return; }
  if(a==='sadd'){ const n=$('#sname').value.trim(), q=$('#saddr').value.trim(); if(!n||q.length<2) return toast('매장 이름과 주소를 넣어 주세요'); if(!K) return;
    try{ const L=await geocode(q); if(!L.length) return toast('주소를 찾지 못했어요');
      if(L.length===1){ DB.stores.push({name:n,addr:L[0].addr,x:L[0].x,y:L[0].y}); save(); seedSales(); render(); return; }
      window._sc=L; window._scName=n; $('#scands').innerHTML='<div class="note">어느 곳인가요?</div>'+L.map((p,i)=>`<button data-sc="${i}"><b>${esc(p.name)}</b><br><small>${esc(p.addr)}</small></button>`).join(''); }catch(err){ toast(err.message); } return; }
  if(a==='wreset'){ DB.weights=defW(); save(); render(); return; }
  if(a==='ping'){ const el=$('#pingres'); el.textContent='확인 중…';
    try{ const j=JSON.parse(await relay('ping',{})); el.innerHTML=!j.allowed?`<span style="color:var(--warn)">중계 서버가 이 주소(${esc(location.origin)})를 허용 안 해요 — worker.js 의 ALLOW 목록에 추가</span>`:j.hasKey?'<span style="color:var(--ok)">연결됨 · 인증키 있음. "다시 분석"하면 공공데이터가 붙어요 (기준 상권도 다시 만들기)</span>':'<span style="color:var(--warn)">중계 서버는 연결됐는데 인증키(DATA_KEY)가 없어요</span>'; if(j.allowed) el.innerHTML+=j.hasSgis?'<br><span style="color:var(--ok)">통계청 SGIS 키 있음 · 3km 직장인 수 사용 가능</span>':'<br><span style="color:var(--warn)">통계청 SGIS 키(SGIS_KEY·SGIS_SECRET)가 아직 없어요 — 직장인 수는 빠지고 분석돼요</span>'; if(j.allowed) el.innerHTML+=j.hasDrive?'<br><span style="color:var(--ok)">카카오 길찾기 키 있음 · 차로 12분 상권 사용</span>':'<br><span style="color:var(--warn)">카카오 길찾기 키(KAKAO_REST)가 없어요 — 3km 원으로 대신 계산해요</span>'; if(false) el.innerHTML+=j.hasNaver?'<br><span style="color:var(--ok)">네이버 검색 키 있음 · 장어집 인기도(블로그 글 수) 사용 가능</span>':'<br><span style="color:var(--warn)">네이버 검색 키(NAVER_ID·NAVER_SECRET)가 아직 없어요 — 장어집은 카카오 검색 순서로 골라요</span>'; }
    catch(e){ el.innerHTML=`<span style="color:var(--warn)">연결 실패: ${esc(e.message)} — 주소가 맞는지, Worker 를 배포했는지 확인</span>`; } return; }
  if(a==='convtarget'){ const c=DB.cands.find(x=>x.id===CUR), E=convEst(c); if(c&&E){ c.target=E.v; save(); const y=window.scrollY; render(); window.scrollTo(0,y); } return; }
  if(a==='finreset'){ DB.fin=defFin(); save(); render(); return; }
  if(a==='export') return exportFile();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f; if(f){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c[f]=e.target.type==='number'?(e.target.value===''?'':+e.target.value):e.target.value; save();
    if(['mkRent','rent','area'].includes(f)){ const el=$('#rentcmp'); if(el) el.innerHTML=rentTxt(c); }
    if(['cntWk','cntWe','cntWait','sbizFlow'].includes(f)){ const el=$('#flowres'); if(el) el.innerHTML=flowTxt(c); } if(['rent','area','premium','target','tables'].includes(f)){ clearTimeout(softT); softT=setTimeout(softRender,250); } return; }
  const fxk=e.target.dataset.fx; if(fxk){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.fx=c.fx||{}; c.fx[fxk]=e.target.type==='number'?(e.target.value===''?'':+e.target.value):e.target.value; save(); return; }
  const fnk=e.target.dataset.fn; if(fnk){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.fnote=c.fnote||{}; c.fnote[fnk]=e.target.value; save(); return; }
  const rv=e.target.dataset.rv; if(rv){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.review=c.review||{}; c.review[rv]=e.target.value;
    if(rv==='dec'){ if(!c.review.at) c.review.at=today(); const s=c.m?scoreOf(c.m,c):null, F=s?finalOf(c,s):null; c.review.score=F?F.tot:null;
      c.review.snap=F&&F.tot!=null?{at:today(),grade:F.grade,decision:F.decision,done:F.done,parts:(F.parts||[]).map(x=>({t:x.t,pts:x.pts,score:x.score})),mkt:s.mkt,city:CT(),bench:null,weights:Object.assign({},DB.weights),sys:JSON.parse(JSON.stringify(SYS())),fin:{cost:DB.fin.cost,labor:DB.fin.labor,var:DB.fin.var}}:null; } save(); return; }
  const sy=e.target.dataset.sys; if(sy){ DB.sys=SYS(); const v=e.target.type==='checkbox'?e.target.checked:+e.target.value||0; const [a,b,k]=sy.split('.');
    if(a==='parts'||a==='grades') DB.sys[a][b]=Math.max(0,v); else if(a==='minDone') DB.sys.minDone=Math.max(0,Math.min(100,v)); else if(a==='ko'){ if(k) DB.sys.ko[b][k]=v; else DB.sys.ko[b]=v; } save(); return; }
  const cqid=e.target.dataset.cq; if(cqid){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.compQ=c.compQ||{}; const o=c.compQ[cqid]=c.compQ[cqid]||{}; o[e.target.dataset.k]=e.target.value===''?'':+e.target.value; save();
    const Q=compQual(c); if(Q){ const el=$('#cqsum'); if(el) el.innerHTML=cqSum(Q); Q.L.forEach(x=>{ const td=document.querySelector(`[data-cqt="${CSS.escape(String(x.p.id))}"]`); if(td){ const l=cqLv(x.t); td.className='num rk '+l[1]; td.innerHTML=`${l[0]} <span class="note">${x.t.toFixed(2)}</span>`; } }); }
    return; }
  const ssi=e.target.dataset.ss; if(ssi!=null){ const st=DB.stores[+ssi]; if(st){ st.sales=e.target.value===''?'':+e.target.value; save(); } return; }
  if(e.target.dataset.season){ const v=e.target.value.split(/[ ,]+/).map(Number).filter(x=>x>0); if(v.length===12){ DB.fin.season=v; save(); } return; }
  const fk=e.target.dataset.fin; if(fk){ DB.fin[fk]=Math.max(0,+e.target.value||0); save(); return; }
  const w=e.target.dataset.w; if(w){ DB.weights[w]=Math.max(0,+e.target.value||0); save(); return; }
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='city'){ if(e.target.value==='__add'){ const n=(prompt('추가할 도시 이름 (예: 서울, 창원, 대전)')||'').trim().slice(0,10); if(n&&!DB.cityList.includes(n)){ DB.cityList.push(n); } if(n) return switchCity(n); fillCity(); return; } return switchCity(e.target.value); }
  if(e.target.dataset.f==='status'||e.target.dataset.w||e.target.dataset.sys) return render();
  if(e.target.dataset.take){ DB.takePct=e.target.value===''?null:+e.target.value; save(); render(); return; }
  if(e.target.dataset.ui){ DB.ui=e.target.dataset.ui; save(); render(); return; }
  if(e.target.dataset.biz){ DB.biz=e.target.dataset.biz; DB.takePct=null; DB.weights=defW(); Object.assign(DB.fin,PF().fin); if(DB.sys&&DB.sys.ko&&DB.sys.ko.park) delete DB.sys.ko.park.n; save(); render(); toast(`${PF().name} 기본값(비중·원가율·인건비·객단가)으로 바꿨어요`); return; }
  if(e.target.dataset.fx){ const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(e.target.dataset.cx){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.compEx=c.compEx||{}; if(e.target.checked) c.compEx[e.target.dataset.cx]=1; else delete c.compEx[e.target.dataset.cx]; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(e.target.dataset.rv==='dec'){ const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(id==='filter'){ FILTER=e.target.value; render(); }
  if(id==='zone'){ DB.zoneKm=+e.target.value; save(); render(); }
  if(id==='relay'){ DB.relay=e.target.value.trim(); save(); }
  if(id==='imp'&&e.target.files[0]) importFile(e.target.files[0]);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='q'){ e.preventDefault(); find(); } });

load(); fillCity(); render();
$('#sdk').textContent='카카오 지도 여는 중…';
loadSdk().then(ok=>{
  $('#sdk').textContent=ok?'':'카카오 지도 연결 실패';
  if(!ok){ $('#map').innerHTML=`<div class="empty">카카오 지도를 열지 못했어요.<br>프로그램에 들어 있는 JavaScript 키 2개(7ed6…, 1aaf…) 모두 이 주소에서 거부됐어요.<br>카카오 개발자 → 플랫폼 키 → JavaScript 키 → <b>JavaScript SDK 도메인</b>에 <b>${esc(location.origin)}</b> 를 넣고 저장했는지, 그 앱의 <b>카카오맵 사용 설정</b>이 켜져 있는지 확인해 주세요. 저장 후 1~2분 뒤 새로고침하세요.</div>`; }
  render();
});
