<!doctype html>
<html lang="ko">
<head>
<title>일품집 상권분석</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 보고서형 디자인: 네이비 한 색 + 회색, 제목·큰 숫자는 명조 */
:root{--bg:#f3f4f6;--paper:#fff;--ink:#141a26;--ink2:#2b3445;--sub:#6b7383;--faint:#9aa1ad;--line:#e2e5ea;--line2:#cfd4dc;
  --navy:#1c3557;--navy2:#2d5282;--navyT:rgba(28,53,87,.07);--gold:#a8822e;--warn:#a13a32;--ok:#2f6b4f;--soft:#f1f3f6;
  --gA:#2f6b4f;--gB:#2d5282;--gC:#a8822e;--gD:#a13a32;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;--sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
header{background:var(--paper);border-bottom:1px solid var(--line);padding:0 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:sticky;top:0;z-index:50;min-height:58px}
header h1{margin:0;font:700 17px/1 var(--serif);color:var(--navy);letter-spacing:-.02em}
header .tag{font-size:11px;color:var(--sub);border-left:1px solid var(--line2);padding-left:12px;letter-spacing:.04em}
nav{display:flex;gap:2px;align-self:stretch}
nav button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--sub);padding:0 14px;cursor:pointer;font-weight:600;font-size:14.5px}
nav button:hover{color:var(--ink)}
nav button[aria-current]{color:var(--navy);border-bottom-color:var(--navy)}
.sp{flex:1}
main{max-width:1340px;margin:0 auto;padding:22px 20px 100px}
.wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);gap:22px;align-items:start}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}.mapbox{order:-1;position:static!important}#map{height:250px!important;min-height:0!important}header{padding:6px 14px;gap:10px}nav button{padding:10px 10px}main{padding:14px 12px 90px}}
.mapbox{position:sticky;top:80px}
#map{height:calc(100vh - 130px);min-height:380px;border:1px solid var(--line);background:var(--soft);overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* 종이 */
.card{background:var(--paper);border:1px solid var(--line);padding:24px 26px;margin-bottom:16px}
@media (max-width:640px){.card{padding:18px 16px}}
.card h2{margin:0;font:700 18px/1.35 var(--serif);color:var(--ink);letter-spacing:-.02em}
.card h3{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--ink2)}
.sh{display:flex;align-items:baseline;gap:12px;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--ink)}
.sh .no{font:700 13px/1 var(--serif);color:var(--gold);letter-spacing:.06em}
.sh .aside{margin-left:auto;font-size:13px;color:var(--sub)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
.btn{border:1px solid var(--line2);background:var(--paper);padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-block;color:var(--ink2);border-radius:4px}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2);color:#fff}
.btn.bad{color:var(--warn)}.btn.sm{padding:5px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
.note{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:36px 10px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:4px;padding:8px 10px;background:var(--paper);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);outline-offset:-1px}
textarea{width:100%;min-height:76px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid2 label{font-size:12px;color:var(--sub);font-weight:600;display:flex;flex-direction:column;gap:4px}
.cands button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);padding:10px 14px;margin-top:6px;cursor:pointer}
.cands button:hover{border-color:var(--navy)}.cands small{color:var(--sub)}
.gr{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;color:#fff;font:700 13px/1 var(--serif);padding:0 6px;border-radius:3px}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}
.st{display:inline-block;padding:1px 8px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--sub);border-radius:3px;vertical-align:2px}
.st[data-s="계약"]{background:var(--ok);border-color:var(--ok);color:#fff}.st[data-s="탈락"]{text-decoration:line-through}.st[data-s="현장 확인"]{border-color:var(--navy2);color:var(--navy2)}
/* 목록 */
.cc{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cc:last-child{border-bottom:0}
.cc:hover{background:var(--soft)}
.cc .sc{width:56px;text-align:center}
.cc .sc b{display:block;font:700 26px/1 var(--serif);color:var(--ink)}
.cc .sc small{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.cc .sc.none b{color:var(--faint);font-size:14px;font-family:var(--sans)}
.cc .nm{font-weight:700;font-size:15.5px}
.mini{display:flex;gap:3px;margin-top:7px}.mini i{display:block;width:30px;height:4px;background:var(--line);position:relative;overflow:hidden}.mini i b{position:absolute;left:0;top:0;bottom:0;background:var(--navy)}
.chk{width:18px;height:18px;accent-color:var(--navy)}
.warnmark{color:var(--warn);font-size:12px;font-weight:700;margin-left:6px}
/* 표지 */
.cover{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:20px;border-bottom:3px double var(--ink)}
@media (max-width:640px){.cover{grid-template-columns:1fr}}
.cover h1{margin:8px 0 6px;font:700 26px/1.3 var(--serif);letter-spacing:-.03em}
.cover .meta{font-size:13px;color:var(--sub)}
.scorebox{border:1px solid var(--ink);min-width:200px;text-align:center}
.scorebox .lab{font-size:11px;letter-spacing:.14em;color:var(--sub);padding:8px 0 0}
.scorebox .num{font:700 54px/1.05 var(--serif);color:var(--ink);padding:2px 0}
.scorebox .num small{font-size:16px;color:var(--faint);margin-left:2px}
.scorebox .dec{border-top:1px solid var(--ink);padding:9px 12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;justify-content:center}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.mix{font-size:12.5px;color:var(--sub);margin-top:6px}
/* 결론 요약 */
.exec{margin:18px 0 0;padding:0;list-style:none;counter-reset:ex}
.exec li{counter-increment:ex;position:relative;padding:10px 0 10px 34px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.65}
.exec li::before{content:counter(ex,decimal-leading-zero);position:absolute;left:0;top:11px;font:700 13px/1.4 var(--serif);color:var(--gold)}
.exec li.w{color:var(--warn);font-weight:600}
/* 사실 표 */
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin:4px 0 18px}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,1fr)}}
.facts div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 13px}
.facts span{display:block;font-size:11.5px;color:var(--sub);letter-spacing:.02em}
.facts b{display:block;font-size:15px;margin-top:3px;font-weight:700}
.typeline{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.type{font:700 20px/1.3 var(--serif);color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line2);padding:1px 9px;font-size:12.5px;color:var(--ink2);border-radius:3px}
.op p{margin:10px 0;line-height:1.85;font-size:14.5px;color:var(--ink2)}
.op p b{color:var(--ink)}
/* 영역 평가 */
.evgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,.8fr);gap:20px;align-items:center}
@media (max-width:760px){.evgrid{grid-template-columns:1fr}}
.ev{display:grid;grid-template-columns:110px 1fr 44px 46px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .nm{font-weight:700}.ev .w{font-size:11.5px;color:var(--faint)}
.ev .sc{font:700 18px/1 var(--serif);text-align:right}
.ev .lv{font-size:12px;font-weight:700;text-align:right}
.lv.hi{color:var(--ok)}.lv.lo{color:var(--warn)}.lv.md{color:var(--sub)}
.hbar{height:8px;background:var(--soft);position:relative}.hbar i{position:absolute;left:0;top:0;bottom:0;background:var(--navy)}
.hbar u{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px dashed var(--gold)}
.radar{display:block;margin:0 auto;max-width:360px;width:100%}
/* 세부 지표 표 */
.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{font-size:11.5px;color:var(--sub);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--ink);letter-spacing:.02em}
.dt td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tr.grp td{padding-top:16px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line2);font-size:13px}
.dt td.v{text-align:right;font-weight:700;white-space:nowrap}
.dt td.rk{text-align:right;white-space:nowrap;font-weight:600}
.rk.hi{color:var(--ok)}.rk.lo{color:var(--warn)}
.dt td.sb{width:38%}
@media (max-width:640px){.dt td.sb{display:none}.dt th.sbh{display:none}}
.strip{position:relative;height:14px}
.strip::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--line2)}
.strip i{position:absolute;top:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#b7bdc7}
.strip b{position:absolute;top:1px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--navy);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--navy)}
.strip u{position:absolute;top:1px;bottom:1px;border-left:1px dashed var(--gold)}
/* 공용 표 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.best{background:var(--navyT);font-weight:700;color:var(--navy)}
.ring{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin:0 0 14px}
.ring div{text-align:center;padding:12px 4px;border-right:1px solid var(--line)}.ring div:last-child{border-right:0}
.ring b{display:block;font:700 28px/1.1 var(--serif)}.ring span{font-size:12px;color:var(--sub)}
.warnbox{border-left:3px solid var(--warn);background:rgba(161,58,50,.05);color:var(--warn);padding:9px 14px;margin:10px 0;font-weight:600;font-size:14px}
.okbox{border-left:3px solid var(--ok);background:rgba(47,107,79,.05);color:var(--ok);padding:9px 14px;margin:10px 0;font-size:14px}
.infobox{border:1px solid var(--line);border-left:3px solid var(--navy);background:var(--paper);padding:12px 16px;margin:0 0 16px;font-size:14px;line-height:1.7}
.prog{height:3px;background:var(--line);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--navy);transition:width .2s}
.todo{margin:0;padding:0;list-style:none}.todo li{position:relative;padding:9px 0 9px 28px;font-size:14px;border-bottom:1px solid var(--line);line-height:1.6}
.todo li::before{content:"";position:absolute;left:2px;top:13px;width:12px;height:12px;border:1.5px solid var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);margin:10px 0}
.kpi{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px}.kpi span{display:block;font-size:11.5px;color:var(--sub)}.kpi b{display:block;font:700 22px/1.3 var(--serif);margin-top:2px}.kpi small{color:var(--faint);font-size:11.5px}
.kpi.bad b{color:var(--warn)}
.fr{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fr b{font-weight:700;font-size:14px}
.stars{display:flex;gap:0;border:1px solid var(--line2);border-radius:4px;overflow:hidden}.stars button{width:36px;height:32px;border:0;border-right:1px solid var(--line2);background:var(--paper);cursor:pointer;font-weight:600;color:var(--sub)}
.stars button:last-child{border-right:0}.stars button.on{background:var(--navy);color:#fff}
.secnav{display:flex;gap:0;flex-wrap:wrap;position:sticky;top:58px;z-index:20;background:var(--bg);padding:8px 0 10px;margin:-10px 0 6px;border-bottom:1px solid var(--line)}
.secnav a{text-decoration:none;color:var(--sub);padding:3px 12px;font-size:13px;font-weight:600;border-right:1px solid var(--line2)}
.secnav a:last-child{border-right:0}.secnav a:hover{color:var(--navy)}
@media (max-width:1000px){.secnav{position:static}}
.card[id^="s-"]{scroll-margin-top:110px}
.dm-sc{font:700 18px/1 var(--serif);color:var(--ink)}
.disc{font-size:12px;color:var(--sub);border-top:1px solid var(--line);margin-top:18px;padding-top:12px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw}
.toast.on{opacity:1}
.mk{display:inline-block;font:600 12px/1 var(--sans);color:#fff;border:1.5px solid #fff;border-radius:3px;padding:4px 7px;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;transform:translateY(-4px)}
.mk.dot{padding:0;width:10px;height:10px;border-radius:50%}
.ponly{display:none}
details summary{cursor:pointer}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--paper:#161b23;--ink:#e6e9ee;--ink2:#c7ccd5;--sub:#8d95a3;--faint:#6c7480;--line:#262d38;--line2:#323a47;--navy:#7fa6d8;--navy2:#9bbbe4;--navyT:rgba(127,166,216,.12);--soft:#1c222c;--gold:#c9a24e;--warn:#e07a70;--ok:#6cbf94}.btn.pri{color:#0e1116}.stars button.on{color:#0e1116}}
@media print{header,.noprint,.mapbox,nav,.secnav{display:none!important}.wrap{display:block}main{max-width:none;padding:0}body{background:#fff}.card{border:0;border-bottom:1px solid #ccc;padding:14px 0;break-inside:avoid}.ponly{display:block}}
</style>
</head>
<body>
<header>
  <h1>일품집 상권분석</h1><span class="tag">대구 · 본사 내부 자료</span>
  <nav id="nav"><button data-tab="list">후보지</button><button data-tab="detail">분석</button><button data-tab="cmp">비교</button><button data-tab="set">설정</button></nav>
  <span class="sp"></span><span id="sdk" class="note"></span>
</header>
<main><div class="wrap"><div id="pane"></div><div class="mapbox"><div id="map"></div><div class="legend" id="legend"></div></div></div></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* =====================================================================
   일품집 상권분석 (대구) — 서버 없이 카카오 지도 JavaScript SDK 만 사용
   - JavaScript 키는 카카오 개발자 사이트에 등록한 주소에서만 동작하는 공개용 키
   - 후보지 기록은 이 브라우저(localStorage)에 저장, 설정 → 백업 파일로 옮김
   - 점수 = 대구 "기준 상권"(설정에서 편집) 측정값과 비교한 백분위. 자료는 카카오 지도 등록 기준
   ===================================================================== */
const KAKAO_JS_KEY='1aaf38e9a5c0669aad33526fced00618';
const STORE_KEY='ilpum-sk-v1';
const STATUSES=['검토 중','현장 확인','보류','탈락','계약'];
const DEF_BENCH=['동성로','반월당역','범어역','수성못','들안길','동대구역','칠곡3지구','상인역','월배역','계명대역','죽전역','두류역','신매역','대곡역','경북대학교 북문','침산동','앞산카페거리','율하역','대구혁신도시','대실역'];

/* ---- 분석 영역과 지표 (d = 한 지점에서 모은 값과 거기서 계산한 값) ---- */
const fm=v=>v==null?'-':v<1000?Math.round(v)+'m':(v/1000).toFixed(1)+'km';
const DIMS=[
  {k:'hub',t:'저녁 외식 상권',w:20,why:'사람이 저녁에 모이는 곳인가',subs:[
    {k:'food500',t:'음식점',u:'곳',r:'500m',get:d=>d.food500},
    {k:'meat500',t:'고깃집',u:'곳',r:'500m',get:d=>d.meat500},
    {k:'pub500',t:'술집',u:'곳',r:'500m',get:d=>d.pub500},
    {k:'cafe500',t:'카페',u:'곳',r:'500m',get:d=>d.cafe500},
    {k:'cvs500',t:'편의점 (유동 대용)',u:'곳',r:'500m',get:d=>d.cvs500}]},
  {k:'fam',t:'가족·주거',w:20,why:'가족 손님과 동네 단골',subs:[
    {k:'apt500',t:'아파트',u:'건',r:'500m',get:d=>d.apt500},
    {k:'apt1k',t:'아파트',u:'건',r:'1km',get:d=>d.apt1k},
    {k:'school1k',t:'학교',u:'곳',r:'1km',get:d=>d.school1k},
    {k:'acad1k',t:'학원',u:'곳',r:'1km',get:d=>d.acad1k}]},
  {k:'biz',t:'회식·방문 수요',w:15,why:'직장인 회식, 병원·관공서 방문객',subs:[
    {k:'gov1k',t:'관공서',u:'곳',r:'1km',get:d=>d.gov1k},
    {k:'bank1k',t:'은행',u:'곳',r:'1km',get:d=>d.bank1k},
    {k:'hosp1k',t:'병원',u:'곳',r:'1km',get:d=>d.hosp1k},
    {k:'lodge1k',t:'숙박',u:'곳',r:'1km',get:d=>d.lodge1k},
    {k:'mart1k',t:'대형마트',u:'곳',r:'1km',get:d=>d.mart1k}]},
  {k:'acc',t:'접근성',w:20,why:'차로·대중교통으로 오기 쉬운가',subs:[
    {k:'park300',t:'주차장',u:'곳',r:'300m',get:d=>d.park300},

function pct(v,arr,low){ if(!arr.length) return null; let less=0,eq=0; arr.forEach(a=>{ if(a<v) less++; else if(a===v) eq++; }); const p=(less+eq/2)/arr.length*100; return Math.round(low?100-p:p); }

      if(s.abs) return Object.assign({},s,{v:v==null?null:v,p:v==null?null:s.abs(v),arr:[],rank:null,of:0});
      const arr=B?B.arr[s.k]:[]; const p=(v!=null&&arr.length)?pct(v,arr,s.low):null;
      let rank=null; if(p!=null) rank=arr.filter(a=>s.low?a<v:a>v).length+1;

function tablesOf(c){ if(+c.tables>0) return {n:+c.tables,est:false}; if(+c.area>0) return {n:Math.max(1,Math.round(+c.area/(+DB.fin.pyPerTable||3.3))),est:true}; return null; }

function subP(s,k){ for(const dm of s.dims) for(const x of dm.subs) if(x.k===k) return x.p; return null; }
function typeOf(s){
  const sc=k=>{ const x=s.dims.find(y=>y.k===k); return x&&x.score!=null?x.score:0; }, d=s.d;
  const c=[['hub',sc('hub')],['fam',sc('fam')],['biz',sc('biz')]].sort((a,b)=>b[1]-a[1]);
  const T={hub:['먹자·외식 상권','저녁 외식 수요가 많아 회식·모임 손님을 기대할 수 있어요. 대신 임대료가 높고 음식점 경쟁이 치열해서 객단가와 재방문 관리가 승부처예요.'],
    fam:['주거 배후 상권','가족 외식과 주말 수요가 중심이에요. 평일 회식보다 주말 점심·저녁과 포장 판매가 매출의 축이 되고, 주차 편의가 매출에 크게 영향을 줘요.'],

    mix:['복합 상권','외식·주거·업무 수요가 고르게 섞여 있어 평일과 주말 매출이 비교적 안정적인 편이에요.'],
    low:['근린 소규모 상권','주변 배후 수요가 크지 않아요. 장어는 일부러 찾아오는 업종이라 주차가 편하면 목적형 손님으로 보완할 수 있지만, 개업 초기 홍보가 중요해요.']};
  const key=c[0][1]<45?'low':(c[0][1]>=55&&c[1][1]>=55&&c[0][1]-c[1][1]<=8)?'mix':c[0][0];
  const tags=[]; const pp=subP(s,'park500');
  if(d.subD!=null&&d.subD<=500) tags.push('역세권');
  if(d.n1k!=null&&d.n1k>=5) tags.push('장어 집적지 (목적형)');
  if(d.n1k===0) tags.push('장어 경쟁 공백');
  if(pp!=null&&pp>=70) tags.push('주차 여유'); if(pp!=null&&pp<=30) tags.push('주차 부족');
  return {key,name:T[key][0],desc:T[key][1],tags};

function satOf(d){ return d.food1k==null&&d.food500==null?null:(d.food500||0)/Math.max(1,(d.apt1k||0)+(d.gov1k||0)+(d.bank1k||0)+(d.hosp1k||0)); }
function satP(d){ const B=benchCache(); const arr=B.list.map(satOf).filter(v=>v!=null); const v=satOf(d); return v==null||!arr.length?null:pct(v,arr,true); }
function opinion(c,s,fin){
  const t=typeOf(s), d=s.d, P=[], ds=s.dims.filter(x=>x.score!=null).sort((a,b)=>b.score-a.score);
  P.push(`<b>${esc(t.name)}</b>이에요. ${t.desc}`);
  if(ds.length) P.push(`대구 기준 상권 ${s.of}곳과 비교한 데이터 점수는 <b>${s.total}점</b>(${s.rank}위 수준)이에요. 가장 강한 영역은 <b>${esc(ds[0].t)}</b>(${ds[0].score}점), 가장 약한 영역은 <b>${esc(ds.at(-1).t)}</b>(${ds.at(-1).score}점)이에요.`);

    : d.n300>0?`300m 안에 직접 경쟁하는 장어집(${esc(d.comp[0].name)}, ${fmtM(d.comp[0].dist)})이 있어요. 그 가게의 가격대와 저녁 손님 수를 직접 확인하세요.`
    : `1km 안 장어집은 ${d.n1k}곳이고 300m 안에는 없어 경쟁 부담은 크지 않은 편이에요.`);
  const sub=d.subway&&d.subway[0], pp=subP(s,'park500');
  P.push(`${sub?`가장 가까운 지하철역은 ${esc(sub.name)}(${fmtM(d.subD)})이고`:'2km 안에 지하철역이 없고'}, 500m 안 주차장은 ${fmtN(d.park500)}곳이에요.${pp!=null&&pp<=30?' 장어집은 차로 오는 가족·회식 손님이 많아 주차 대책이 꼭 필요해요.':''}`);
  const sp=satP(d); if(sp!=null) P.push(sp<=35?'배후 수요(아파트·관공서·병원)에 비해 음식점이 많은 편이라 외식 경쟁이 치열해요.':sp>=65?'배후 수요에 비해 음식점이 적은 편이라 외식 수요를 흡수할 여지가 있어요.':'배후 수요와 음식점 수는 대구 기준 상권과 비슷한 수준이에요.');
  if(fin) P.push(`월세 ${fmtN(c.rent)}만원 기준 손익분기 월매출은 약 <b>${fmtN(Math.round(fin.need))}만원</b>, 하루 손님 약 <b>${Math.ceil(fin.guests)}명</b>이 필요해요.${fin.target?(fin.rentRatio>12?` 목표 매출 대비 임대료 비율이 ${fin.rentRatio.toFixed(1)}%로 높은 편이에요(10% 이하 권장).`:` 목표 매출 대비 임대료 비율은 ${fin.rentRatio.toFixed(1)}%로 적정해요.`):''}`);
  if(fin&&fin.turns!=null){ const tn=fin.turns, txt=tn<=1?'여유 있는 편이에요':tn<=2?'보통 수준이에요':'빠듯해요. 월세에 비해 가게가 작거나 월세가 높은 편이에요';
    let add=''; if(s.mkt!=null&&s.mkt<45&&tn>1.5) add=' 상권 점수도 평균 아래라 이 조건은 위험할 수 있어요.'; else if(s.mkt!=null&&s.mkt>=60&&tn>2) add=' 상권은 좋지만 그만큼 임대 조건이 비싼 자리예요. 객단가를 높이거나 월세 협상이 필요해요.'; else if(s.mkt!=null&&s.mkt>=60&&tn<=1.2) add=' 상권 수준에 비해 임대 조건이 좋은 편이에요.';
    P.push(`본전을 맞추려면 테이블 ${fin.tables}개${fin.tablesEst?'(평수로 추정)':''}가 하루 <b>${tn.toFixed(1)}회전</b>해야 해요. ${txt}.${add}`); }
  const clash=nearStores(c).filter(n=>n.d<(+DB.zoneKm||2)*1000);
  if(clash.length) P.push(`<span style="color:var(--warn);font-weight:700">우리 매장 ${esc(clash[0].name)}과 ${fmtM(clash[0].d)} 거리라 영업지역(${DB.zoneKm}km)이 겹쳐요. 가맹계약상 출점이 어려울 수 있어요.</span>`);
  return P;
}

  if(sc.biz<45) L.push('평일 회식 수요 — 주변 회사·관공서 규모');

  if(c&&!c.rent) L.push('월세·관리비·보증금·권리금 조건');
  if(c){ const T=tablesOf(c); if(!T) L.push('평수와 배치 가능한 테이블 수'); else if(T.est) L.push(`실제 배치 가능한 테이블 수 — 지금은 평수로 ${T.n}개로 추정 (평면도로 확인)`); }

  L.push('가스·전기 용량, 급배수, 화장실 위치');

}

/* ---------------- 대구 기준 상권 만들기 ---------------- */
let benchBusy=false;
async function buildBench(){
  if(!K) return toast('카카오 지도가 아직 안 열렸어요');
  if(benchBusy) return; benchBusy=true; render();
  const names=DB.benchNames.filter(Boolean), pts=[];
  try{
    for(let i=0;i<names.length;i++){
      setProg(`기준 상권 ${i+1}/${names.length} · ${names[i]}`,i/names.length);
      const k=await retry(()=>kcall(cb=>K.ps.keywordSearch('대구 '+names[i],cb,{size:1})));
      const x=k.list[0]; if(!x){ pts.push({name:names[i],err:'못 찾음'}); continue; }
      const p={x:+x.x,y:+x.y};
      try{ const m=await measure(p,(n,t)=>setProg(`기준 상권 ${i+1}/${names.length} · ${names[i]}`,(i+n/t)/names.length)); pts.push({name:names[i],place:x.place_name,x:p.x,y:p.y,m}); }
      catch(e){ pts.push({name:names[i],err:'측정 실패'}); }
    }
    DB.bench={at:today(),points:pts}; _bc=null; save();
    toast(`대구 기준 상권 ${pts.filter(b=>b.m).length}곳을 만들었어요`);
  }catch(e){ toast(e.message); }
  finally{ benchBusy=false; setProg('',0); render(); }
}
function setProg(label,f){ const el=$('#prog'); if(!el) return; el.hidden=!label; el.querySelector('span').textContent=label; el.querySelector('i').style.width=Math.round(f*100)+'%'; }

const GC={A:'#2f6b4f',B:'#2d5282',C:'#a8822e',D:'#a13a32'};
const PAL=['#1c3557','#a8822e','#5b8bc4','#a13a32'];
function radar(series){
  const n=MKT.length, W=380, H=300, cx=W/2, cy=H/2+6, R=96, ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+R*v/100*Math.cos(ang(i)), cy+R*v/100*Math.sin(ang(i))];
  const ring=v=>MKT.map((_,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g=`<polygon points="${ring(100)}" fill="none" stroke="var(--line)"/><polygon points="${ring(75)}" fill="none" stroke="var(--line)"/><polygon points="${ring(50)}" fill="none" stroke="var(--gold)" stroke-dasharray="3 3"/><polygon points="${ring(25)}" fill="none" stroke="var(--line)"/>`;
  MKT.forEach((dm,i)=>{ const [x,y]=pt(i,100), [lx,ly]=pt(i,118); g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${lx<cx-4?'end':lx>cx+4?'start':'middle'}" font-size="12" font-weight="600" fill="var(--ink2)">${esc(dm.t)}</text>`; });
  series.forEach((s,k)=>{ const pts=s.map((v,i)=>pt(i,v==null?0:v)); g+=`<polygon points="${pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="${PAL[k]}" fill-opacity="${series.length>1?.10:.12}" stroke="${PAL[k]}" stroke-width="1.6"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${PAL[k]}"/>`).join(''); });
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="영역별 점수 레이더 차트">${g}</svg><div class="note" style="text-align:center;font-size:12px">점선 = 대구 기준 상권 중간(50점)</div>`;
}
function strip(x){
  if(x.v==null||!x.arr.length) return '<div class="strip"></div>';
  const mn=Math.min(...x.arr,x.v), mx=Math.max(...x.arr,x.v), sp=(mx-mn)||1, pos=v=>((v-mn)/sp*100).toFixed(1);
  const med=[...x.arr].sort((a,b)=>a-b)[Math.floor(x.arr.length/2)];
  return `<div class="strip" title="회색 점 = 대구 기준 상권 ${x.of}곳, 큰 점 = 이 후보지, 점선 = 기준 중간값">${x.arr.map(v=>`<i style="left:${pos(v)}%"></i>`).join('')}<u style="left:${pos(med)}%"></u><b style="left:${pos(x.v)}%"></b></div>`;
}

function execList(c,s,F,fin){
  const t=typeOf(s), d=s.d, ds=s.dims.filter(x=>x.score!=null).sort((a,b)=>b.score-a.score), L=[];
  L.push(`<b>${esc(t.name)}</b> — ${esc(t.desc.split('. ')[0].replace(/\.$/,''))}.`);
  if(ds.length) L.push(`강점은 <b>${esc(ds[0].t)}</b>(${ds[0].score}점)${ds[1]&&ds[1].score>=60?`·<b>${esc(ds[1].t)}</b>(${ds[1].score}점)`:''}, 약점은 <b>${esc(ds.at(-1).t)}</b>(${ds.at(-1).score}점)이에요.`);
  if(d.n1k!=null) L.push(d.n1k===0?'반경 1km 안에 장어집이 없는 경쟁 공백 지역이에요.':`장어집은 300m 안 ${d.n300}곳 · 500m 안 ${d.n500}곳 · 1km 안 ${d.n1k}곳${c.m.compMore?' 이상':''}이에요.`);
  if(fin) L.push(`월세 ${fmtN(c.rent)}만원 기준 손익분기 월매출 약 ${fmtN(Math.round(fin.need))}만원(하루 손님 약 ${Math.ceil(fin.guests)}명)${fin.turns!=null?`, 테이블당 하루 ${fin.turns.toFixed(1)}회전`:''}이 필요해요.${s.propScore!=null?` 매물 조건 점수는 <b>${s.propScore}점</b>이에요.`:''}`);
  else L.push('월세·평수를 넣으면 매물 조건까지 반영해 판단해요 (모르면 비워 두어도 돼요).');

    ${row('장어집 300m / 500m / 1km',S.map(s=>s&&s.d.n1k!=null?{v:s.d.compIdx,t:`${s.d.n300} / ${s.d.n500} / ${s.d.n1k}`}:{v:null,t:'-'}),minIdx)}
    ${row('음식점 500m',S.map(s=>s?{v:s.d.food500,t:fmtN(s.d.food500)}:{v:null,t:'-'}),maxIdx)}
    ${row('아파트 1km',S.map(s=>s?{v:s.d.apt1k,t:fmtN(s.d.apt1k)}:{v:null,t:'-'}),maxIdx)}
    ${row('주차장 500m',S.map(s=>s?{v:s.d.park500,t:fmtN(s.d.park500)}:{v:null,t:'-'}),maxIdx)}
    ${row('가까운 지하철',S.map(s=>s&&s.d.subD!=null?{v:s.d.subD,t:fmtM(s.d.subD)}:{v:null,t:'-'}),minIdx)}
    ${row('가까운 우리 매장',L.map(c=>{ const n=nearStores(c)[0]; return n?{v:n.d,t:esc(n.name)+' '+fmtM(n.d)}:{v:null,t:'-'}; }),maxIdx)}
    ${row('월세',L.map(c=>c.rent?{v:+c.rent,t:fmtN(c.rent)+'만'}:{v:null,t:'-'}),minIdx)}
    ${row('보증금',L.map(c=>c.deposit?{v:+c.deposit,t:fmtN(c.deposit)+'만'}:{v:null,t:'-'}),minIdx)}
    ${row('권리금',L.map(c=>c.premium?{v:+c.premium,t:fmtN(c.premium)+'만'}:{v:null,t:'-'}),minIdx)}
    ${row('면적',L.map(c=>c.area?{v:+c.area,t:fmtN(c.area)+'평'}:{v:null,t:'-'}),maxIdx)}
    ${row('손익분기 월매출',L.map(c=>{ const f=finCalc(c); return f?{v:f.need,t:fmtN(Math.round(f.need))+'만'}:{v:null,t:'-'}; }),minIdx)}
    ${row('하루 필요 손님',L.map(c=>{ const f=finCalc(c); return f?{v:f.guests,t:Math.ceil(f.guests)+'명'}:{v:null,t:'-'}; }),minIdx)}
    ${row('투자 회수',L.map(c=>{ const f=finCalc(c); return f&&f.payback?{v:f.payback,t:f.payback.toFixed(1)+'개월'}:{v:null,t:'-'}; }),minIdx)}
    ${row('상태',L.map(c=>({v:null,t:esc(c.status)})))}
    <tr><th>메모</th>${L.map(c=>`<td class="note" style="white-space:pre-wrap;min-width:130px">${esc(c.memo||'')}</td>`).join('')}</tr>
  </tbody></table></div><div class="note" style="margin-top:6px">초록 칸 = 그 줄에서 가장 좋은 값</div></div>`;
}

function setHtml(){
  const br=benchCache().list;
  return `<div class="card"><div class="sh"><h2>우리 매장 위치 · 영업지역</h2></div>
    <div class="note">후보지가 영업지역 안이면 빨갛게 알려 줘요. 반경은 가맹계약서와 같게 맞추세요.</div>
    <div class="row" style="margin:8px 0">영업지역 반경 <select id="zone">${[0.5,1,1.5,2,3,5].map(k=>`<option value="${k}"${+DB.zoneKm===k?' selected':''}>${k}km</option>`).join('')}</select></div>
    <table><tbody>${DB.stores.map((s,i)=>`<tr><td><b>${esc(s.name)}</b><div class="note">${esc(s.addr||'')}</div></td><td style="white-space:nowrap;text-align:right"><button class="btn sm bad" data-sdel="${i}">지우기</button></td></tr>`).join('')||'<tr><td class="note">아직 없어요</td></tr>'}</tbody></table>
    <div class="row" style="margin-top:8px"><input type="text" id="sname" placeholder="매장 이름 (예: 본점)" style="width:140px" maxlength="20"><input type="text" id="saddr" placeholder="주소" style="flex:1;min-width:180px"><button class="btn" data-act="sadd">추가</button></div>
    <div class="cands" id="scands"></div></div>
  <div class="card"><div class="sh"><h2>대구 기준 상권</h2></div>
    <div class="note">점수는 이 상권들과 비교한 위치예요. 한 줄에 하나씩 (앞에 "대구"를 붙여 검색해요). 우리 매장 근처와 "잘 되는 자리"를 넣어 두면 비교가 정확해져요. 최대 40곳.</div>
    <textarea id="benchNames" style="min-height:140px;margin-top:6px">${esc(DB.benchNames.join('\n'))}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn pri" data-act="bench" ${benchBusy||!K?'disabled':''}>${benchBusy?'만드는 중…':DB.bench?'기준 다시 만들기':'기준 만들기'}</button><span class="note">상권 1곳당 약 10초 (25번 검색)</span></div>
    ${progHtml()}
    ${DB.bench?`<div class="note" style="margin-top:6px">${DB.bench.at} 기준 · ${br.length}곳 측정${DB.bench.points.length-br.length?` · ${DB.bench.points.length-br.length}곳 실패`:''}</div>
    <details style="margin-top:6px"><summary class="note">기준 상권 점수 보기</summary><table><tbody>${DB.bench.points.map(b=>{ if(!b.m||b.m.v!==2) return `<tr><td>${esc(b.name)}</td><td class="note">${esc(b.err||'')}</td></tr>`; const e=evalD(derive(b.m)); return `<tr><td>${esc(b.name)}<div class="note">${esc(b.place||'')}</div></td><td class="num"><span class="gr g${gradeOf(e.total)}">${gradeOf(e.total)}</span> ${e.total??'-'}</td></tr>`; }).join('')}</tbody></table></details>`:''}</div>
  <div class="card"><div class="sh"><h2>영역 비중</h2></div><div class="note">영역별 중요도. 합이 100이 아니어도 비율로 계산해요. 바꾸면 저장된 후보지 점수도 바로 다시 계산돼요.</div>
    <div class="grid2" style="margin-top:8px">${DIMS.map(i=>`<label>${esc(i.t)}<input type="number" data-w="${i.k}" value="${esc(DB.weights[i.k])}" min="0" max="100"></label>`).join('')}</div>
    <button class="btn sm" data-act="wreset" style="margin-top:10px">처음 값으로</button></div>
  <div class="card"><div class="sh"><h2>손익분기 가정</h2></div><div class="note">모든 후보지의 손익분기 계산에 쓰여요. 우리 매장 실제 수치로 맞추면 정확해져요.</div>
    <div class="grid2" style="margin-top:8px">${[['cost','원가율(%)'],['labor','인건비 비율(%)'],['var','기타 변동비(%) 카드수수료·소모품'],['other','월세 외 고정비(만원/월) 관리비·공과금'],['ticket','객단가(만원)'],['days','월 영업일'],['interior','인테리어 평당(만원)'],['party','한 테이블 평균 일행(명)'],['pyPerTable','테이블 1개당 평수 (추정용)']].map(([k,l])=>`<label>${l}<input type="number" data-fin="${k}" value="${esc(DB.fin[k])}" min="0" step="any"></label>`).join('')}</div>
    <button class="btn sm" data-act="finreset" style="margin-top:10px">처음 값으로</button></div>
  <div class="card"><div class="sh"><h2>백업</h2></div><div class="note">기록은 이 컴퓨터 브라우저에만 있어요. 다른 컴퓨터로 옮기거나 지워질 때를 대비해 가끔 파일로 받아 두세요.</div>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="export">백업 파일 받기</button><label class="btn">백업 불러오기<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>`;
}

/* ---------------- 지도 ---------------- */
let MAP=null, OVL=[];
function mk(p,label,color,dot,title){
  const el=document.createElement('div'); el.className='mk'+(dot?' dot':''); el.style.background=color; if(!dot) el.textContent=label; el.title=title||label;
  OVL.push(new kakao.maps.CustomOverlay({position:LL(p),content:el,yAnchor:1,map:MAP})); return el;
}
function circ(p,r,color,dash,fill){ OVL.push(new kakao.maps.Circle({center:LL(p),radius:r,strokeWeight:1.5,strokeColor:color,strokeOpacity:.85,strokeStyle:dash?'dashed':'solid',fillColor:color,fillOpacity:fill||0,map:MAP})); }
const lg=(c,t)=>`<span><i style="background:${c}"></i>${t}</span>`;
function drawMap(){
  if(!K) return;
  if(!MAP){ MAP=new kakao.maps.Map($('#map'),{center:new kakao.maps.LatLng(35.8714,128.6014),level:8});
    kakao.maps.event.addListener(MAP,'click',e=>{ if(!PICK) return; PICK=false; const ll=e.latLng; addCand({name:'지도에서 고른 곳',addr:'',x:ll.getLng(),y:ll.getLat()},true); }); }
  OVL.forEach(o=>o.setMap(null)); OVL=[];
  DB.stores.filter(s=>s.x).forEach(s=>{ mk(s,s.name,'#14524a',false,'우리 매장 · '+s.name); circ(s,(+DB.zoneKm||2)*1000,'#14524a',true,0.03); });
  const c=TAB==='detail'&&DB.cands.find(x=>x.id===CUR); let L='';
  if(c){
    if(c.m&&c.m.v===2){ circ(c,300,'#c0392b',true,0.06); circ(c,500,'#c0392b',true,0); circ(c,1000,'#c0392b',false,0.03);
      (c.m.comp||[]).forEach(p=>mk(p,'','#222',true,p.name+' · '+fmtM(p.dist)));
      (c.m.subway||[]).forEach(p=>mk(p,'역','#2b6cb0',false,p.name+' · '+fmtM(p.dist))); }
    mk(c,'후보지','#c0392b',false,c.name); MAP.setLevel(5); MAP.setCenter(LL(c));
    L=lg('#c0392b','후보지 (원 = 300·500m·1km)')+lg('#222','장어집')+lg('#2b6cb0','지하철')+lg('#14524a','우리 매장 (점선 = 영업지역)');
  }else{
    const list=TAB==='cmp'?DB.cands.filter(x=>SEL.has(x.id)):DB.cands;
    list.forEach(x=>{ const s=x.m?scoreOf(x.m,x):null, F=finalOf(x,s); const el=mk(x,(F.grade?F.grade+' ':'')+x.name,F.grade?GC[F.grade]:'#777',false,x.addr); el.style.cursor='pointer'; el.addEventListener('click',()=>go('detail',x.id)); });
    if(TAB==='set'&&DB.bench) DB.bench.points.filter(b=>b.m).forEach(b=>mk(b,'','#b88a2a',true,'기준 · '+b.name));
    L=TAB==='set'?lg('#b88a2a','대구 기준 상권')+lg('#14524a','우리 매장'):lg(GC.A,'A')+lg(GC.B,'B')+lg(GC.C,'C')+lg(GC.D,'D')+lg('#14524a','우리 매장');
  }
  $('#legend').innerHTML=L;
  setTimeout(()=>MAP.relayout(),0);
}

/* ---------------- 동작 ---------------- */
// 입력 칸은 그대로 두고 점수·결론·평가 카드만 새로 그림 (입력 중 포커스를 잃지 않게)
let softT=null;
function softRender(){
  if(TAB!=='detail') return;
  const c=DB.cands.find(x=>x.id===CUR); if(!c) return;
  const tmp=document.createElement('div'); tmp.innerHTML=detailHtml();
  ['rcard','s-diag','s-eval','s-items','s-comp','s-todo'].forEach(id=>{ const a=document.getElementById(id), b=tmp.querySelector('#'+id); if(a&&b) a.replaceWith(b); });
  const fr=$('#finres'); if(fr) fr.innerHTML=finRes(c);
  const tb=$('[data-f=tables]'); if(tb) tb.placeholder=c.area?'비우면 '+Math.max(1,Math.round(c.area/(+DB.fin.pyPerTable||3.3)))+'개로 추정':'모르면 비움';
}
async function find(){
  const q=$('#q').value.trim(); if(q.length<2) return toast('주소나 장소를 두 글자 이상 넣어 주세요');
  if(!K) return toast('카카오 지도가 아직 안 열렸어요');
  try{ CANDS=await geocode(q); if(!CANDS.length) toast('찾지 못했어요. "대구 ○○구 ○○동" 처럼 넣어 보세요'); else if(CANDS.length===1) return addCand(CANDS[0]); render(); }
  catch(e){ toast(e.message); }
}
function addCand(p,fromMap){
  const c={id:uid(),name:p.name,addr:p.addr||p.name,x:p.x,y:p.y,status:'검토 중',created:today()};
  DB.cands.push(c); save(); CANDS=[]; go('detail',c.id); analyze(c.id);
  if(fromMap) setTimeout(async()=>{ try{ const r=await kcall(cb=>K.geo.coord2Address(c.x,c.y,cb)); const a=r.list[0]; if(a){ c.addr=(a.road_address&&a.road_address.address_name)||a.address.address_name; c.name=c.addr; save(); if(TAB==='detail'&&CUR===c.id) render(); } }catch(e){} },0);
}
async function analyze(id){
  const c=DB.cands.find(x=>x.id===id); if(!c||!K||busy) return;
  busy=true; render();
  try{
    const show=(n,t)=>{ const el=$('#anaProg'); if(!el) return; el.hidden=false; el.querySelector('span').textContent=`자료 모으는 중 ${n}/${t}`; el.querySelector('i').style.width=Math.round(n/t*100)+'%'; };
    show(0,STEPS); c.m=await measure(c,show); save();
  }catch(e){ toast(e.message); }
  finally{ busy=false; render(); }
  if(!benchOk()&&!benchBusy) toast('점수를 보려면 "대구 기준 상권 만들기"를 한 번 눌러 주세요');
}
function exportFile(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=`일품집-상권분석-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importFile(f){
  const r=new FileReader(); r.onload=()=>{ try{ const j=migrate(JSON.parse(r.result)); if(!j) throw 0;
    if(!confirm(`백업의 후보지 ${j.cands.length}곳으로 바꿀까요? 지금 이 브라우저의 기록은 덮어써져요`)) return;
    DB=j; _bc=null; save(); render(); toast('불러왔어요'); }catch(e){ toast('일품집 상권분석 백업 파일이 아니에요'); } }; r.readAsText(f);
}
document.addEventListener('click',async e=>{
  const nb=e.target.closest('#nav button'); if(nb) return go(nb.dataset.tab);
  if(e.target.matches('[data-sel]')){ const id=e.target.dataset.sel; e.target.checked?SEL.add(id):SEL.delete(id); const b=$('[data-act=cmpSel]'); if(b){ b.disabled=SEL.size<2; b.textContent=`선택 ${SEL.size}곳 비교`; } e.stopPropagation(); return; }
  const cc=e.target.closest('[data-open]'); if(cc&&!e.target.closest('input')) return go('detail',cc.dataset.open);
  const t=e.target.closest('button,[data-act]'); if(!t) return;
  if(t.dataset.cand!=null) return addCand(CANDS[+t.dataset.cand]);
  if(t.dataset.sc!=null){ const p=window._sc[+t.dataset.sc]; DB.stores.push({name:window._scName,addr:p.addr,x:p.x,y:p.y}); save(); render(); return; }
  if(t.dataset.fs){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c.field=c.field||{}; const v=+t.dataset.v; c.field[t.dataset.fs]=c.field[t.dataset.fs]===v?0:v; save(); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.sdel!=null){ if(confirm('이 매장을 지울까요?')){ DB.stores.splice(+t.dataset.sdel,1); save(); render(); } return; }
  const a=t.dataset.act;
  if(a==='find') return find();
  if(a==='pick'){ PICK=!PICK; render(); if(PICK) toast('지도에서 후보지 위치를 누르세요'); return; }
  if(a==='bench') return buildBench();
  if(a==='cmpSel') return go('cmp');
  if(a==='redo') return analyze(CUR);
  if(a==='print') return window.print();
  if(a==='del'){ const c=DB.cands.find(x=>x.id===CUR); if(c&&confirm(`"${c.name}" 후보지를 지울까요?`)){ DB.cands=DB.cands.filter(x=>x.id!==CUR); SEL.delete(CUR); save(); go('list',null); } return; }
  if(a==='sadd'){ const n=$('#sname').value.trim(), q=$('#saddr').value.trim(); if(!n||q.length<2) return toast('매장 이름과 주소를 넣어 주세요'); if(!K) return;
    try{ const L=await geocode(q); if(!L.length) return toast('주소를 찾지 못했어요');
      if(L.length===1){ DB.stores.push({name:n,addr:L[0].addr,x:L[0].x,y:L[0].y}); save(); render(); return; }
      window._sc=L; window._scName=n; $('#scands').innerHTML='<div class="note">어느 곳인가요?</div>'+L.map((p,i)=>`<button data-sc="${i}"><b>${esc(p.name)}</b><br><small>${esc(p.addr)}</small></button>`).join(''); }catch(err){ toast(err.message); } return; }
  if(a==='wreset'){ DB.weights=defW(); save(); render(); return; }
  if(a==='finreset'){ DB.fin=defFin(); save(); render(); return; }
  if(a==='export') return exportFile();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f; if(f){ const c=DB.cands.find(x=>x.id===CUR); if(!c) return; c[f]=e.target.type==='number'?(e.target.value===''?'':+e.target.value):e.target.value; save(); if(['rent','area','premium','target','tables'].includes(f)){ clearTimeout(softT); softT=setTimeout(softRender,250); } return; }
  const fk=e.target.dataset.fin; if(fk){ DB.fin[fk]=Math.max(0,+e.target.value||0); save(); return; }
  const w=e.target.dataset.w; if(w){ DB.weights[w]=Math.max(0,+e.target.value||0); save(); return; }
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(e.target.dataset.f==='status'||e.target.dataset.w) return render();
  if(id==='filter'){ FILTER=e.target.value; render(); }
  if(id==='zone'){ DB.zoneKm=+e.target.value; save(); render(); }
  if(id==='benchNames'){ DB.benchNames=e.target.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,40); save(); }
  if(id==='imp'&&e.target.files[0]) importFile(e.target.files[0]);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='q'){ e.preventDefault(); find(); } });

load(); render();
$('#sdk').textContent='카카오 지도 여는 중…';
loadSdk().then(ok=>{
  $('#sdk').textContent=ok?'':'카카오 지도 연결 실패';
  if(!ok){ $('#map').innerHTML=`<div class="empty">카카오 지도를 열지 못했어요.<br>카카오 개발자 사이트(JavaScript 키 → 사이트 도메인)에 지금 열고 있는 주소 ${esc(location.origin)} 를 등록했는지, 카카오맵 사용 설정이 켜져 있는지 확인해 주세요.</div>`; }
  render();
});
</script>
