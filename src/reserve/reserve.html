<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일품집 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EF; --panel:#FFFFFF; --ink:#1E2622; --sub:#5E6B65; --line:#D5DCD8; --soft:#F4F6F5;
  --accent:#7A3E12; --accent-ink:#FFFFFF; --warn:#B3261E; --warn-bg:#FBE3E0; --ok:#2F6B3F; --ok-bg:#E1F0E4; --tight:#B36B00; --tight-bg:#FFF1D6;
  --res:#B3261E; --res-bg:#FFF1EF; --soon:#9A6A00; --soon-bg:#FFF8E6; --use:#2F6B3F; --use-bg:#E4F2E7; --past:#8A9690;
  --field:#FFFFFF; --field-line:#B9C4BE; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161A18; --panel:#1F2522; --ink:#E7ECE9; --sub:#9AA7A1; --line:#34403A; --soft:#252C29;
    --accent:#D98B4A; --accent-ink:#1A0F05; --warn:#FF8A80; --warn-bg:#3A1F1C; --ok:#7CC48E; --ok-bg:#1F3326; --tight:#E3A93E; --tight-bg:#3A2E14;
    --res:#FF8A80; --res-bg:#3A1F1C; --soon:#E7C15C; --soon-bg:#352D17; --use:#7CC48E; --use-bg:#1F3326; --past:#6E7A74;
    --field:#2B332F; --field-line:#4A5750; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=search],select,textarea{
  background:var(--field);color:var(--ink);border:1px solid var(--field-line);border-radius:7px;padding:7px 9px;font-size:15px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--sub);opacity:.8}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:none;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;font-size:18px}
.datenav{display:flex;align-items:center;gap:4px}
.datelabel{font-size:20px;font-weight:700;min-width:150px;text-align:center;font-variant-numeric:tabular-nums;border:0;background:none;padding:4px 6px;border-radius:6px}
.datelabel:hover{background:var(--soft)}
.datelabel .dw.sun{color:var(--warn)} .datelabel .dw.sat{color:#3C5A86}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.today{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--warn)}
.spacer{flex:1}
.sync{font-size:12px;color:var(--sub);padding:2px 8px;border-radius:99px}
.sync[data-kind="ok"]{color:var(--ok)}
.sync[data-kind="err"]{color:var(--warn);background:var(--warn-bg);font-weight:600}
.mtabs{display:none;gap:4px;padding:0 16px}
.mtabs button{border:0;background:none;padding:9px 14px;border-bottom:3px solid transparent;color:var(--sub);font-weight:600}
.mtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

body{min-width:1200px}
main{padding:12px 16px;display:grid;grid-template-columns:var(--lw,400px) 12px minmax(0,1fr);gap:0;height:calc(100vh - 62px)}
/* 목록 ↔ 현황 사이 너비 조절 */
.split{cursor:col-resize;position:relative;touch-action:none;outline:none;-webkit-user-select:none;user-select:none}
.split::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;border-radius:99px;background:var(--line);transition:background .12s,width .12s,margin .12s}
.split::after{content:"⋮";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--sub);font-size:16px;line-height:1;background:var(--bg);padding:8px 0;pointer-events:none}
.split:hover::before,.split:focus-visible::before,.split.on::before{background:var(--accent);width:6px;margin-left:-3px}
body.resizing{cursor:col-resize;-webkit-user-select:none;user-select:none}
body.resizing iframe{pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0;overflow:auto}
#boardPanel{display:flex;flex-direction:column}
.panel h2{font-size:16px;margin:0}

/* ----- 목록 ----- */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:9px;padding:6px 12px}
.stat .k{font-size:12px;color:var(--sub)} .stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:600}
.search{flex:1;min-width:120px}
.tgroup{margin-top:10px}
.quick{border:1.5px solid var(--accent);border-radius:10px;padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;gap:6px}
.qrow input{padding:7px 8px;min-width:0;flex:1 1 0}
#qTime{flex:0 0 86px} #qPP{flex:0 0 84px} #qPhone{flex:0 0 138px}
.qrow .btn{flex:none}
.qprev{font-size:13px;min-height:20px}
.qprev .bad{color:var(--warn);font-weight:600}
.thead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--sub);padding:2px 2px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.thead .t{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;border:0;background:none;padding:0 4px;border-radius:5px;font-weight:700;cursor:pointer}
.thead .t:hover{background:var(--soft);text-decoration:underline}
.rtime{border:1.5px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:6px;padding:0 5px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;cursor:pointer}
.rtime:hover{background:var(--accent);color:var(--accent-ink)}
.res.done .rtime,.res.cxl .rtime{opacity:.5}
.thead.now .t{color:var(--accent)}
.res{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:start;padding:4px 2px;border-bottom:1px dashed var(--line)}
.res:last-child{border-bottom:0}
.res{cursor:pointer}
.res:hover{background:var(--soft);border-radius:8px}
.res .ck,.res .acts{cursor:auto}
.res .acts{display:flex;gap:4px}
.res .ck{width:18px;height:18px;margin-top:1px;accent-color:var(--ok);cursor:pointer}
.res .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.res .nm{font-weight:700;font-size:14px}
.res .pp{font-weight:600;font-variant-numeric:tabular-nums}
.tbl{display:inline-block;font-size:13px;font-weight:800;padding:0 7px;border-radius:6px;background:var(--ink);color:var(--panel);border:1px solid var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.tnote{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:6px;border:1px solid var(--line);background:var(--soft)}
.tnote.cx{background:var(--warn);color:#fff;border-color:var(--warn)}
.res.cxl .nm,.res.cxl .pp,.res.cxl .rq{text-decoration:line-through;color:var(--past)}
.res.cxl .tbl{opacity:.45}
.res.dup{background:var(--warn-bg);border-radius:8px;box-shadow:inset 4px 0 0 var(--warn)}
.res.dup .nm{color:var(--warn)}
.tbl.dupt{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 0 0 2px var(--warn-bg)}
.dupline{font-size:13.5px;font-weight:700;color:var(--warn);margin-top:2px}
.tightline{font-size:13.5px;font-weight:700;color:var(--tight);margin-top:2px}
.res.tight:not(.dup){background:var(--tight-bg);border-radius:8px;box-shadow:inset 4px 0 0 var(--tight)}
.res.tight:not(.dup) .nm{color:var(--tight)}
.tbl.tightt{background:var(--tight);border-color:var(--tight);color:#1A0F05;box-shadow:0 0 0 2px var(--tight-bg)}
.cell.st-dup{border:3px solid var(--warn);background:repeating-linear-gradient(135deg,var(--warn-bg) 0 10px,var(--panel) 10px 20px);justify-content:flex-start;padding-top:18px}
.cell.st-dup .no{color:var(--warn)}
.cell .dn{font-weight:700;font-size:14px;color:var(--warn);line-height:1.25}
.cell .dn small{font-weight:600;font-size:11.5px}
.cell .dupb{position:absolute;top:3px;left:4px;right:4px;font-size:11.5px;font-weight:800;background:var(--warn);color:#fff;border-radius:4px;padding:0 4px}
.cell .tightb{display:inline-block;font-size:10.5px;font-weight:800;background:var(--tight);color:#1A0F05;border-radius:4px;padding:0 5px;margin-top:1px;align-self:center}
.cell .memo{font-size:11px;font-weight:700;margin-top:2px;color:var(--ink);background:var(--soon-bg);border:1px solid var(--soon);border-radius:4px;padding:0 5px;align-self:center}
.freebox{border:2px solid #3C5A86;border-radius:10px;padding:8px 12px;margin-bottom:10px;background:var(--soft)}
.freebox .fh{font-weight:700;font-size:14px;margin-bottom:4px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px}
.frow .fk{min-width:84px;font-weight:700;font-size:14.5px}
.frow .fk b{font-size:18px;color:#3C5A86}
.frow .ff{font-size:12.5px;color:var(--sub);margin:0 2px 0 8px}
.frow .ff:first-of-type{margin-left:0}
.fchip{border:1.5px solid #3C5A86;background:var(--panel);color:var(--ink);border-radius:7px;padding:2px 10px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.fchip:hover{background:#3C5A86;color:#fff}
.fnone{color:var(--warn);font-weight:700;font-size:14px}
.dupbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-left:5px solid var(--warn);border-radius:9px;padding:7px 10px;margin-bottom:10px}
.tightbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--tight-bg);border:1px solid color-mix(in srgb,var(--tight) 35%,transparent);border-left:5px solid var(--tight);border-radius:9px;padding:7px 10px;margin-bottom:10px;cursor:pointer}
.tightbar .th{color:var(--tight);font-weight:800;font-size:14px;margin-right:4px}
.tightbar .th small{font-weight:600;color:var(--sub)}
.tchip{border:1px solid color-mix(in srgb,var(--tight) 40%,transparent);background:var(--panel);color:var(--ink);border-radius:7px;padding:3px 9px;font-size:13.5px;font-weight:600}
.tchip:hover{border-color:var(--tight)}
.tchip b{color:var(--tight);font-weight:800;margin-right:3px}
.dupbar{cursor:pointer}
.dupbar .dh{color:var(--warn);font-weight:800;font-size:14px;margin-right:4px}
.dupbar .dh small{font-weight:600;color:var(--sub)}
.dchip{cursor:pointer}
.dchip{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:var(--panel);color:var(--ink);border-radius:7px;padding:3px 9px;font-size:13.5px;font-weight:600}
.dchip:hover{border-color:var(--warn)}
.dchip b{color:var(--warn);font-weight:800;margin-right:3px}
.dchip small{color:var(--sub);font-weight:500}
.pick{display:flex;flex-direction:column;gap:8px}
.pk1{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pk1.dupx{border-color:var(--warn);background:var(--warn-bg)}
.pk1 .l1{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.pk1 .t{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.pk1 .n{font-size:17px;font-weight:700}
.pk1 .sub{font-size:13px;color:var(--sub);margin-top:2px}
.tbl.none{color:var(--warn);border-color:var(--warn);background:var(--warn-bg);font-size:13px}
.res .rq{font-size:12px;color:var(--ink);margin-top:2px;background:var(--soon-bg);border-left:3px solid var(--soon);border-radius:4px;padding:1px 6px;display:inline-block;max-width:100%}
.res .ph{font-size:12px;color:var(--sub);text-decoration:none;font-variant-numeric:tabular-nums}
.res.done .nm,.res.done .pp,.res.done .rq{text-decoration:line-through;color:var(--past)}
.res.done .tbl{opacity:.55}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:4px}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:32px 10px;color:var(--sub)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ----- 현황판 ----- */
.cell.ed{cursor:pointer;position:relative;outline:2px dashed var(--accent);outline-offset:-2px}
.cell.ed.sel{outline:3px solid var(--ok);background:var(--soft)}
.cell.ed-blank{border-style:dashed;background:none;color:var(--sub);min-height:clamp(40px,6vh,70px)}
.cell.addc{border:2px dashed var(--line);background:none;color:var(--sub);font-size:22px;min-height:clamp(40px,6vh,70px);cursor:pointer}
.cell .x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0}
.ledbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--soon-bg);border:1.5px solid var(--soon);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.ledbar b{font-size:14px}
.lbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;margin-left:6px;font-weight:600}
.lbtn.bad{color:var(--warn)}
.btop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ftabs button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 22px;font-weight:700;font-size:16px}
.ftabs button[aria-pressed="true"]{border:2px solid #3C5A86;color:#3C5A86}
.timebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:var(--soft);border-radius:9px}
.timebox input[type=range]{flex:1;min-width:160px;accent-color:var(--accent);height:30px;cursor:grab}
.timebox input[type=range]:active{cursor:grabbing}
.timebox input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--line)}
.timebox input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-9px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tstep{font-size:17px;font-weight:700;padding:2px 12px;line-height:1.2}
.tnow{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
.twin{font-size:12.5px;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;font-weight:600}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:2px solid currentColor}
.lg-use{color:var(--use)} .lg-res{color:var(--res)} .lg-soon{color:var(--soon)}
.lg-tight{color:var(--tight);font-weight:700} .lg-past{color:var(--past)}
.floor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;flex:1}
.floor .grp{padding:0 16px;border-left:1px solid var(--line)}
.floor .grp:first-child{border-left:0;padding-left:0}
.floor .grp:last-child{padding-right:0}
.grp h3{font-size:13px;margin:0 0 6px;color:var(--sub);font-weight:600}
.grp h3::before{content:"●";color:#3C5A86;margin-right:5px;font-size:10px;vertical-align:1px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.cell{min-height:clamp(66px,10vh,128px);border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px;position:relative;cursor:pointer}
.cell.blank{visibility:hidden}
.cell .no{font-size:13.5px;font-weight:700;color:var(--sub)}
.cell .cn{font-weight:700;font-size:17px;line-height:1.2;word-break:keep-all}
.cell .ci{font-size:13px;font-variant-numeric:tabular-nums}
.cell.empty .no{font-size:17px;font-weight:500;color:var(--past)}
.cell.st-use{border:2px solid var(--use);background:var(--use-bg)}
.cell .arr{position:absolute;top:3px;left:4px;font-size:10.5px;font-weight:700;background:var(--use);color:var(--panel);border-radius:4px;padding:0 5px} .cell.st-use .cn,.cell.st-use .no{color:var(--use)}
.cell.st-res{border-color:var(--res);background:var(--res-bg)} .cell.st-res .cn,.cell.st-res .no{color:var(--res)}
.cell.st-soon{border:1.5px dashed var(--soon);background:var(--soon-bg)} .cell.st-soon .cn,.cell.st-soon .no{color:var(--soon)}
.cell.st-past{border-color:var(--past);background:var(--soft)} .cell.st-past .cn,.cell.st-past .no{color:var(--past)}
.cell .more{position:absolute;top:3px;right:4px;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--panel);border-radius:4px;padding:0 4px}
.cell .clash{position:absolute;bottom:3px;right:4px;font-size:10.5px;font-weight:700;background:var(--warn);color:#fff;border-radius:4px;padding:0 4px}
.bar29{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.barrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;max-width:66%}

/* ----- 창 ----- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(560px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:18px}
.dlg h3{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub)}
.fgrid .full{grid-column:1/-1}
.times{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.times button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 7px;font-size:13px;font-variant-numeric:tabular-nums}
.times button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picker{border:1px solid var(--line);border-radius:9px;padding:8px;max-height:220px;overflow:auto}
.picker h4{margin:6px 0 4px;font-size:12px;color:var(--sub)}
.picker h4:first-child{margin-top:0}
.pk{display:flex;flex-wrap:wrap;gap:4px}
.pk button{min-width:40px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 6px;font-size:13px;font-weight:600}
.pk button.busy{border-color:var(--res);color:var(--res);background:var(--res-bg)}
.pk button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--sub)}
.warnline{font-size:13px;color:var(--warn);font-weight:600}
.dfoot{display:flex;gap:8px;margin-top:14px;align-items:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.toast:has(.tbtn){pointer-events:auto;display:flex;align-items:center;gap:10px}
.toast .tbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:5px 10px;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* 검색 */
.gsearch{position:relative}
.gsearch input{width:300px;padding-left:32px}
.gsearch::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-52%);color:var(--sub);font-size:17px;pointer-events:none}

<body>
<header>
  <div class="bar">
    <div class="brand">일품집 예약</div>
    <div class="datenav">
      <button class="btn" id="prevD" aria-label="이전 날">‹</button>
      <button class="datelabel" id="dateLbl" title="날짜 고르기"></button>

    <div class="gsearch"><input type="search" id="gq" placeholder="전체 예약 검색 (이름·전화번호·테이블)" autocomplete="off" aria-label="예약 검색">
      <div class="gres" id="gres" hidden></div></div>

</header>
<main id="main" data-view="list">
  <section class="panel" id="listPanel"></section>
  <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="목록과 현황 사이 너비 조절 (끌거나 좌우 화살표, 더블클릭하면 원래대로)" tabindex="0" title="끌어서 너비 조절 · 더블클릭하면 원래대로"></div>
  <section class="panel" id="boardPanel"></section>
</main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================== Supabase 연결 (새 서버 · 로그인 필요 · 매장별로 나뉨) ================== */
const SUPABASE_URL = 'https://bdqcrbnbuoujozlpttbe.supabase.co';
const SUPABASE_KEY = '/*NEWKEY*/';
/* ========================================================================== */
const CONF_KEY='ilpum-fr-conf';
let SID='', STORES=[], REST='';          // REST: 로그인·매장 확인이 끝나면 켜짐
const RP=()=>`/rest/v1/res_days?store_id=eq.${SID}&`;
const readConf=()=>{ try{ return JSON.parse(localStorage.getItem(CONF_KEY))||{}; }catch(e){ return {}; } };
const readSes=()=>{ const c=readConf(); if(c.ses) return c.ses; try{ const t=sessionStorage.getItem('fr-ses'); if(t) return JSON.parse(t); }catch(e){} return null; };
const writeSes=j=>{ try{ const c=readConf(); if(c.ses){ c.ses=j; localStorage.setItem(CONF_KEY,JSON.stringify(c)); } else sessionStorage.setItem('fr-ses',JSON.stringify(j)); }catch(e){} };
// 로그인 토큰: 다른 화면(근무표·통합 틀)과 같은 저장소를 쓰고, 갱신은 한 번에 한 화면만 함
async function freshToken(force){
  const run=async()=>{ const s=readSes(); if(!s) return null;
    if(!force && (s.expires_at||0)*1000>Date.now()+60000) return s.access_token;
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    const j=await r.json().catch(()=>({})); if(!r.ok||!j.access_token) return null; writeSes(j); return j.access_token; };
  return navigator.locks?navigator.locks.request('ilpum-refresh',run):run();
}
async function fx(path,opt,retry=true){
  opt=opt||{}; const tok=await freshToken(false); if(!tok) throw Object.assign(new Error('로그인이 필요해요'),{auth:true});
  const r=await fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});
  if(r.status===401&&retry){ const t2=await freshToken(true); if(t2) return fx(path,opt,false); }
  return r;
}
const WIN = 120;
let followNow=true;   // 현황판: 기준 시간 앞뒤 2시간

/* ---------- 테이블 배치 (지금 현황판과 같은 모양) ---------- */
const R = (a,b)=>`R${a}-${b}`;
let FLOORS = [
  { key:'1', name:'1층', groups:[
      {title:'1 — 10번',  cols:[[5,4,3,2,1],[10,9,8,7,6]]},
      {title:'11 — 19번', cols:[[15,14,13,12,11],[19,18,17,16]]},
      {title:'20 — 28번', cols:[[23,22,21,20],[28,27,26,25,24]]} ],
    bar:{title:'바 · 29 — 34번', row:[29,30,31,32,33,34]} },
  { key:'2', name:'2층 · 룸', groups:[
      {title:'35 — 45번', cols:[[41,40,39,38,37,36],[45,44,43,42,null,35]]},
      {title:'46 — 53번', cols:[[49,48,47,46],[53,52,51,50]]},
      {title:'룸', cols:[[R(1,1),R(1,2),R(2,1),R(2,2),R(3,1),R(3,2)],[R(4,1),R(4,2),R(4,3),R(4,4)]]} ] }
];
const tablesOf=F=>{ const out=[]; F.forEach(f=>{ f.groups.forEach(g=>g.cols.flat().forEach(t=>t!=null&&out.push(String(t)))); if(f.bar) f.bar.row.forEach(t=>out.push(String(t))); }); return out; };
let ALL_TABLES = tablesOf(FLOORS);
const DEFAULT_FLOORS = JSON.parse(JSON.stringify(FLOORS));
const tLabel = t=> /^R/.test(t)? '룸'+t.slice(1) : t;
const ROOM_SUBS={1:[1,2],2:[1,2],3:[1,2],4:[1,2,3,4]};
// "33 34" → 33,34번 / "r1,2" → 룸1·룸2 전체 / "r4-1,2" → 룸4-1·4-2 / "r4" → 룸4 전체 / "R3-1, R3-2"(시트 표기)도 인식
function parseTables(s){
  const out=[];
  String(s||'').replace(/룸/g,'r').split(/\s+/).forEach(group=>{
    let mode='table', room=null;
    group.split(/[,/·]+/).forEach(tok=>{
      tok=tok.trim(); if(!tok) return;
      let m=tok.match(/^r\s*(\d)(?:\s*-\s*(\d))?$/i);
      if(m){ const r=+m[1]; if(!ROOM_SUBS[r]) return;
        if(m[2]){ if(ROOM_SUBS[r].includes(+m[2])) out.push(R(r,+m[2])); mode='sub'; room=r; }
        else { ROOM_SUBS[r].forEach(x=>out.push(R(r,x))); mode='room'; }
        return; }
      m=tok.match(/^(\d{1,2})\s*(?:T|번)?$/i); if(!m) return; const n=+m[1];
      if(mode==='room' && ROOM_SUBS[n]){ ROOM_SUBS[n].forEach(x=>out.push(R(n,x))); return; }
      if(mode==='sub' && ROOM_SUBS[room].includes(n)){ out.push(R(room,n)); return; }
      if(n>0 && n<=99){ out.push(String(n)); mode='table'; }
    });
  });
  return [...new Set(out)];
}
// 표시용: 룸 전체면 "룸4", 일부면 "룸4-1·2"
function tablesText(ts){
  ts=ts||[]; const nums=ts.filter(t=>!/^R/.test(t)).sort((a,b)=>a-b); const rooms={};
  ts.filter(t=>/^R/.test(t)).forEach(t=>{ const [r,x]=t.slice(1).split('-').map(Number); (rooms[r]=rooms[r]||[]).push(x); });
  const rs=Object.keys(rooms).sort().map(r=>{ const xs=rooms[r].sort(); return xs.length===ROOM_SUBS[r].length? `룸${r}` : `룸${r}-${xs.join('·')}`; });
  return [...nums,...rs];
}
// 표시용 → 다시 입력칸에 넣을 때 쓰는 짧은 표기
function tablesInput(ts){
  return tablesText(ts).map(x=>x.replace(/^룸(\d)$/,'r$1').replace(/^룸(\d)-(.+)$/,(m,r,xs)=>`r${r}-${xs.replace(/·/g,',')}`)).join(' ');
}
function normTime(v){
  const s=String(v||'').trim(); if(!s) return '';
  let m=s.match(/^(\d{1,2})\s*[:시.]\s*(\d{1,2})?\s*분?$/) || s.match(/^(\d{1,2})$/);
  let h,mi;
  if(m){ h=+m[1]; mi=+(m[2]||0); }
  else { m=s.match(/^(\d{3,4})$/); if(!m) return ''; h=+s.slice(0,-2); mi=+s.slice(-2); }
  if(h>23||mi>59) return ''; return `${pad(h)}:${pad(mi)}`;
}
function fmtPhone(v){
  const d=String(v||'').replace(/\D/g,''); if(!d) return String(v||'').trim();
  if(d.startsWith('02')){ if(d.length===9) return `02-${d.slice(2,5)}-${d.slice(5)}`; if(d.length===10) return `02-${d.slice(2,6)}-${d.slice(6)}`; }
  if(d.length===11) return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if(d.length===10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
  if(d.length===8) return `${d.slice(0,4)}-${d.slice(4)}`;
  if(d.length===7) return `${d.slice(0,3)}-${d.slice(3)}`;
  return d;
}

/* ---------- 공통 ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DOW=['일','월','화','수','목','금','토'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toMin=t=>{ const m=String(t||'').match(/(\d{1,2}):(\d{2})/); return m? (+m[1])*60+(+m[2]) : null; };
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const people=s=>String(s||'').split(/[+,]/).reduce((a,x)=>a+(parseInt(x,10)||0),0);
const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const todayStr=()=>ds(new Date());

/* ---------- 상태 ---------- */
const ui={ date:todayStr(), filter:'all', q:'', floor:'1', t:Math.max(600,Math.min(1320, Math.round(nowMin()/30)*30)), view:'list' };
const days={};   // date → {items:[], rev}
function dayDoc(d){ if(!days[d]){ let c=null; try{ c=JSON.parse(localStorage.getItem('ilpum-res-'+SID+'-'+d)||'null'); }catch(e){} days[d]=c||{items:[],rev:0}; } return days[d]; }
function items(d){ return dayDoc(d).items.filter(x=>!x.deleted); }
// 테이블 칸에 쓴 글자 중 테이블이 아닌 것(예: 네이버 취소, 전화취소)은 메모로 남김
function tableNote(s){ return String(s||'').split(/\s+/).filter(g=>g && !parseTables(g).length && !/^(T|번)$/i.test(g)).join(' '); }
const isCxl=x=>/취소/.test(x.tnote||'');
function active(d){ return items(d).filter(x=>!isCxl(x)); }   // 현황판·중복 계산용 (취소 제외)
function tableShow(x){ const ts=tablesText(x.tables); return [...ts, ...(x.tnote?[x.tnote]:[])].join(', '); }
function cacheDay(d){ try{ localStorage.setItem('ilpum-res-'+SID+'-'+d, JSON.stringify(days[d])); }catch(e){} }

/* ---------- 동기화: 날짜별 한 줄, 예약마다 수정 시각으로 합치기 ---------- */
function mergeItems(a,b){
  const map={}; [...a,...b].forEach(x=>{ const o=map[x.id]; if(!o || (x.u||0)>(o.u||0)) map[x.id]=x; });
  return Object.values(map);
}
function canon(v){ return Array.isArray(v)? '['+v.map(canon).join(',')+']' : (v&&typeof v==='object')? '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}' : JSON.stringify(v); }
const same=(a,b)=>canon([...a].sort((x,y)=>x.id<y.id?-1:1))===canon([...b].sort((x,y)=>x.id<y.id?-1:1));
function setSync(t,k){ const el=document.getElementById('sync'); el.textContent=t; el.dataset.kind=k||''; }
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]); }
async function fetchDay(d){
  const r=await withTimeout(fx(`${RP()}id=eq.${d}&select=data,rev`),10000);
  if(!r.ok) throw new Error('HTTP '+r.status); const rows=await r.json(); return rows[0]||null;
}
const pushing={}, dirty={}, fails={}, needRetry={};    // dirty: 저장 중에 또 고침 / needRetry: 저장 실패(천천히 다시 시도)
async function pushDay(d){
  if(!REST) return;
  if(pushing[d]){ dirty[d]=true; return; }
  pushing[d]=true; setSync('저장 중…');
  try{
    for(let tries=0; tries<4; tries++){
      const doc=dayDoc(d); const cur=await fetchDay(d);
      let merged=doc.items, base=0;
      if(cur){ merged=mergeItems(cur.data.items||[], doc.items); base=cur.rev||0; }
      const rev=base+1; const body={data:{items:merged}, rev, updated_at:new Date().toISOString()};
      let r;
      if(cur) r=await withTimeout(fx(`${RP()}id=eq.${d}&rev=eq.${base}&select=rev`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)}),10000);
      else r=await withTimeout(fx(`/rest/v1/res_days?select=rev`,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({store_id:SID,id:d,...body})}),10000);
      if(r.status===409){ continue; }                 // 동시에 처음 만든 경우 → 다시
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows=await r.json(); if(!rows.length) continue;   // 그사이 다른 사람이 저장 → 합쳐서 다시
      doc.items=merged; doc.rev=rev; cacheDay(d); fails[d]=0; needRetry[d]=false;
      const t=new Date(); setSync(`저장됨 ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`,'ok');
      if(d===ui.date) render();
      break;
    }
  }catch(e){ const n=fails[d]=(fails[d]||0)+1; needRetry[d]=true;     // 실패하면 점점 천천히 다시 시도 (서버를 계속 두드리지 않도록)
    if(e.auth||/HTTP 40[13]/.test(e.message)) setSync('로그인이 필요해요 — 통합관리에서 다시 로그인한 뒤 새로고침하세요','err');
    else if(n>=8) setSync(`저장 실패(${e.message}) — 여기를 눌러 다시 시도`,'err');
    else { setSync(`저장 실패(${e.message}) — 잠시 뒤 다시 시도`,'err'); setTimeout(()=>pushDay(d),Math.min(300000,5000*2**(n-1))); } }
  pushing[d]=false;
  if(dirty[d]){ dirty[d]=false; pushDay(d); }
}
async function fetchRev(d){
  const r=await withTimeout(fx(`${RP()}id=eq.${d}&select=rev`),10000);
  if(!r.ok) throw new Error('HTTP '+r.status); const rows=await r.json(); return rows[0]? (rows[0].rev||0) : null;
}
let pullFails=0, pullNextAt=0;
async function pullDay(d){
  if(!REST || pushing[d]) return;
  try{
    const doc=dayDoc(d);
    const rv=await fetchRev(d);
    if(rv!==null && rv===doc.rev){ if(!document.getElementById('sync').dataset.kind) setSync('연결됨','ok'); return; }
    if(rv===null && !doc.items.length){ if(!document.getElementById('sync').dataset.kind) setSync('연결됨','ok'); return; }
    const cur=rv===null? null : await fetchDay(d);
    if(cur && (cur.rev||0)!==doc.rev){
      const merged=mergeItems(doc.items, cur.data.items||[]);
      const changed=!same(merged, doc.items);
      const needPush=!same(merged, cur.data.items||[]);
      doc.items=merged; doc.rev=cur.rev; cacheDay(d);
      if(changed && d===ui.date && !document.getElementById('dlg').open) render();
      if(needPush) pushDay(d);
    } else if(!cur && doc.items.length){ pushDay(d); }
    if(!document.getElementById('sync').dataset.kind) setSync('연결됨','ok');
    pullFails=0;
  }catch(e){ pullFails++; pullNextAt=Date.now()+Math.min(300000,30000*2**pullFails); setSync(e.auth||/HTTP 40[13]/.test(e.message)? '로그인이 필요해요 — 통합관리에서 다시 로그인한 뒤 새로고침하세요' : `연결 실패(${e.message})`,'err'); }
}
function saveItem(d,item){ item.u=Date.now(); const doc=dayDoc(d); const i=doc.items.findIndex(x=>x.id===item.id); if(i>=0) doc.items[i]=item; else doc.items.push(item); cacheDay(d); render(); pushDay(d); }

/* ---------- 현황판 상태 계산 ---------- */
function stateOf(it,T){
  const m=toMin(it.time); if(m==null) return null;
  const diff=T-m;                        // 양수 = 예약시간 지남
  if(it.done) return (diff>=-WIN && diff<=180) ? 'use' : null;   // 도착: 예약 2시간 전 ~ 3시간 후까지 표시
  if(diff>=0 && diff<=WIN) return 'res';
  if(diff<0 && -diff<=WIN) return 'soon';
  return null;
}
function boardMap(T){
  const map={};
  active(ui.date).forEach(it=>{ const st=stateOf(it,T); if(!st) return;
    (it.tables||[]).forEach(t=>{ (map[t]=map[t]||[]).push({it,st,diff:Math.abs(T-toMin(it.time))}); }); });
  Object.values(map).forEach(a=>a.sort((x,y)=>{ const pri={use:0,res:1,soon:2}; return (pri[x.st]-pri[y.st])||(x.diff-y.diff); }));
  return map;
}
function dayConflicts(date){   // 테이블 → 서로 겹치는 예약들 / 예약 id → 겹치는 상대 설명
  const byT={}; active(date).forEach(x=>{ if(toMin(x.time)==null) return; (x.tables||[]).forEach(t=>(byT[t]=byT[t]||[]).push(x)); });
  const table={}, who={};
  Object.keys(byT).forEach(t=>{ const a=byT[t];
    for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++){
      if(Math.abs(toMin(a[i].time)-toMin(a[j].time))<WIN){
        const s=table[t]=table[t]||new Map(); s.set(a[i].id,a[i]); s.set(a[j].id,a[j]);
        (who[a[i].id]=who[a[i].id]||[]).push(`${tLabel(t)}: ${a[j].name} ${a[j].time}`);
        (who[a[j].id]=who[a[j].id]||[]).push(`${tLabel(t)}: ${a[i].name} ${a[i].time}`);
      } } });
  const tabs={}; Object.keys(table).forEach(t=>table[t].forEach((x,id)=>(tabs[id]=tabs[id]||new Set()).add(t)));
  return {table,who,tabs};
}
function dayTight(date){   // 테이블 → 딱 2시간~2시간30분 간격(겹침은 아니지만 여유 없음)인 예약들
  const TIGHT_MAX = WIN+30;   // 2시간30분까지를 "임박"으로 봄
  const byT={}; active(date).forEach(x=>{ if(toMin(x.time)==null) return; (x.tables||[]).forEach(t=>(byT[t]=byT[t]||[]).push(x)); });
  const table={}, who={};
  Object.keys(byT).forEach(t=>{ const a=byT[t];
    for(let i=0;i<a.length;i++) for(let j=i+1;j<a.length;j++){
      const d=Math.abs(toMin(a[i].time)-toMin(a[j].time));
      if(d>=WIN && d<=TIGHT_MAX){
        const s=table[t]=table[t]||new Map(); s.set(a[i].id,a[i]); s.set(a[j].id,a[j]);
        (who[a[i].id]=who[a[i].id]||[]).push(`${tLabel(t)}: ${a[j].name} ${a[j].time}`);
        (who[a[j].id]=who[a[j].id]||[]).push(`${tLabel(t)}: ${a[i].name} ${a[i].time}`);
      } } });
  const tabs={}; Object.keys(table).forEach(t=>table[t].forEach((x,id)=>(tabs[id]=tabs[id]||new Set()).add(t)));
  return {table,who,tabs};
}
let CONF={table:{},who:{},tabs:{}};
let TIGHT={table:{},who:{},tabs:{}};
function clashes(list){ // 같은 테이블에 2시간 안에 겹치는 예약
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){ if(Math.abs(toMin(list[i].it.time)-toMin(list[j].it.time))<WIN) return true; }
  return false;
}

document.getElementById('boardPanel').addEventListener('click',async e=>{
  const b=e.target.closest('[data-led],[data-dp],[data-dp-end]'); if(!b) return;
  const act=b.dataset.led; if(!act && !layoutEdit) return;
  if(act==='start'){ if(!confirm('현황판 배치를 수정할까요?\n\n저장을 누르기 전에는 실제 배치가 바뀌지 않아요.')) return; layoutEdit={floors:cloneL(FLOORS)}; layoutSel=''; renderBoard(); return; }
  if(!layoutEdit) return;
  e.stopPropagation(); const F=layoutEdit.floors; const f=F.find(x=>x.key===ui.floor); const p=b.dataset.p;
  const redraw=()=>renderBoard();
  if(act==='tdel'){ const {arr,idx}=slotOf(F,p); arr.splice(idx,1); layoutSel=''; return redraw(); }
  if(act==='tadd'){
    if(layoutSel){ const src=slotOf(F,layoutSel); const v=src.arr[src.idx]; const dst=colOf(F,b.dataset.dpEnd||p); src.arr.splice(src.idx,1); dst.push(v); layoutSel=''; return redraw(); }
    const v=(prompt('추가할 테이블 번호 (1~99)')||'').trim(); if(!v) return; if(!/^\d{1,2}$/.test(v)||+v<1) return toast('1~99 사이 숫자로 넣어 주세요');
    if(tablesOf(F).includes(String(+v))) return toast(`${+v}번은 이미 있어요`); colOf(F,p).push(String(+v)); return redraw(); }
  if(b.dataset.dp!==undefined && !act){
    const q=b.dataset.dp; if(!layoutSel){ layoutSel=q; return redraw(); } if(layoutSel===q){ layoutSel=''; return redraw(); }
    const A=slotOf(F,layoutSel), B=slotOf(F,q); const t=A.arr[A.idx]; A.arr[A.idx]=B.arr[B.idx]; B.arr[B.idx]=t; layoutSel=''; return redraw(); }
  if(act==='gren'){ const [fi,gi]=p.split(',').map(Number); const v=(prompt('구역 이름',F[fi].groups[gi].title)||'').trim(); if(v){ F[fi].groups[gi].title=v; redraw(); } return; }
  if(act==='gdel'){ const [fi,gi]=p.split(',').map(Number); const g=F[fi].groups[gi]; const n=g.cols.flat().filter(t=>t!=null).length; if(!confirm(`‘${g.title}’ 구역과 안의 테이블 ${n}개를 지울까요?`)) return; F[fi].groups.splice(gi,1); layoutSel=''; return redraw(); }
  if(act==='gadd'){ const v=(prompt('새 구역 이름 (예: 창가석)')||'').trim(); if(v){ f.groups.push({title:v,cols:[[],[]]}); redraw(); } return; }
  if(act==='fadd'){ const v=(prompt('새 층 이름 (예: 3층)')||'').trim(); if(v){ const key=String(Math.max(0,...F.map(x=>+x.key||0))+1); F.push({key,name:v,groups:[{title:'구역 1',cols:[[],[]]}]}); ui.floor=key; redraw(); } return; }
  if(act==='fren'){ const v=(prompt('층 이름',f.name)||'').trim(); if(v){ f.name=v; redraw(); } return; }
  if(act==='fdel'){ if(F.length<2) return toast('층은 하나 이상 있어야 해요'); if(!confirm(`‘${f.name}’ 전체를 지울까요?`)) return; F.splice(F.indexOf(f),1); layoutSel=''; ui.floor=F[0].key; return redraw(); }
  if(act==='reset'){ if(!confirm('처음 배치(기본 배치)로 되돌릴까요?\n저장을 눌러야 반영돼요.')) return; layoutEdit.floors=cloneL(DEFAULT_FLOORS); layoutSel=''; ui.floor=layoutEdit.floors[0].key; return redraw(); }
  if(act==='cancel'){ if(!confirm('수정한 내용을 버리고 닫을까요?')) return; layoutEdit=null; layoutSel=''; return renderBoard(); }
  if(act==='save'){ const err=layoutError(F); if(err) return toast(err);
    try{ await saveLayout(F); FLOORS=cloneL(F); rebuildTables(); layoutEdit=null; layoutSel=''; render(); toast('배치를 저장했어요'); }catch(er){ toast('저장하지 못했어요: '+er.message); } return; }
},true);

function busyTables(date,time,exceptId){

  active(date).forEach(x=>{ if(x.id===exceptId) return; const xm=toMin(x.time); if(xm==null) return;

function tPrev(tables,tnote){

dlg.addEventListener('click',e=>{

  const b=e.target.closest('button'); if(!b) return; const d=b.dataset;

  if(d.tb){ readForm(); const i=draft.tables.indexOf(d.tb); if(i>=0) draft.tables.splice(i,1); else draft.tables.push(d.tb); drawForm(); return; }
  if(d.d==='close'){ dlg.close(); return; }

        toast(`${x.name||'예약'}을(를) 지웠어요`, '되돌리기', ()=>{ x.deleted=false; x.u=Date.now(); saveItem(dt,x); render(); toast('되돌렸어요'); });

let sbTimer=null;
function syncBoardFromInput(timeStr, tablesStr){
  clearTimeout(sbTimer);
  sbTimer=setTimeout(()=>{
    const digits=String(timeStr||'').replace(/\D/g,'');
    const t=normTime(timeStr); let moved=false;
    if(t && (digits.length>=3 || /[:시]/.test(timeStr))){ const m=Math.max(600,Math.min(1320,Math.round(toMin(t)/30)*30)); if(m!==ui.t){ ui.t=m; followNow=false; moved=true; } }
    const ts=parseTables(tablesStr);
    if(ts.length){ const f=FLOORS.find(fl=>[...fl.groups.flatMap(g=>g.cols.flat()),...(fl.bar?fl.bar.row:[])].map(String).includes(ts[0])); if(f&&f.key!==ui.floor){ ui.floor=f.key; moved=true; } }
    if(moved) renderBoard();
    document.querySelectorAll('.cell.hit').forEach(c=>c.classList.remove('hit'));
    ts.forEach(x=>document.querySelector(`.cell[data-cell="${x}"]`)?.classList.add('hit'));
  },250);
}

function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
function cellText(c){ const v=c&&c.value; if(v==null) return ''; if(v instanceof Date) return v; if(typeof v==='object'){ if(v.richText) return v.richText.map(t=>t.text).join(''); if(v.text!=null) return String(v.text); if(v.result!=null) return v.result; } return v; }
function toTime(v){
  if(v instanceof Date) return `${pad(v.getUTCHours())}:${pad(v.getUTCMinutes())}`;
  if(typeof v==='number'){ const m=Math.round((v%1)*1440); return fromMin(m); }
  const s=String(v||''); let m=s.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/); if(!m) return '';
  let h=+m[2]; if(m[1]==='오후'&&h<12) h+=12; if(m[1]==='오전'&&h===12) h=0; return `${pad(h)}:${m[3]}`;
}
function hashId(s){ let h=0; for(const c of s){ h=(h*31+c.charCodeAt(0))|0; } return 'imp'+(h>>>0).toString(36); }
document.getElementById('importIn').addEventListener('change',async e=>{

    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
    const ym=(f.name.match(/(\d{2,4})\s*년/)||[])[1]; let year= ym? (ym.length===2? 2000+(+ym) : +ym) : new Date().getFullYear();
    let total=0; const touched=[];

      const date=`${year}-${pad(+m[1])}-${pad(+m[2])}`; const doc=dayDoc(date); let n=0;
      ws.eachRow((row,ri)=>{ if(ri===1) return;
        const name=String(cellText(row.getCell(1))||'').trim();

        if(!name || /^합계\b/.test(name) || row.actualCellCount<=1) return;
        const time=toTime(cellText(row.getCell(3)));

        const norm=v=>String(v||'').trim().replace(/\s+/g,'');

        // 같은 날 같은 시간·이름의 예약이 이미 있으면(직접 입력했던 것 포함) 새로 만들지 않고 그 예약을 갱신
        const mi=doc.items.findIndex(x=>!x.deleted && x.time===time && norm(x.name)===norm(name));

        n++; });

async function dedupeAll(){
  if(!REST){ toast('Supabase 연결이 필요해요'); return; }
  const dnorm=v=>String(v||'').trim().replace(/\s+/g,'');
  toast('모든 날짜를 확인하는 중…');
  await loadAll(true);
  const dates=Object.keys(gServer).sort();
  let removed=0, touched=0;
  for(const d of dates){
    await pullDay(d);                         // 이 날짜를 최신 상태로 로컬에 받아옴
    const doc=dayDoc(d);
    const live=doc.items.filter(x=>!x.deleted);
    const seen=new Map(); const dups=[];
    live.forEach(x=>{
      const key=dnorm(x.name)+'|'+(x.time||'')+'|'+tablesText(x.tables||[]).join(',');
      const keep=seen.get(key);
      if(!keep){ seen.set(key,x); return; }
      if((x.u||0)>(keep.u||0)){ dups.push(keep); seen.set(key,x); } else dups.push(x);
    });
    if(dups.length){
      dups.forEach(x=>{ x.deleted=true; x.u=Date.now(); });
      cacheDay(d); await pushDay(d);
      removed+=dups.length; touched++;
    }
  }
  gAt=0;   // 검색용 캐시도 다시 받게
  if(dates.includes(ui.date)) render();
  toast(removed? `중복 ${removed}건을 ${touched}개 날짜에서 정리했어요` : '중복된 예약이 없었어요');
}

}

    });
    const buf=await wb.xlsx.writeBuffer();
    const name= kind==='month'? `일품집_예약_${ym}.xlsx` : `일품집_예약_${ui.date}.xlsx`;
    const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast(`${dates.length}일치 예약을 엑셀로 저장했어요`);
  }catch(e){ toast('엑셀을 만들지 못했어요: '+(e.message||'')); }
}

function printDay(from,to,fitOne){
  from=from??0; to=to??1440;
  const all=sortedDay(dayDoc(ui.date).items);
  const list=all.filter(x=>{ const m=toMin(x.time); return m==null? from===0 : (m>=from && m<=to); });
  const dd=new Date(ui.date+'T00:00');
  if(!list.length){ toast('그 시간대에 인쇄할 예약이 없어요'); return; }
  const rng = (from>0||to<1440)? ` <span style="font-size:.75em;font-weight:500">${fromMin(from)} ~ ${to>=1440?'마감':fromMin(to)}</span>` : '';
  const groups={}; list.forEach(x=>{ (groups[x.time||'-']=groups[x.time||'-']||[]).push(x); });
  const rows=Object.keys(groups).map(t=>groups[t].map((x,i)=>`<tr class="${x.done||isCxl(x)?'done':''} ${i===0?'first':''}"><td class="t">${i===0?esc(t):''}</td><td class="nm">${esc(x.name)}</td><td class="c">${esc(x.pp)}</td>
    <td class="c tb">${esc(tableShow(x)||'미정')}</td><td>${esc(x.req||'')}</td><td class="c">${x.done?'✓':'□'}</td></tr>`).join('')).join('');
  let root=document.getElementById('printRoot'); if(!root){ root=document.createElement('div'); root.id='printRoot'; document.body.appendChild(root); }
  root.innerHTML=`<style>
    @page{size:A4 portrait;margin:10mm}
    @media screen{#printRoot{position:absolute;left:-100000px;top:0}}
    @media print{body>*:not(#printRoot){display:none!important} #printRoot{display:block!important;position:static!important} html,body{background:#fff!important;min-width:0!important;margin:0!important}}
    #printRoot .pg{width:190mm;font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif;color:#000;font-size:var(--f,15px);line-height:1.3}
    #printRoot h1{font-size:1.5em;margin:0 0 .2em} #printRoot .sub{font-size:.85em;color:#444;margin-bottom:.6em}
    #printRoot table{width:100%;border-collapse:collapse;table-layout:fixed}
    #printRoot col.w1{width:4.2em} #printRoot col.w2{width:6.5em} #printRoot col.w3{width:4.4em} #printRoot col.w4{width:7em} #printRoot col.w6{width:3.2em}
    #printRoot th{background:#EEE;font-size:.85em;border:1px solid #888;padding:.35em .3em}
    #printRoot td{border:1px solid #bbb;padding:.3em .45em;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
    #printRoot tr.first td{border-top:1.5px solid #555}
    #printRoot .t{font-weight:700;text-align:center} #printRoot .nm{font-weight:700}
    #printRoot .c{text-align:center} #printRoot .tb{font-weight:700}
    #printRoot tr.done td{color:#777;text-decoration:line-through} #printRoot tr.done td:last-child{text-decoration:none}
    #printRoot tr{break-inside:avoid}
  </style><div class="pg">
  <h1>일품집 예약 — ${dd.getMonth()+1}월 ${dd.getDate()}일 (${DOW[dd.getDay()]})${rng}</h1>
  <div class="sub">전체 ${list.filter(x=>!isCxl(x)).length}팀 · ${list.filter(x=>!isCxl(x)).reduce((a,x)=>a+people(x.pp),0)}명 · 도착 ${list.filter(x=>x.done).length}팀${list.some(isCxl)?` · 취소 ${list.filter(isCxl).length}팀`:''} · 출력 ${fromMin(nowMin())}</div>
  <table><colgroup><col class="w1"><col class="w2"><col class="w3"><col class="w4"><col><col class="w6"></colgroup><thead><tr><th>시간</th><th>이름</th><th>인원</th><th>테이블</th><th>요청사항</th><th>도착</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  // A4 한 장(가로 190mm × 세로 275mm)에 들어가는 가장 큰 글씨 찾기
  const pg=root.querySelector('.pg'); const probe=document.createElement('div'); probe.style.cssText='position:absolute;height:275mm;width:1px;left:-100000px'; document.body.appendChild(probe);
  const maxH=probe.getBoundingClientRect().height; probe.remove();
  const MIN=13;              // 직원이 보기 편한 최소 글씨 (이보다 작아지면 장수를 늘림)
  let lo=5, hi=20;
  for(let i=0;i<14;i++){ const mid=(lo+hi)/2; pg.style.setProperty('--f',mid+'px'); if(pg.scrollHeight<=maxH) lo=mid; else hi=mid; }
  const f = fitOne? lo : Math.max(MIN, lo);
  pg.style.setProperty('--f',Math.floor(f*10)/10+'px');
  const pages=Math.max(1,Math.ceil(pg.scrollHeight/maxH));
  if(!fitOne && pages>1) toast(`예약이 많아 ${pages}장으로 나옵니다 (글씨 크기 유지)`);
  const cleanup=()=>{ const r=document.getElementById('printRoot'); if(r) r.remove(); window.removeEventListener('afterprint',cleanup); };
  window.addEventListener('afterprint',cleanup);
  window.print();
}

let tt; function toast(m, actLabel, actFn){
  const el=document.getElementById('toast');
  el.innerHTML = actLabel? `<span>${esc(m)}</span><button class="tbtn" id="toastAct">${esc(actLabel)}</button>` : esc(m);
  el.classList.add('on'); clearTimeout(tt);
  const dur = actLabel? 6000 : 2800;
  tt=setTimeout(()=>el.classList.remove('on'),dur);
  if(actLabel){ const b=document.getElementById('toastAct'); if(b) b.onclick=()=>{ el.classList.remove('on'); clearTimeout(tt); actFn&&actFn(); }; }
}

/* ---------- 시작 ---------- */
// 전체 예약은 검색할 때만 받아옴 (Supabase 무료 사용량 아끼기)
function onScreen(){ if(document.hidden) return false; try{ if(window.frameElement && window.frameElement.hidden) return false; }catch(e){} return true; }
function needLogin(msg){ setSync(msg,'err'); const m=document.getElementById('main'); if(m) m.insertAdjacentHTML('afterbegin',`<div class="card" style="margin:12px;padding:16px;grid-column:1/-1"><b>${msg}</b><div style="margin-top:6px;color:var(--sub,#666)">통합관리(index.html)에서 로그인하면 예약이 보여요.</div></div>`); }
async function resolveStore(){
  if(!readSes()){ needLogin('로그인이 필요해요'); return; }
  try{
    const r=await fx('/rest/v1/rpc/sch_my_stores',{method:'POST',body:'{}'}); if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{auth:r.status===401});
    STORES=(await r.json()).filter(x=>x.role);
    if(!STORES.length){ needLogin('연결된 매장이 없어요 — 본사에 계정 연결을 요청하세요'); return; }
    const want=readConf().sid; const st=STORES.find(x=>x.id===want)||STORES.find(x=>x.is_hq)||STORES[0];
    SID=st.id; REST='1'; showStore(st); await loadLayout();
  }catch(e){ if(e.auth) needLogin('로그인이 필요해요'); else setSync(`연결 실패(${e.message})`,'err'); }
}
function showStore(st){
  const sync=document.getElementById('sync'); if(!sync) return;
  const box=document.createElement('span'); box.id='storeBox'; box.style.cssText='font-weight:600;margin-right:8px';
  if(STORES.length>1){ box.innerHTML=`<select id="storeSel" aria-label="매장" style="font:inherit;padding:4px 6px">${STORES.map(x=>`<option value="${x.id}" ${x.id===SID?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`; }
  else box.textContent=st.name;
  sync.parentNode.insertBefore(box,sync);
  const sel=document.getElementById('storeSel'); if(sel) sel.onchange=()=>{ try{ const c=readConf(); c.sid=sel.value; localStorage.setItem(CONF_KEY,JSON.stringify(c)); }catch(e){} location.reload(); };
  // 다른 화면(근무표)에서 매장을 바꾸면 여기도 따라감
  window.addEventListener('storage',e=>{ if(e.key===CONF_KEY && readConf().sid && readConf().sid!==SID && STORES.some(x=>x.id===readConf().sid)) location.reload(); });
}
(async function boot(){
  await resolveStore();
  render();
  window.pullNow=()=>{ if(REST) pullDay(ui.date); };
  document.getElementById('sync').onclick=()=>{ if(document.getElementById('sync').dataset.kind!=='err') return; pullNextAt=0; Object.keys(needRetry).forEach(d=>{ if(needRetry[d]){ fails[d]=0; pushDay(d); } }); pullDay(ui.date); };
  if(REST){ pullDay(ui.date);
    setInterval(()=>{ if(onScreen() && Date.now()>=pullNextAt) pullDay(ui.date); },30000);     // 30초마다 번호만 확인 (화면에 보일 때만)
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Date.now()>=pullNextAt) pullDay(ui.date); }); }
})();
// 오늘 화면이면 1분마다 현황판 기준 시간을 지금으로 따라가기 (슬라이더를 직접 옮기면 멈춤)
document.getElementById('boardPanel').addEventListener('pointerdown',e=>{ if(e.target.id==='tRange') followNow=false; });
setInterval(()=>{ if(followNow && ui.date===todayStr()){ ui.t=Math.max(600,Math.min(1320,Math.round(nowMin()/10)*10)); if(!dlg.open) renderBoard(); } },60000);
</script>
<script>
/* 목록 ↔ 현황 너비 조절 (이 컴퓨터에 기억) */
(function(){
  const main=document.getElementById('main'), sp=document.getElementById('split'), KEY='ilpum-res-listw', DEF=400;
  const max=()=>Math.max(300,main.clientWidth-32-12-360);   // 현황 쪽은 최소 360px 남김
  const clamp=w=>Math.min(max(),Math.max(280,Math.round(w)));
  const apply=w=>{ w=clamp(w); main.style.setProperty('--lw',w+'px'); sp.setAttribute('aria-valuenow',w); return w; };
  let w0=DEF; try{ const v=+localStorage.getItem(KEY); if(v) w0=v; }catch(e){}
  apply(w0);
  const save=w=>{ try{ localStorage.setItem(KEY,String(w)); }catch(e){} };
  sp.addEventListener('pointerdown',e=>{
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('on'); document.body.classList.add('resizing');
    const left=main.getBoundingClientRect().left+16;
    const move=ev=>apply(ev.clientX-left-6);
    const up=ev=>{ sp.releasePointerCapture(e.pointerId); sp.removeEventListener('pointermove',move); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up);
      sp.classList.remove('on'); document.body.classList.remove('resizing'); save(apply(ev.clientX-left-6)); };
    sp.addEventListener('pointermove',move); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up);
  });
  sp.addEventListener('dblclick',()=>{ save(apply(DEF)); });
  sp.addEventListener('keydown',e=>{ if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return; e.preventDefault();
    const cur=document.getElementById('listPanel').getBoundingClientRect().width; save(apply(cur+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?60:20))); });
  window.addEventListener('resize',()=>apply(document.getElementById('listPanel').getBoundingClientRect().width));
})();
</script>
