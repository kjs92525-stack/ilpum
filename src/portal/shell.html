<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<title>일품집 통합관리</title>
<style>
:root{
  --nav:#1F4D3A; --nav-h:#2A5E49; --nav-ink:#DCE8E1; --nav-sub:#8FAE9F; --gold:#D8B16E;
  --bg:#F5F6F4; --card:#FFFFFF; --ink:#1B2620; --sub:#6B7871; --line:#E3E8E5; --brand:#2F6B4F; --brand-soft:#E3F0E8;
  --ok:#2E8B57; --warn:#B98600; --bad:#D64545; --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.05);
  --w:232px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --nav:#14251D; --nav-h:#1D3429; --nav-ink:#D5E3DB; --nav-sub:#7E9A8C;
  --bg:#111513; --card:#1A201D; --ink:#E8EEEA; --sub:#93A199; --line:#2B3631; --brand:#6CC592; --brand-soft:#1F3A2B;
  --ok:#6CC592; --warn:#E8C04E; --bad:#FF7A7A; --shadow:none; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
[hidden]{display:none!important}

/* ---------- 왼쪽 메뉴 ---------- */
.nav{position:fixed;inset:0 auto 0 0;width:var(--w);background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;z-index:30;transition:transform .22s ease;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 6px 18px}
.mk{width:40px;height:40px;border-radius:11px;background:var(--gold);display:grid;place-items:center;color:#2A2415;font-weight:900;font-size:20px;flex:0 0 auto}
.brand b{display:block;font-size:19px;color:#fff;letter-spacing:-.02em;line-height:1.15}
.brand small{color:var(--nav-sub);font-size:12px}
.lbl{font-size:10.5px;letter-spacing:.14em;color:var(--nav-sub);font-weight:700;padding:6px 10px 8px}
.mi{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--nav-ink);padding:10px 11px;border-radius:10px;font-size:14.5px;font-weight:600;text-align:left;margin-bottom:2px}
.mi:hover{background:var(--nav-h)}
.mi .bdg{margin-left:auto;background:#E5533D;color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:0 8px;min-width:22px;text-align:center;line-height:20px}
.mi[aria-current="page"]{background:#fff;color:#1A3B2C}
.mi .car{margin-left:auto;transition:transform .15s;opacity:.7}
.mi[aria-expanded="true"] .car{transform:rotate(90deg)}
.subm{display:none;margin:0 0 4px 0;padding-left:30px;flex-direction:column;gap:1px;border-left:1px solid rgba(255,255,255,.12);margin-left:19px}
.subm.on{display:flex}
.si{border:0;background:none;color:var(--nav-ink);opacity:.85;text-align:left;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600}
.si:hover{background:var(--nav-h);opacity:1} .si[aria-current="page"]{color:#fff;opacity:1;background:var(--nav-h);box-shadow:inset 3px 0 0 var(--gold)}
.grow{flex:1}
.nfoot{border-top:1px solid rgba(255,255,255,.12);padding:12px 6px 0;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ver{display:inline-block;align-self:flex-start;background:rgba(255,255,255,.14);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.nfoot b{color:#fff;font-size:14px} .nfoot small{color:var(--nav-sub);font-size:12px}
.hidebtn{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:none;color:var(--nav-ink);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600}
.hidebtn:hover{background:var(--nav-h)}

/* ---------- 본문 ---------- */
.main{position:fixed;inset:0 0 0 var(--w);display:flex;flex-direction:column;transition:left .22s ease,inset .22s ease}
body.nav-hidden .nav{transform:translateX(-102%)}
body.nav-hidden .main{inset:0}
.bar{height:54px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:0 0 auto}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink)}
.ib:hover{border-color:var(--brand);color:var(--brand)}
.crumb small{display:block;color:var(--sub);font-size:11.5px;line-height:1.2} .crumb b{font-size:16.5px;letter-spacing:-.01em}
.sp{flex:1}
.lk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none}
.lk:hover{border-color:var(--brand);color:var(--brand)}
.pages{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0;overflow:auto}
iframe.fr{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
body.nav-temp .scrim{background:rgba(10,20,15,.06)}
body.nav-temp:not(.nav-hidden) .scrim{opacity:1;pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s}

/* ---------- 오늘 현황 ---------- */
.dash{max-width:1180px;margin:0 auto;padding:22px 24px 40px}
.dh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dh h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.2} .dh p{margin:3px 0 0;color:var(--sub);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 15px;height:38px;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--brand)} .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0E1A13}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{color:var(--sub);font-size:13px} .kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.kpi .bar2{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden} .kpi .bar2 i{display:block;height:100%;background:var(--brand);border-radius:99px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:16.5px;letter-spacing:-.01em} .cnt{background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;border-radius:99px;padding:1px 9px}
.more{margin-left:auto;border:0;background:none;color:var(--sub);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.more:hover{color:var(--brand)}
table{border-collapse:collapse;width:100%} th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:10px 16px;background:color-mix(in srgb,var(--bg) 70%,var(--card))}
td{padding:11px 16px;border-top:1px solid var(--line);font-size:14px;vertical-align:top} td.n{font-variant-numeric:tabular-nums;font-weight:700}
td small{display:block;color:var(--sub);font-size:12px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.tag.w{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)} .tag.g{background:color-mix(in srgb,var(--sub) 16%,transparent);color:var(--sub)}
.empty{padding:34px 16px;text-align:center;color:var(--sub)}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.st{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.st b{display:block;font-size:14.5px} .st small{color:var(--sub);font-size:12px}
.st .tm{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;white-space:nowrap} .st .tm small{display:block;font-weight:500}
.note{padding:10px 18px;color:var(--sub);font-size:12.5px;background:color-mix(in srgb,var(--bg) 70%,var(--card));border-top:1px solid var(--line)}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
.err{color:var(--bad);padding:16px 18px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1}

/* ---------- 휴대폰 ---------- */
@media (max-width:860px){
  .main{inset:0!important}
  .nav{box-shadow:6px 0 30px rgba(0,0,0,.25)}
  body.nav-hidden .nav{transform:translateX(-102%)}
  body:not(.nav-hidden) .scrim{opacity:1;pointer-events:auto}
  .dash{padding:16px 14px 40px} .dh h1{font-size:22px}
  .lk span{display:none} .lk{padding:0 10px}
  th:nth-child(5),td:nth-child(5){display:none}
  .hidebtn{display:none}
}
@media (prefers-reduced-motion:reduce){.nav,.main{transition:none}}
</style>
</head>
<body>
<aside class="nav" id="nav" aria-label="메뉴">
  <div class="brand"><div class="mk">일</div><div><b>일품집</b><small>통합 운영관리</small></div></div>
  <div class="lbl">WORKSPACE</div>
  <nav id="menu"></nav>
  <div class="grow"></div>
  <div class="nfoot"><span class="ver">V2.0</span><b>일품집 통합관리</b><small>예약부터 근무까지, 한곳에서</small>
    <button class="hidebtn" id="hideBtn"><svg class="i" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>메뉴 숨기기</button></div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main" id="main">
  <header class="bar">
    <button class="ib" id="tog" aria-label="메뉴 숨기기 / 보이기" title="메뉴 숨기기 / 보이기"><svg class="i" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="crumb"><small>일품집 통합관리</small><b id="ttl">오늘 현황</b></div>
    <span class="sp"></span>
    <button class="lk" id="acct" hidden></button>
    <button class="lk" id="reload" title="새로고침"><svg class="i" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>새로고침</span></button>
    <a class="lk" id="solo" target="_blank" rel="noopener" title="이 화면만 새 창으로"><svg class="i" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span>새 창</span></a>
  </header>
  <section class="pages" id="pages"><div class="page" id="p-dash"><div class="dash" id="dash"></div></div></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/*ENGINE*/

/* ================= 설정 (파일 이름이 다르면 여기만 고치세요) ================= */
const FILES={ res:'reserve.html', sch:'ilpum-schedule.html', pay:'pay.html',
              ord:'order.html', notice:'notice.html', board:'board.html', site:'site.html' };
const NEW={url:'https://bdqcrbnbuoujozlpttbe.supabase.co',key:'/*NEWKEY*/'};   // 근무표 · 예약 (둘 다 새 서버, 매장별로 나뉨)

/* ================= 메뉴 ================= */
const ICON={
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  card:'<rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/>',
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  car:'<polyline points="9 18 15 12 9 6"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  map:'<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>',
  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
// 화면 하나하나: frame = 어떤 창에 띄울지, view = 근무표 안의 어느 화면인지
const ROUTES={
  dash:{t:'오늘 현황'}, res:{t:'예약 관리',frame:'res'},
  staff:{t:'직원 관리',frame:'sch',view:'staff'},
  cards:{t:'근무 스케줄',frame:'sch',view:'cards'}, week:{t:'근무 스케줄 · 주간표',frame:'sch',view:'week'}, day:{t:'근무 스케줄 · 하루',frame:'sch',view:'day'},
  rules:{t:'근무 스케줄 · 기간 설정',frame:'sch',view:'rules'}, me:{t:'근무 스케줄 · 내 스케줄',frame:'sch',view:'me'},
  pay:{t:'급여 관리',frame:'pay'}, hq:{t:'매장 관리',frame:'sch',view:'hq'}, acct:{t:'계정 · 권한',frame:'sch',view:'acct'}, set:{t:'설정',frame:'sch',view:'set'},
  ord:{t:'발주 관리',frame:'ord'}, notice:{t:'공지사항',frame:'notice'}, board:{t:'게시판 · 본사와 1:1 상담',frame:'board'}, site:{t:'상권 분석',frame:'site'}
};
// 왼쪽 메뉴 (테이블 현황은 예약 관리 안에 있어서 넣지 않았어요)
const MENU=[
  {id:'notice',label:'공지사항',icon:'bell'},
  {id:'dash',label:'오늘 현황',icon:'grid'},
  {id:'res',label:'예약 관리',icon:'cal'},
  {id:'sch',label:'근무 스케줄',icon:'clock',sub:[['cards','스케줄'],['week','주간표'],['day','하루'],['rules','기간 설정'],['me','내 스케줄']]},
  {id:'staff',label:'직원 관리',icon:'user',needEdit:true},
  {id:'pay',label:'급여 관리',icon:'card',payOnly:true},
  {id:'board',label:'게시판',icon:'chat',boardOnly:true},
  {id:'hq',label:'매장 관리',icon:'home',needHq:true},
  {id:'site',label:'상권 분석',icon:'map',hqOnly:true},
  {id:'acct',label:'계정 · 권한',icon:'user',needAcct:true},
  {id:'set',label:'설정',icon:'gear',needEdit:true},
  {id:'ord',label:'발주 관리',icon:'cart'}
];
const GROUP_OF={cards:'sch',week:'sch',day:'sch',rules:'sch',me:'sch'};
function buildMenu(){
  $('#menu').innerHTML=MENU.map(m=>m.sub
    ?`<button class="mi" data-g="${m.id}" ${m.hqOnly?'data-hqonly="1"':''} aria-expanded="false">${ic(m.icon)}<span>${m.label}</span><span class="car">${ic('car')}</span></button><div class="subm" id="sub-${m.id}">${m.sub.map(s=>`<button class="si" data-go="${s[0]}">${s[1]}</button>`).join('')}</div>`
    :`<button class="mi" data-go="${m.id}" data-m="${m.id}" ${m.hqOnly?'data-hqonly="1"':''} ${m.payOnly?'data-payonly="1"':''} ${m.boardOnly?'data-boardonly="1"':''} ${m.needEdit?'data-edit="1"':''} ${m.needHq?'data-hq="1"':''} ${m.needAcct?'data-acct="1"':''}>${ic(m.icon)}<span>${m.label}</span></button>`).join('');
}

/* ================= 로그인 확인 · 내 매장 ================= */
// 근무표 화면과 같은 저장소(localStorage)에 로그인 정보가 있어요. 로그인이 없으면 로그인 화면부터 보여요.
// 본사 계정: 모든 기능 / 가맹점 계정: 자기 매장의 근무표만 (예약·급여·발주 메뉴는 숨김)
let ME={mode:'none',hq:false,store:null,token:'',email:''};
// 급여 메뉴는 금액을 볼 수 있는 계정(본사=본점 / 점주 / 허용된 매니저)에게만 보여요
const allowed=id=>ME.orderOnly?id==='ord':!(ME.mode==='in'&&((id==='pay'&&!ME.canPay)||(id==='board'&&!ME.board)||(id==='acct'&&!ME.acct)||(id==='site'&&!ME.hq)));
function readConf(){ try{ return JSON.parse(localStorage.getItem('ilpum-fr-conf'))||{}; }catch(e){ return {}; } }
function readSes(){ const c=readConf(); if(c.ses) return c.ses; try{ const t=sessionStorage.getItem('fr-ses'); if(t) return JSON.parse(t); }catch(e){} return null; }
async function refreshSes(ses){
  const r=await fetch(NEW.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:NEW.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ses.refresh_token})});
  const j=await r.json().catch(()=>({})); if(!r.ok||!j.access_token) throw new Error('refresh');
  try{ const c=readConf(); if(c.ses){ c.ses=j; localStorage.setItem('ilpum-fr-conf',JSON.stringify(c)); } else sessionStorage.setItem('fr-ses',JSON.stringify(j)); }catch(e){}
  return j;
}
async function whoami(){
  const c=readConf(); let ses=readSes();
  if(!ses||!ses.access_token){ ME={mode:(c.mode==='local')?'open':'none',hq:true,store:null,token:'',email:''}; return; }

window.addEventListener('message',e=>{
  const m=e.data; if(!m||!m.type) return;

  if(m.type==='fr-stores'){ Object.keys(frames).forEach(k=>{ if(k!=='sch'){ try{ frames[k].remove(); }catch(er){} delete frames[k]; } }); refreshBadges(); return; }     // 매장·계정이 바뀌면 다른 화면은 다음에 열 때 새로 불러옴(매장 목록 갱신)

async function sget(srv,path,opt){ const {token,...o}=opt||{}; const r=await fetch(srv.url+path,{headers:{apikey:srv.key,Authorization:'Bearer '+(token||srv.key),'Content-Type':'application/json'},...o}); if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; throw e; } return r.json(); }
const peopleOf=s=>String(s||'').split(/[+,]/).reduce((a,x)=>a+(parseInt(x,10)||0),0);
const isCxl=x=>/취소/.test(x.tnote||'');
const hhmm=t=>{ const m=String(t||'').match(/^(\d{1,2}):?(\d{2})$/); return m?pad(+m[1])+':'+m[2]:''; };
const toM=t=>{ const m=hhmm(t); return m?(+m.slice(0,2))*60+(+m.slice(3)):null; };
let dashData=null, soonAt=null;
// 전송량 아끼기: 자동 새로고침 때는 예약은 '번호(rev)'만 먼저 확인하고, 근무표는 30분에 한 번만 다시 받아요 (새로고침 버튼은 바로 다시 받음)
let dashRes=null, dashItems=null;
async function tokenNow(){
  const s=readSes(); if(!s) return ''; if((s.expires_at||0)*1000>Date.now()+60000) return s.access_token;
  const run=async()=>{ const s2=readSes(); if(s2&&(s2.expires_at||0)*1000>Date.now()+60000) return s2; return refreshSes(s2||s); };
  try{ const j=await (navigator.locks?navigator.locks.request('ilpum-refresh',run):run()); return j.access_token; }catch(e){ return s.access_token; }
}
async function loadDash(manual){

  if(!dashData) el.innerHTML='<div class="empty">불러오는 중…</div>';

  const tk=ME.mode==='in'?await tokenNow():'';
  await Promise.all([
    (async()=>{ try{
        if(ME.mode!=='in') throw new Error('로그인하면 예약이 보여요'); if(!ME.store) throw new Error('연결된 매장이 없어요');
        const base=`/rest/v1/res_days?store_id=eq.${ME.store.id}&id=eq.${key}`;
        if(!manual&&dashRes&&dashRes.key===key&&dashRes.sid===ME.store.id){ const r0=await sget(NEW,base+'&select=rev',{token:tk}); if(r0[0]&&r0[0].rev===dashRes.rev||!r0[0]&&dashRes.rev===0){ out.res=dashRes.items; return; } }
        const rows=await sget(NEW,base+'&select=data,rev',{token:tk}); const items=((rows[0]&&rows[0].data&&rows[0].data.items)||[]).filter(x=>!x.deleted);
        dashRes={key,sid:ME.store.id,rev:rows[0]?rows[0].rev:0,items}; out.res=items; }catch(e){ out.resErr=e.message; } })(),
    (async()=>{ try{
        let st; if(ME.mode==='in'){ st=ME.store; if(!st) throw new Error(ME.err||'연결된 매장이 없어요'); }
        else{ const os=await sget(NEW,'/rest/v1/rpc/sch_open_store',{method:'POST',body:'{}'}); st=os&&os[0]; }
        if(!st) throw new Error('매장을 찾지 못했어요');
        let items;

        else{ const rows=await sget(NEW,`/rest/v1/sch_items?store_id=eq.${st.id}&deleted=eq.false&id=not.like.calc:*&kind=neq.site&select=kind,id,data`,{token:tk}); items={}; rows.forEach(r=>(items[r.kind]=items[r.kind]||{})[r.id]=r.data); dashItems={sid:st.id,at:Date.now(),items}; }
        const D=buildD(items,st.name); out.staff={D,R:resolve(D,now),name:st.name};

  ]);

     ${d.staffErr?`<div class="err">근무표를 불러오지 못했어요 (${esc(d.staffErr)})</div>`:L.length?`<div class="staff">${sorted.map(x=>{ const [a,b]=spanOf(d.staff.D.store,x.sh); const t=m=>pad(Math.floor(m/60))+':'+pad(m%60); const lb=shLbl(x.sh,d.staff.D.store);
       return `<div class="st"><div class="av">${esc((x.name||'?')[0])}</div><div><b>${esc(x.name)}</b>${x.nl?` <span style="font-size:11.5px;font-weight:700;color:var(--mute,#8A9098);background:rgba(128,128,128,.18);border-radius:5px;padding:0 5px">${esc(x.nl)}</span>`:''}<small>${esc(x.pos)}${x.type==='spot'?' · 단기':x.type==='weekly'?' · 매주 변동':''}</small></div><div class="tm">${t(a)}<small>~ ${t(b)}${lb?' · '+esc(lb):''}</small></div></div>`; }).join('')}</div>`:'<div class="empty">오늘 출근자가 없어요.</div>'}
     <div class="note">근무 시간·휴무는 날짜별로 바꿀 수 있어요 (근무 스케줄)</div></div>
    ${noRes?'':`<div class="panel"><div class="ph"><h2>곧 들어올 예약</h2><span class="sp" style="flex:1"></span><select id="soonSel">${opts.map(m=>`<option value="${m}" ${m===soonAt?'selected':''}>${fmtT(m)}</option>`).join('')}</select></div>
     ${d.resErr?'':soon.length?`<div style="overflow-x:auto"><table><thead><tr><th>시간</th><th>고객 / 연락처</th><th>인원</th><th>테이블</th><th>요청사항</th><th>상태</th></tr></thead><tbody>${soon.map(resRow).join('')}</tbody></table></div>`:`<div class="empty">선택 시간부터 150분 이내 예정된 예약이 없어요.</div>`}</div>`}
   <p style="color:var(--sub);font-size:12px;margin:0">${esc(d.staff&&d.staff.name||'')} 기준이에요 · ${ds(now)} · ${pad(now.getHours())}:${pad(now.getMinutes())} 기준</p>`;
}
document.addEventListener('click',e=>{ const j=e.target.closest('[data-jump]'); if(j) go(j.dataset.jump); if(e.target.id==='dRef') loadDash(true); });
document.addEventListener('change',e=>{ if(e.target.id==='soonSel'){ soonAt=+e.target.value; renderDash(); } });
const IDLE_MS=10*60*1000; let lastActive=Date.now();       // 10분 동안 아무도 안 만졌으면 자동 새로고침을 멈춰요 (켜 둔 채 방치된 기기가 서버를 계속 두드리지 않도록)
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ const was=Date.now()-lastActive; lastActive=Date.now(); if(was>IDLE_MS&&cur==='dash') loadDash(); },{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ lastActive=Date.now(); if(cur==='dash') loadDash(); } });
setInterval(()=>{ if(cur==='dash'&&!document.hidden&&Date.now()-lastActive<IDLE_MS) loadDash(); },60000);
setInterval(()=>{ if(cur!=='dash'&&!document.hidden&&Date.now()-lastActive<IDLE_MS) refreshOrders(); },90000);      // 다른 화면을 보고 있어도 발주가 들어오면 메뉴에 숫자가 떠요

/* ================= 시작 ================= */
buildMenu();
(async function(){
  await whoami(); if(ME.mode==='none'){ showGate(); return; } applyMe(); if(!ME.orderOnly) refreshOrders();
  let open=true; try{ const v=localStorage.getItem('ilpum-nav'); if(v==='hidden') open=false; }catch(e){} if(mobile()) open=false;
  document.body.classList.toggle('nav-hidden',!open);
  let start=location.hash.slice(1); if(!ROUTES[start]){ try{ start=localStorage.getItem('ilpum-page'); }catch(e){} } go(ME.orderOnly?'ord':(ROUTES[start]?start:'dash'));
})();
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(ROUTES[h]&&h!==cur) go(h); });
</script>
</body>
</html>
